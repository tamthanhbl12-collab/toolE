    <div class="text-xs text-gray-400 mt-1">Bài ${lessons[set.li].id} • Gõ tên đúng cho từng số • <span id="ivScore">0</span>/${items.length} đúng</div>${set.credit?`<div class="text-[11px] text-gray-500 mt-1">📷 ${escHtml(set.credit)}</div>`:''}</div>
   <div class="ivWrap" id="ivImg"><img src="${set.src}" alt="${escHtml(set.title)}" draggable="false"></div>
   <div class="flex flex-wrap justify-center gap-2">
    <button id="ivCheck" class="ivBtn pri">✅ Kiểm tra</button>
    <button id="ivReveal" class="ivBtn">👁 Hiện đáp án</button>
    <button id="ivReset" class="ivBtn">🔄 Làm lại</button>
    <button id="ivShuf" class="ivBtn">🔀 Trộn thứ tự</button>
    <button id="ivIpa" class="ivBtn ${cfg.showIpa?'on':''}">🔤 Phiên âm</button>
    <button id="ivBank" class="ivBtn ${cfg.bank?'on':''}">💡 Gợi ý từ</button>
    ${set.builtin?'':'<button id="ivEdit" class="ivBtn">✏️ Sửa</button><button id="ivDel" class="ivBtn" style="color:#F87171">🗑️ Xóa</button>'}
   </div>
   <div id="ivBankBox" class="flex flex-wrap justify-center gap-2"></div>
   <div id="ivRows" class="flex flex-col gap-2 max-w-[760px] w-full mx-auto"></div>`;
  const q=s=>box.querySelector(s); const img=q('#ivImg');
  const byN=n=>items.find(it=>it.n===n);
  // tags
  items.forEach(it=>{
    const t=document.createElement('div'); t.className='ivTag'; t.dataset.n=it.n;
    t.style.cssText+=`left:${it.x}%;top:${it.y}%;width:${it.w}%;height:${it.h}%;`;
    t.innerHTML=`<span class="ivN">${it.n}</span><span class="ivW"></span>`;
    t.onclick=()=>{ selN=it.n; paint(); const inp=q(`#ivRows input[data-n="${it.n}"]`); if(inp){ inp.scrollIntoView({block:'center',behavior:'smooth'}); inp.focus({preventScroll:true}); } };
    img.appendChild(t);
  });
  (set.covers||[]).forEach((c,ci)=>{
    const d=document.createElement('div'); d.className='ivCover'; d.dataset.ci=ci;
    d.style.cssText+=`left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%;`;
    d.textContent=c.w>=25?'🔒 '+(c.label||'Phần bị che')+' – bấm để xem':'🔒'; d.title=(c.label||'Phần bị che')+' – bấm để xem';
    d.onclick=()=>{ coverShown[ci]=!coverShown[ci]; paint(); };
    img.appendChild(d);
  });
  function mkRows(){
    const rows=q('#ivRows'); rows.innerHTML='';
    order.forEach(n=>{
      const it=byN(n); const r=document.createElement('div'); r.className='ivRow'; r.dataset.n=n;
      r.innerHTML=`<div class="ivN2">${n}</div><input data-n="${n}" placeholder="Gõ tên tiếng Anh của số ${n}" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="ivBtn spk" title="Nghe đọc" style="padding:6px 10px">🔊</button><div class="ivHint"></div>`;
      const inp=r.querySelector('input'); inp.value=state[n].val;
      inp.oninput=()=>{ state[n].val=inp.value; if(state[n].st==='bad'||state[n].st==='') state[n].st=''; };
      inp.onfocus=()=>{ selN=n; paintTags(); };
      inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); checkOne(n); const idx=order.indexOf(n); const nx=order[idx+1]; const ni=nx&&q(`#ivRows input[data-n="${nx}"]`); if(ni) ni.focus(); } };
      r.querySelector('.spk').onclick=()=>{ speakText(cleanForSpeech(it.word),'en'); };
      rows.appendChild(r);
    });
    paint();
  }
  function checkOne(n){ const it=byN(n); const s=state[n]; if(!s.val.trim()){ s.st=''; } else if(imgvEq(s.val,it)) s.st='ok'; else s.st='bad'; paint(); }
  function paintTags(){
    items.forEach(it=>{
      const t=img.querySelector(`.ivTag[data-n="${it.n}"]`); const s=state[it.n];
      t.className='ivTag'+(s.st==='ok'?' ok':s.st==='show'?' show':s.st==='bad'?' bad':'')+(selN===it.n?' sel':'');
      t.querySelector('.ivW').textContent = (s.st==='ok'||s.st==='show') ? it.word : '';
      const solved=(s.st==='ok'||s.st==='show'); if(solved && it.x>62){ t.style.left='auto'; t.style.right=(100-it.x-it.w)+'%'; } else { t.style.left=it.x+'%'; t.style.right=''; }
    });
    (set.covers||[]).forEach((c,ci)=>{ const d=img.querySelector(`.ivCover[data-ci="${ci}"]`); d.style.display=coverShown[ci]?'none':'flex'; });
  }
  function paint(){
    paintTags();
    let ok=0;
    q('#ivRows').querySelectorAll('.ivRow').forEach(r=>{
      const n=+r.dataset.n, it=byN(n), s=state[n]; if(s.st==='ok') ok++;
      r.className='ivRow'+(s.st==='ok'?' ok':s.st==='bad'?' bad':'');
      const inp=r.querySelector('input'); if(s.st==='show'){ inp.value=it.word; } inp.disabled=(s.st==='ok'||s.st==='show');
      let h='';
      if(s.st==='ok'||s.st==='show'){ h=`<b style="color:#8CB580">${escHtml(it.word)}</b>`+(cfg.showIpa&&it.ipa?` <span class="font-mono">${escHtml(it.ipa)}</span>`:'')+(it.vi?` • ${escHtml(it.vi)}`:'')+(it.note?`<br><span style="font-style:italic">${escHtml(it.note)}${it.noteVi?' – '+escHtml(it.noteVi):''}</span>`:''); }
      else if(s.st==='bad'){ h='<span style="color:#F87171">❌ Chưa đúng, thử lại (bấm 🔊 để nghe gợi ý)</span>'+(cfg.showIpa&&it.ipa?` • <span class="font-mono">${escHtml(it.ipa)}</span>`:''); }
      else if(cfg.showIpa&&it.ipa){ h='Phiên âm: <span class="font-mono">'+escHtml(it.ipa)+'</span>'+(it.vi?' • '+escHtml(it.vi):''); }
      r.querySelector('.ivHint').innerHTML=h; r.querySelector('.ivHint').style.display=h?'block':'none';
    });
    q('#ivScore').textContent=ok;
    const bank=q('#ivBankBox'); bank.innerHTML='';
    if(cfg.bank){ const used=new Set(items.filter(it=>state[it.n].st==='ok'||state[it.n].st==='show').map(it=>it.word));
      imgvShuffle(items.map(it=>it.word).sort()).forEach(w=>{ const c=document.createElement('button'); c.className='ivChip'+(used.has(w)?' used':''); c.textContent=w; c.onclick=()=>{ const target=(selN&&state[selN].st!=='ok'&&state[selN].st!=='show')?selN:(order.find(n=>state[n].st!=='ok'&&state[n].st!=='show')); if(!target) return; state[target].val=w; const inp=q(`#ivRows input[data-n="${target}"]`); inp.value=w; checkOne(target); }; bank.appendChild(c); }); }
    if(ok===items.length && !box.dataset.done){ box.dataset.done='1'; toast('🎉 Đúng hết '+items.length+'/'+items.length+'!'); }
  }
  q('#ivCheck').onclick=()=>{ order.forEach(n=>{ if(state[n].st!=='ok'&&state[n].st!=='show') checkOne(n); }); };
  q('#ivReveal').onclick=()=>{ items.forEach(it=>{ if(state[it.n].st!=='ok') state[it.n].st='show'; }); (set.covers||[]).forEach((c,ci)=>coverShown[ci]=true); paint(); };
  q('#ivReset').onclick=()=>{ items.forEach(it=>state[it.n]={val:'',st:''}); coverShown={}; delete box.dataset.done; selN=null; mkRows(); };
  q('#ivShuf').onclick=()=>{ imgvShuffle(order); mkRows(); };
  q('#ivIpa').onclick=()=>{ cfg.showIpa=!cfg.showIpa; q('#ivIpa').classList.toggle('on',cfg.showIpa); paint(); };
  q('#ivBank').onclick=()=>{ cfg.bank=!cfg.bank; q('#ivBank').classList.toggle('on',cfg.bank); paint(); };
  if(!set.builtin){
    q('#ivEdit').onclick=()=>imgvEdit(wrap, JSON.parse(JSON.stringify(set)));
    q('#ivDel').onclick=()=>{ if(confirm('Xóa bộ ảnh "'+set.title+'"?')){ const ll=lessons[set.li]; ll.imgs=(ll.imgs||[]).filter(x=>x.id!==set.id); imgvSave(); cfg.setId=null; renderAll(); } };
  }
  mkRows();
}

function imgvStartAdd(wrap){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const url=URL.createObjectURL(f); const im=new Image();
    im.onload=()=>{ const max=1100, k=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      imgvEdit(wrap,{id:'u'+Date.now(), li:currentLesson, title:'', src:cv.toDataURL('image/jpeg',0.75), items:[], covers:[], builtin:false, isNew:true}); };
    im.onerror=()=>toast('Không đọc được ảnh này','#F87171'); im.src=url; };
  inp.click();
}
function imgvEdit(wrap, draft){
  wrap.innerHTML='';
  const box=document.createElement('div'); box.className='flex flex-col gap-3'; wrap.appendChild(box);
  box.innerHTML=`
   <div class="text-center"><div class="font-bold text-[15px]">${draft.isNew?'➕ Thêm ảnh từ vựng':'✏️ Sửa ảnh từ vựng'}</div>
    <div class="text-xs text-gray-400 mt-1">Dùng chuột/ngón tay <b>kéo một khung</b> trên ảnh để che tên từ (mỗi khung = 1 số), rồi nhập từ đáp án bên dưới.</div></div>
   <div class="flex flex-wrap gap-2 justify-center max-w-[760px] w-full mx-auto">
    <input id="edTitle" class="flex-1 min-w-[200px] bg-[#1E1E1E] border border-[#2A2A2A] rounded-full px-4 py-2 text-sm outline-none" placeholder="Tên bộ ảnh (vd: Hệ sinh dục cái)" value="${escHtml(draft.title)}">
    <select id="edLesson" class="bg-[#1E1E1E] border border-[#2A2A2A] rounded-full px-3 py-2 text-sm">${lessons.map((l,i)=>`<option value="${i}" ${i===draft.li?'selected':''}>Bài ${l.id}: ${escHtml(l.title)}</option>`).join('')}</select>
   </div>
   <div class="ivWrap" id="edImg" style="touch-action:none;cursor:crosshair"><img src="${draft.src}" draggable="false"></div>
   <div id="edRows" class="flex flex-col gap-2 max-w-[760px] w-full mx-auto"></div>
   <div class="flex justify-center gap-2"><button id="edCancel" class="ivBtn">Hủy</button><button id="edSave" class="ivBtn pri">💾 Lưu bộ ảnh</button></div>`;
  const q=s=>box.querySelector(s); const img=q('#edImg'); let selN=null;
  function paintBoxes(){ img.querySelectorAll('.ivEd').forEach(e=>e.remove());
    draft.items.forEach(it=>{ const d=document.createElement('div'); d.className='ivEd'+(selN===it.n?' sel':''); d.style.cssText=`left:${it.x}%;top:${it.y}%;width:${it.w}%;height:${it.h}%;`; d.innerHTML=`<span>${it.n}</span>`; img.appendChild(d); }); }
  function mkRows(focusN){
    const rows=q('#edRows'); rows.innerHTML='';
    draft.items.forEach(it=>{
      const r=document.createElement('div'); r.className='card rounded-2xl p-3 flex flex-wrap gap-2 items-center';
      r.innerHTML=`<div class="ivN2" style="width:30px;height:30px;border-radius:50%;background:#FACC15;color:#000;font-weight:800;display:flex;align-items:center;justify-content:center">${it.n}</div>
        <input data-f="word" class="flex-1 min-w-[150px] bg-[#0F0F0F] border border-[#2A2A2A] rounded-xl px-3 py-2 text-[16px] outline-none" placeholder="Từ tiếng Anh (đáp án)" value="${escHtml(it.word||'')}">
        <input data-f="ipa" class="flex-1 min-w-[130px] bg-[#0F0F0F] border border-[#2A2A2A] rounded-xl px-3 py-2 text-[16px] outline-none" placeholder="Phiên âm (tùy chọn)" value="${escHtml(it.ipa||'')}">
        <input data-f="vi" class="flex-1 min-w-[130px] bg-[#0F0F0F] border border-[#2A2A2A] rounded-xl px-3 py-2 text-[16px] outline-none" placeholder="Nghĩa tiếng Việt (tùy chọn)" value="${escHtml(it.vi||'')}">
        <button type="button" class="ivBtn" style="color:#F87171">🗑️</button>`;
      r.querySelectorAll('input').forEach(i=>{ i.oninput=()=>{ it[i.dataset.f]=i.value; }; i.onfocus=()=>{ selN=it.n; paintBoxes(); }; });
      r.querySelector('button').onclick=()=>{ draft.items=draft.items.filter(x=>x!==it); draft.items.forEach((x,i)=>x.n=i+1); selN=null; paintBoxes(); mkRows(); };
      rows.appendChild(r);
      if(focusN===it.n) setTimeout(()=>r.querySelector('input').focus(),0);
    });
    if(!draft.items.length) rows.innerHTML='<div class="text-center text-sm text-gray-400">Chưa có khung nào – kéo trên ảnh để tạo khung đầu tiên.</div>';
  }
  // vẽ khung bằng kéo thả
  let start=null, tmp=null;
  const pos=e=>{ const r=img.getBoundingClientRect(); return {x:Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)), y:Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100))}; };
  img.onpointerdown=e=>{ e.preventDefault(); start=pos(e); tmp=document.createElement('div'); tmp.className='ivDraw'; img.appendChild(tmp); try{ img.setPointerCapture(e.pointerId); }catch(_){} };
  img.onpointermove=e=>{ if(!start) return; const p=pos(e); const x=Math.min(start.x,p.x), y=Math.min(start.y,p.y), w=Math.abs(p.x-start.x), h=Math.abs(p.y-start.y); tmp.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%;`; };
  img.onpointerup=e=>{ if(!start) return; const p=pos(e); const x=Math.min(start.x,p.x), y=Math.min(start.y,p.y), w=Math.abs(p.x-start.x), h=Math.abs(p.y-start.y); tmp.remove(); tmp=null; start=null;
    if(w<2||h<1.2){ return; }
    const n=draft.items.length+1; draft.items.push({n, x:+x.toFixed(2), y:+y.toFixed(2), w:+w.toFixed(2), h:+h.toFixed(2), word:'', ipa:'', vi:''}); selN=n; paintBoxes(); mkRows(n); };
  q('#edCancel').onclick=()=>renderAll();
  q('#edSave').onclick=()=>{
    const title=q('#edTitle').value.trim(); const li=+q('#edLesson').value;
    if(!title){ toast('Hãy đặt tên cho bộ ảnh','#F87171'); q('#edTitle').focus(); return; }
    const items=draft.items.filter(it=>String(it.word||'').trim());
    if(!items.length){ toast('Cần ít nhất 1 khung có từ đáp án','#F87171'); return; }
    items.forEach((it,i)=>it.n=i+1);
    const rec={id:draft.id, title, src:draft.src, items:items.map(it=>({n:it.n,x:it.x,y:it.y,w:it.w,h:it.h,word:it.word.trim(),alts:it.alts||[],ipa:(it.ipa||'').trim(),vi:(it.vi||'').trim()})), covers:[]};
    lessons.forEach(l=>{ if(l.imgs) l.imgs=l.imgs.filter(x=>x.id!==rec.id); });
    const ll=lessons[li]; if(!Array.isArray(ll.imgs)) ll.imgs=[]; ll.imgs.push(rec);
    if(!imgvSave()){ ll.imgs=ll.imgs.filter(x=>x.id!==rec.id); toast('Bộ nhớ trình duyệt đầy – hãy xóa bớt ảnh cũ','#F87171'); return; }
    window.__imgvCfg.setId=rec.id; window.__imgvCfg.scope='lesson'; if(li!==currentLesson){ currentLesson=li; } toast('✅ Đã lưu bộ ảnh "'+title+'"'); renderAll();
  };
  paintBoxes(); mkRows();
}

function mmNorm(t){ return String(t||'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim(); }
function mmSing(t){ return t.replace(/(es|s)$/,''); }
function mmCollect(li,showNew){
  const ll=lessons[li]; const rows=[...(ll.vocab||[]),...(ll.extra||[])].filter(r=>r&&r[0]);
  const idx=new Map(); rows.forEach(r=>{ const k=mmNorm(r[0]); if(k&&!idx.has(k)) idx.set(k,r); const k2=mmSing(k); if(k2&&!idx.has(k2)) idx.set(k2,r); });
  const used=new Set(); const groups=[];
  (MM_GROUPS[ll.id]||[]).forEach((g,gi)=>{
    const rs=[]; g.w.forEach(w=>{ const k=mmNorm(w); const r=idx.get(k)||idx.get(mmSing(k)); if(r && !used.has(r)){ used.add(r); rs.push(r); } });
    if(rs.length) groups.push({n:g.n,vi:g.vi,i:g.i,c:MM_COLORS[gi%MM_COLORS.length],rows:rs});
  });
  const rest=rows.filter(r=>!used.has(r)); const restT=rest.filter(r=>!isNewWord(li,r)), restN=rest.filter(r=>isNewWord(li,r));
  if(restT.length) groups.push({n:'Từ khác',vi:'Chưa xếp nhóm',i:'📌',c:'#9CA3AF',rows:restT});
  if(showNew && restN.length) groups.push({n:'Từ mới trong bài đọc & bài tập',vi:'Không có trong bảng từ vựng',i:'📗',c:'#7DD3FC',rows:restN});
  return groups;
}
function mmCleanEn(t){ return String(t).replace(/\s*\((n|v|adj|adv)\)\s*$/i,'').trim(); }

function renderMindmap(area){

  const wrap=document.createElement('div'); wrap.className='flex flex-col gap-3 w-full'; area.appendChild(wrap);
  const bar=document.createElement('div'); bar.className='flex flex-wrap items-center justify-center gap-2';
  const b=(on,txt,attr)=>`<button ${attr} class="ivBtn ${on?'on':''}">${txt}</button>`;
  bar.innerHTML=b(cfg.layout==='map','🌐 Sơ đồ ngang','data-ly="map"')+b(cfg.layout==='list','📱 Danh sách nhóm','data-ly="list"')+'<span class="text-gray-600">|</span>'
   +b(cfg.hide==='none','👁 Hiện hết','data-h="none"')+b(cfg.hide==='vi','🙈 Che nghĩa VN','data-h="vi"')+b(cfg.hide==='en','🙈 Che tiếng Anh','data-h="en"')+'<span class="text-gray-600">|</span>'
   +b(cfg.showNew,'📗 Hiện từ mới','data-nw="1"')+'<span class="text-gray-600">|</span>'
   +b(cfg.scope==='lesson','📘 Bài này','data-sc="lesson"')+b(cfg.scope==='all','📚 Tất cả các bài','data-sc="all"');
  wrap.appendChild(bar);
  bar.querySelectorAll('[data-ly]').forEach(x=>x.onclick=()=>{ cfg.layout=x.dataset.ly; renderAll(); });
  bar.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>{ cfg.hide=x.dataset.h; renderAll(); });
  bar.querySelectorAll('[data-nw]').forEach(x=>x.onclick=()=>{ cfg.showNew=!cfg.showNew; renderAll(); });
  bar.querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{ cfg.scope=x.dataset.sc; renderAll(); });
  const tip=document.createElement('div'); tip.className='text-center text-xs text-gray-400';
  tip.textContent = cfg.hide==='none' ? 'Mẹo: bấm 🙈 để che nghĩa hoặc che tiếng Anh, tự nhớ rồi bấm vào ô để hiện đáp án và nghe đọc.' : 'Đang che — nhìn nhóm, tự nhớ từ rồi bấm vào ô để xem đáp án (có đọc tiếng Anh).';
  wrap.appendChild(tip);
  const lis = cfg.scope==='all' ? lessons.map((_,i)=>i) : [currentLesson];
  lis.forEach(li=>{
    const groups=mmCollect(li,cfg.showNew); if(!groups.length) return;
    const total=groups.reduce((s,g)=>s+g.rows.length,0);
    const head=document.createElement('div'); head.className='text-center font-bold text-[15px] mt-2';
    head.innerHTML=`Bài ${lessons[li].id}: ${escHtml(lessons[li].title)} <span class="text-xs font-normal text-gray-400">• ${groups.length} nhóm • ${total} từ</span>`;
    wrap.appendChild(head);
    const holder=document.createElement('div');
    holder.className=(cfg.hide==='vi'?'mmHideVi ':cfg.hide==='en'?'mmHideEn ':'');
    wrap.appendChild(holder);
    if(cfg.layout==='list') mmList(holder,groups); else mmMap(holder,groups,lessons[li]);
  });
}

function mmList(holder,groups){

      row.onclick=()=>{ row.classList.toggle('rev'); mmSpeak(r); }; d.appendChild(row); });

function mmMap(holder,groups,ll){
  const LW=250, LH=44, GW=190, GH=52, CW=210, CH=74, GAPX=70, GAPG=16, MX=14, MY=14;
  const total=groups.reduce((s,g)=>s+g.rows.length,0);
  const right=[], left=[]; let acc=0;
  groups.forEach(g=>{ if(acc<total/2 || !right.length){ right.push(g); acc+=g.rows.length; } else left.push(g); });
  const sideH=a=>a.reduce((s,g)=>s+g.rows.length*LH+GAPG,0)-(a.length?GAPG:0);
  const H=Math.max(sideH(right),sideH(left),CH)+MY*2;
  const W=MX*2+2*(LW+GAPX+GW+GAPX)+CW;
  const cx=W/2, cy=H/2;
  const box=document.createElement('div'); box.className='mmBox'; box.style.cssText=`width:${W}px;height:${H}px`;
  const zs=(window.__mmZ=window.__mmZ||{z:1,init:false});
  const tb=document.createElement('div'); tb.className='flex flex-wrap items-center justify-center gap-2 mb-2';
  tb.innerHTML='<button type="button" class="ivBtn" data-z="-" title="Thu nhỏ" style="min-width:42px;font-size:18px;line-height:1">−</button><span class="mmZl text-xs text-gray-300" style="min-width:48px;text-align:center">100%</span><button type="button" class="ivBtn" data-z="+" title="Phóng to" style="min-width:42px;font-size:18px;line-height:1">+</button><button type="button" class="ivBtn" data-z="fit">⤢ Vừa khung</button><button type="button" class="ivBtn" data-z="1">100%</button><span class="text-[11px] text-gray-500">Ctrl + lăn chuột để zoom • kéo thả để di chuyển</span>';
  holder.appendChild(tb);
  const sc=document.createElement('div'); sc.style.cssText='overflow:auto;max-width:100%;max-height:78vh;border:1px solid #2A2A2A;border-radius:16px;background:#101010;padding:6px;cursor:grab'; sc.className='mmScroll';
  const inner=document.createElement('div'); inner.style.cssText='position:relative'; inner.appendChild(box); sc.appendChild(inner); holder.appendChild(sc);
  box.style.transformOrigin='0 0';
  const zl=tb.querySelector('.mmZl');
  const applyZ=(nz,keep)=>{ nz=Math.min(2.2,Math.max(0.25,nz)); const old=zs.z||1; const cx=(sc.scrollLeft+sc.clientWidth/2)/old, cy=(sc.scrollTop+sc.clientHeight/2)/old; zs.z=nz; box.style.transform='scale('+nz+')'; inner.style.width=(W*nz)+'px'; inner.style.height=(H*nz)+'px'; zl.textContent=Math.round(nz*100)+'%'; if(keep){ sc.scrollLeft=cx*nz-sc.clientWidth/2; sc.scrollTop=cy*nz-sc.clientHeight/2; } };
  tb.querySelectorAll('[data-z]').forEach(bt=>bt.onclick=()=>{ const v=bt.dataset.z; if(v==='+') applyZ(zs.z*1.2,true); else if(v==='-') applyZ(zs.z/1.2,true); else if(v==='fit') applyZ((sc.clientWidth-14)/W,true); else applyZ(1,true); });
  sc.addEventListener('wheel',e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); applyZ(zs.z*(e.deltaY<0?1.1:1/1.1),true); } },{passive:false});
  // kéo thả để di chuyển (chuột)
  let drag=null;
  sc.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.button!==0) return; drag={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop,moved:false,id:e.pointerId}; });
  sc.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(!drag.moved && Math.abs(dx)+Math.abs(dy)>5){ drag.moved=true; sc.style.cursor='grabbing'; try{ sc.setPointerCapture(drag.id); }catch(_){} } if(drag.moved){ sc.scrollLeft=drag.l-dx; sc.scrollTop=drag.t-dy; } });
  const endDrag=()=>{ if(drag&&drag.moved){ sc._dragged=true; setTimeout(()=>{ sc._dragged=false; },0); } sc.style.cursor='grab'; drag=null; };
  sc.addEventListener('pointerup',endDrag); sc.addEventListener('pointercancel',endDrag);
  sc.addEventListener('click',e=>{ if(sc._dragged){ e.stopPropagation(); e.preventDefault(); } },true);
  const NS='http://www.w3.org/2000/svg'; const svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',W); svg.setAttribute('height',H); box.appendChild(svg);
  const curve=(x1,y1,x2,y2,col,sw)=>{ const p=document.createElementNS(NS,'path'); const mx=(x1+x2)/2; p.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`); p.setAttribute('stroke',col); p.setAttribute('stroke-width',sw); p.setAttribute('fill','none'); p.setAttribute('stroke-linecap','round'); svg.appendChild(p); };
  const node=(cls,x,y,w,h,html,col)=>{ const d=document.createElement('div'); d.className='mmNode '+cls; d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(col?`border-color:${col};`:''); d.innerHTML=html; box.appendChild(d); return d; };
  node('mmCenter',cx-CW/2,cy-CH/2,CW,CH,`<div>Bài ${ll.id}</div><div style="font-size:13px">${escHtml(ll.sub||ll.title)}</div>`);
  function side(arr,dir){
    let y=(H-sideH(arr))/2;
    arr.forEach(g=>{
      const gh=g.rows.length*LH; const gy=y+gh/2;
      const gx = dir>0 ? cx+CW/2+GAPX : cx-CW/2-GAPX-GW;
      const lx = dir>0 ? gx+GW+GAPX : gx-GAPX-LW;
      curve(dir>0?cx+CW/2:cx-CW/2, cy, dir>0?gx:gx+GW, gy, g.c, 3.5);
      node('mmGroup',gx,gy-GH/2,GW,GH,`<div>${g.i} ${escHtml(g.n)}</div><small>${escHtml(g.vi)}</small>`,g.c);
      g.rows.forEach((r,i)=>{
        const ly=y+i*LH;
        curve(dir>0?gx+GW:gx, gy, dir>0?lx:lx+LW, ly+LH/2-3, g.c, 1.6);
        const n=node('mmLeaf',lx,ly+1,LW,LH-5,`<div class="en">${escHtml(mmCleanEn(r[0]))}${r[1]?` <span class="ipa">${escHtml(r[1])}</span>`:''}</div><div class="vi">${escHtml(r[2]||'')}</div>`,g.c);
        n.onclick=()=>{ n.classList.toggle('rev'); mmSpeak(r); };
      });
      y+=gh+GAPG;
    });
  }
  side(right,1); side(left,-1);
  setTimeout(()=>{ if(!zs.init){ zs.init=true; zs.z=Math.min(1,Math.max(0.45,(sc.clientWidth-14)/W)); } applyZ(zs.z,false); sc.scrollLeft=Math.max(0,(W*zs.z-sc.clientWidth)/2); },0);
}

// ===== Tìm nghĩa tiếng Việt tương ứng trong câu dịch =====
const PairHL=(function(){
 const L=/\p{L}/u;
 const norm=t=>cleanForSpeech(String(t||'')).toLowerCase().replace(/[’']/g,"'").replace(/^[^\p{L}\d]+|[^\p{L}\d%]+$/gu,'').trim();
 function forms(w){ const f=new Set([w]); [[/ies$/,'y'],[/es$/,''],[/s$/,''],[/ied$/,'y'],[/ed$/,''],[/ed$/,'e'],[/d$/,''],[/ing$/,''],[/ing$/,'e'],[/ly$/,''],[/'s$/,'']].forEach(([r,x])=>{ if(r.test(w)) f.add(w.replace(r,x)); }); return [...f]; }
 function vocabMap(){ const m=new Map(); lessons.forEach(ll=>['vocab','extra'].forEach(k=>(ll[k]||[]).forEach(r=>{ const key=norm(r[0]); if(key && r[2]) { if(!m.has(key)) m.set(key,[]); m.get(key).push(r[2]); } }))); return m; }
 function splitMeaning(mn){ const out=[]; String(mn).split(/[,;\/]|\.\s|\bhoặc\b/).forEach(p=>{ p=p.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); if(!p) return; out.push(p); const q=p.replace(/^(sự|tính|việc|các|những|của)\s+/i,''); if(q!==p && q) out.push(q); }); return out; }
 // trả về [{en, means:[chuỗi hiển thị], cands:[chuỗi tìm trong câu TV]}]
 function lookup(txt){
  const vm=vocabMap(); const res=[];
  const get=k=>{ for(const f of forms(k)){ const v=vm.get(f), g=GLOSS[f]; if(v||g) return {means:v||[], gl:g||[]}; } return null; };
  const phrase=norm(txt); const words=phrase.split(/\s+/).filter(Boolean);
  const whole=get(phrase);
  if(whole) res.push({en:txt.trim(), means:whole.means.length?whole.means:whole.gl, cands:[...whole.gl, ...whole.means.flatMap(splitMeaning)]});
  if(!whole){
   for(let i=0;i<words.length;i++){
    let hit=null;
    if(i+1<words.length){ const two=get(words[i]+' '+words[i+1]); if(two){ hit={en:words[i]+' '+words[i+1], r:two}; } }
    if(!hit){ const one=get(words[i]); if(one) hit={en:words[i], r:one}; }
    if(!hit) continue;
    if(hit.en.includes(' ')) i++;
    if(whole && norm(hit.en)===phrase) continue;
    res.push({en:hit.en, means:hit.r.means.length?hit.r.means:hit.r.gl, cands:[...hit.r.gl, ...hit.r.means.flatMap(splitMeaning)]});
   }
  }
  return res;
 }
 function findRanges(text, cands){
  const low=text.toLowerCase(); const taken=[];
  const uniq=[...new Set(cands.map(c=>c.toLowerCase().trim()).filter(c=>c.length>=1))].sort((a,b)=>b.length-a.length);
  uniq.forEach(c=>{ let from=0, i;
   while((i=low.indexOf(c,from))>=0){ const e=i+c.length; from=i+1;
    const okB=(i===0 || !L.test(low[i-1])) && (e>=low.length || !L.test(low[e]) || !L.test(c[c.length-1]));
    if(!okB) continue;
    if(taken.some(([a,b])=>i<b && e>a)) continue;
    taken.push([i,e]); break; } });
  return taken;
 }
 // mỗi từ TA chỉ sáng 1 cụm TV (ưu tiên cụm dài nhất tìm thấy)
 function findGroups(text, groups){
  const all=[]; groups.slice().sort((a,b)=>Math.max(0,...b.map(c=>c.length))-Math.max(0,...a.map(c=>c.length))).forEach(g=>{
   const sorted=[...new Set(g.map(c=>c.toLowerCase().trim()).filter(Boolean))].sort((a,b)=>b.length-a.length);
   for(const c of sorted){ const r=findRanges(text,[c]).filter(([i,e])=>!all.some(([a,b])=>i<b && e>a)); if(r.length){ all.push(r[0]); break; } }
  });
  return all;
 }
 let marks=[];
 function clear(){ try{ if(window.CSS && CSS.highlights) CSS.highlights.delete('pair-mean'); }catch(e){} marks.forEach(m=>{ if(m.isConnected){ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); } }); marks=[]; }
 function toRanges(el, spans){
  const nodes=[]; const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n, pos=0;
  while((n=w.nextNode())){ nodes.push([n,pos,pos+n.data.length]); pos+=n.data.length; }
  const at=off=>{ for(const [nd,a,b] of nodes) if(off>=a && off<=b) return [nd,off-a]; return null; };
  return spans.map(([a,b])=>{ const s=at(a), e=at(b); if(!s||!e) return null; const r=document.createRange(); r.setStart(s[0],s[1]); r.setEnd(e[0],e[1]); return r; }).filter(Boolean);
 }
 function paint(el, spans){
  if(!el || !spans.length) return 0;
  const ranges=toRanges(el, spans);
  if(window.CSS && CSS.highlights && window.Highlight){ CSS.highlights.set('pair-mean', new Highlight(...ranges)); }
  else ranges.reverse().forEach(r=>{ const m=document.createElement('mark'); m.className='pair-mean'; try{ r.surroundContents(m); marks.push(m); }catch(e){} });
  return ranges.length;
 }
 // EN → sáng chữ TV
 function fromEnglish(card, txt){
  clear(); const items=lookup(txt); const vie=card.querySelector('.vie');
  let n=0; if(vie){ n=paint(vie, findGroups(vie.textContent, items.map(x=>x.cands))); }
  return {items, found:n};
 }
 // TV → sáng chữ TA
 function fromVietnamese(card, txt){
  clear(); const q=txt.toLowerCase().trim(); if(!q) return {items:[],found:0};
  const vm=vocabMap(); const keys=new Set();
  Object.entries(GLOSS).forEach(([k,arr])=>{ if(arr.some(c=>c.toLowerCase()===q || (q.length>3 && c.toLowerCase().includes(q)) || (c.length>3 && q.includes(c.toLowerCase())))) keys.add(k); });
  vm.forEach((arr,k)=>{ if(arr.some(m=>splitMeaning(m).some(c=>{ c=c.toLowerCase(); return c===q || (c.length>3 && q.includes(c)); }))) keys.add(k); });
  const els=[...card.querySelectorAll('.numbered-title, .eng')]; let found=0; const items=[];
  els.forEach(el=>{ const text=el.textContent; const spans=[];
   [...keys].sort((a,b)=>b.length-a.length).forEach(k=>{ const re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/(y|e)$/,'$1?')+'(s|es|ed|d|ing|ies|ied|ly)?\\b','i'); const m=re.exec(text); if(m && !spans.some(([a,b])=>m.index<b && m.index+m[0].length>a)){ spans.push([m.index,m.index+m[0].length]); items.push({en:m[0], means:[txt]}); } });
   if(spans.length){ if(found===0) found+=paint(el,spans); else { /* chỉ hỗ trợ 1 phần tử khi dùng Highlight API */ const prev=CSS.highlights&&CSS.highlights.get('pair-mean'); const r=toRanges(el,spans); if(prev){ r.forEach(x=>prev.add(x)); found+=r.length; } } }
  });
  return {items, found};
 }
 return {fromEnglish, fromVietnamese, clear};
})();

(function(){

  else if(a==='cancel') hide();
 });
 function check(){ if(formMode) return; const s=readSel(); if(s){ cur=s; showMenu(); } else if(pop.style.display==='block') hide(); }
 const later=d=>{ clearTimeout(timer); timer=setTimeout(check,d); };
 document.addEventListener('mouseup',e=>{ if(!pop.contains(e.target)) later(10); });
 document.addEventListener('touchend',e=>{ if(!pop.contains(e.target)) later(350); });
 document.addEventListener('selectionchange',()=>{ if(!formMode) later(450); });
 document.addEventListener('mousedown',e=>{ if(!pop.contains(e.target) && formMode) hide(); });
 document.addEventListener('touchstart',e=>{ if(!pop.contains(e.target) && formMode) hide(); },{passive:true});
 document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
 window.addEventListener('scroll',()=>{ if(!formMode && pop.style.display==='block' && isMobileLayout()) hide(); },{passive:true});
 document.getElementById('mainContent').addEventListener('scroll',()=>{ if(!formMode && pop.style.display==='block') hide(); },{passive:true});
})();

(function(){
 const b=document.getElementById('viToggle');
 const paint=()=>{ b.textContent='🇻🇳 Đọc cả TV: '+(readVi?'Bật':'Tắt'); b.className='px-3 py-1 rounded-full text-xs '+(readVi?'bg-[#FACC15] text-black font-bold':'bg-[#2A2A2A]'); };
 paint();
 b.onclick=()=>{ readVi=!readVi; try{localStorage.setItem('avcn_readvi',readVi?'1':'0');}catch(e){} paint();
  if(readVi && voices.length && !voices.some(v=>/^vi/i.test(v.lang))) toast('⚠️ Máy chưa có giọng đọc tiếng Việt – hãy dùng Microsoft Edge hoặc cài giọng Việt','#FACC15'); };
})();
// ===== Điện thoại / iPad: menu bài học dạng ngăn kéo, menu ⋯, chiều cao thanh dính =====
(function(){
 const body=document.body, act=document.getElementById('actionBar');
 const closeDrawer=()=>body.classList.remove('drawer-open');
 document.getElementById('menuBtn').onclick=()=>{ act.classList.remove('open'); body.classList.toggle('drawer-open'); };
 document.getElementById('drawerBg').onclick=closeDrawer;
 document.getElementById('lessonList').addEventListener('click',()=>{ if(isMobileLayout()) setTimeout(closeDrawer,50); });
 document.getElementById('searchAll').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.target.blur(); closeDrawer(); } });
 document.getElementById('moreBtn').onclick=e=>{ e.stopPropagation(); act.classList.toggle('open'); };
 act.addEventListener('click',()=>{ if(innerWidth<1280) setTimeout(()=>act.classList.remove('open'),150); });
 document.addEventListener('click',e=>{ if(act.classList.contains('open') && !act.contains(e.target) && e.target.id!=='moreBtn') act.classList.remove('open'); });
 const lbl=document.getElementById('curLesson');
 const updLbl=()=>{ const l=lessons[currentLesson]; lbl.innerHTML=''; lbl.textContent='Bài '+l.id+': '+l.title; const sm=document.createElement('small'); sm.textContent=l.sub; lbl.appendChild(sm); };
 const _rll=renderLessonList; renderLessonList=function(){ _rll.apply(this,arguments); updLbl(); };
 const setVars=()=>{ const tb=document.getElementById('topBar'), ab=document.getElementById('audioBar');
  document.documentElement.style.setProperty('--tbh', tb.offsetHeight+'px');
  document.documentElement.style.setProperty('--abh', (ab && ab.offsetParent? ab.offsetHeight:0)+'px'); };
 if(window.ResizeObserver){ const ro=new ResizeObserver(setVars); ro.observe(document.getElementById('topBar')); ro.observe(document.getElementById('audioBar')); }
 window.addEventListener('resize',()=>{ setVars(); if(!isMobileLayout()){ closeDrawer(); } if(innerWidth>=1280) act.classList.remove('open'); });
 setVars();
})();

renderAll();
</script>
