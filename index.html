ào bao quanh trứng."}, {"en": "The middle piece contains mitochondria needed to generate ATP necessary to operate the flagella.", "vi": "Đoạn giữa chứa ty thể cần để tạo ATP giúp roi hoạt động."}, {"en": "The tail contains microtubules arranged in the 9+2 arrangement typical of eukaryotic cells.", "vi": "Đuôi chứa các vi ống sắp xếp theo kiểu 9+2 đặc trưng của tế bào nhân thực."}, {"en": "4. Female Reproductive System", "vi": "4. Hệ sinh dục cái"}, {"en": "Female Reproductive Structures", "vi": "Cấu trúc sinh dục cái"}, {"en": "Gametes are produced by ovaries. The ovaries are suspended in the abdominal cavity by ligaments and mesenteries.", "vi": "Giao tử được buồng trứng tạo ra. Buồng trứng được treo trong khoang bụng nhờ các dây chằng và mạc treo."}, {"en": "Oviducts serve as passageways from ovaries to uterus. They are not connected to the ovaries.", "vi": "Vòi trứng là đường dẫn từ buồng trứng đến tử cung. Chúng không nối trực tiếp với buồng trứng."}, {"en": "The uterus lies in a nearly horizontal position on top of the bladder.", "vi": "Tử cung nằm gần như ngang, phía trên bàng quang."}, {"en": "The myometrium is a muscle layer; the endometrium is the lining.", "vi": "Lớp cơ tử cung là lớp cơ; nội mạc tử cung là lớp lót bên trong."}, {"en": "The outer layer of endometrium is shed during menstruation.", "vi": "Lớp ngoài của nội mạc tử cung bong ra trong kỳ kinh nguyệt."}, {"en": "The cervix is muscular sphincter between uterus and vagina.", "vi": "Cổ tử cung là cơ thắt nằm giữa tử cung và âm đạo."}, {"en": "The vagina is a muscular structure that functions to receive the penis and also as the birth canal.", "vi": "Âm đạo là cấu trúc cơ có chức năng tiếp nhận dương vật và cũng là đường sinh."}, {"en": "It opens between urethra and anus.", "vi": "Nó mở ra giữa niệu đạo và hậu môn."}, {"en": "Bacteria in the vagina convert glycogen (a carbohydrate) to lactic acid, making it slightly acidic.", "vi": "Vi khuẩn trong âm đạo chuyển glycogen (một loại carbohydrate) thành axit lactic, làm âm đạo hơi có tính axit."}, {"en": "The clitoris is homologous with the glans penis in males; it contains erectile tissue and a glans.", "vi": "Âm vật tương đồng với đầu dương vật ở con đực; nó chứa mô cương và một đầu."}, {"en": "Labia are folds of skin near the opening of the vagina.", "vi": "Môi âm hộ là các nếp da gần lỗ âm đạo."}, {"en": "Labia majora are fleshy and covered with pubic hair. They are homologous with the scrotum in the male.", "vi": "Môi lớn dày thịt và có lông mu che phủ. Chúng tương đồng với bìu ở con đực."}, {"en": "Labia minora are homologous with the shaft of the penis in male.", "vi": "Môi bé tương đồng với thân dương vật ở con đực."}, {"en": "The external genitalia of females are the vulva.", "vi": "Cơ quan sinh dục ngoài của con cái là âm hộ."}, {"en": "Primary oocytes begin to form in females before they are born (during the 3rd month of embryonic development).", "vi": "Noãn bào sơ cấp bắt đầu hình thành ở con cái trước khi sinh (vào tháng thứ 3 của giai đoạn phôi)."}, {"en": "Development stops before the first meiotic division is completed.", "vi": "Sự phát triển dừng lại trước khi hoàn tất lần phân bào giảm nhiễm thứ nhất."}, {"en": "Females are born with all the primary oocytes that they will ever possess.", "vi": "Con cái sinh ra đã có toàn bộ số noãn bào sơ cấp mà chúng sẽ có trong suốt đời."}, {"en": "The first meiotic division is completed at about the time of ovulation; secondary oocytes are therefore released at ovulation, not eggs.", "vi": "Lần phân bào giảm nhiễm thứ nhất hoàn tất vào khoảng thời điểm rụng trứng; vì vậy khi rụng trứng, thứ được giải phóng là noãn bào thứ cấp, không phải trứng."}, {"en": "The second meiotic division occurs after fertilization.", "vi": "Lần phân bào giảm nhiễm thứ hai xảy ra sau khi thụ tinh."}, {"en": "An infant may have as many as 2 million primary oocytes.", "vi": "Một trẻ sơ sinh có thể có tới 2 triệu noãn bào sơ cấp."}, {"en": "Approximately 300,000-400,000 primary oocytes remain at time of puberty; 400 mature over the reproductive years.", "vi": "Khoảng 300.000–400.000 noãn bào sơ cấp còn lại vào thời điểm dậy thì; 400 noãn bào trưởng thành trong suốt những năm sinh sản."}, {"en": "Ovarian Follicle", "vi": "Nang trứng"}, {"en": "The oocyte and cells surrounding it is the follicle.", "vi": "Noãn bào cùng các tế bào bao quanh nó tạo thành nang trứng."}, {"en": "The follicle moves to the surface and erupts, releasing the oocyte.", "vi": "Nang trứng di chuyển ra bề mặt và vỡ ra, giải phóng noãn bào."}, {"en": "After ovulation, the follicle develops into a corpus luteum, which lasts only about 10 days if the secondary oocyte is not fertilized.", "vi": "Sau khi rụng trứng, nang trứng phát triển thành thể vàng, tồn tại chỉ khoảng 10 ngày nếu noãn bào thứ cấp không được thụ tinh."}, {"en": "The secondary oocyte is swept into the oviduct by beating cilia and movement of the oviduct.", "vi": "Noãn bào thứ cấp được lông rung và chuyển động của vòi trứng cuốn vào vòi trứng."}, {"en": "Cilia and peristalsis move the oocyte through the oviduct.", "vi": "Lông rung và nhu động đưa noãn bào đi dọc vòi trứng."}, {"en": "Fertilization occurs in oviduct.", "vi": "Sự thụ tinh xảy ra trong vòi trứng."}, {"en": "The secondary oocyte must be fertilized within 36 hours.", "vi": "Noãn bào thứ cấp phải được thụ tinh trong vòng 36 giờ."}, {"en": "Sperm survive in the female reproductive tract for approximately 48 hours.", "vi": "Tinh trùng sống được trong đường sinh dục cái khoảng 48 giờ."}, {"en": "It takes 3 days to reach uterus.", "vi": "Phải mất 3 ngày để đến được tử cung."}], "extra": [], "vocab": [["Asexual reproduction (adj)", "", "Sinh sản vô tính"], ["Oocyte (n)", "", "Noãn bào"], ["Follicle (n)", "", "nang"], ["Fertilize (v)", "", "Thụ tinh"], ["Puberty (n)", "", "Tuổi thành thục"], ["Scrotum (n)", "", "Bao dịch hoàn"], ["Uterus (n)", "", "Tử cung"], ["Ovulation (n)", "", "Sự rụng trứng"], ["Oviduct (n)", "", "Vòi trứng"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. How do vertebrate animals reproduce? (Động vật có xương sống sinh sản như thế nào?)", "answer": "Vertebrates reproduce sexually: the sexes are usually separate and sperm fuse with eggs; fertilization is external in aquatic species and internal in terrestrial ones (some species can change sex). – Chúng sinh sản hữu tính: thường phân tính, tinh trùng kết hợp với trứng; thụ tinh ngoài ở loài sống dưới nước, thụ tinh trong ở loài sống trên cạn (một số loài có thể đổi giới tính)."}, {"type": "question", "qType": "open", "question": "2. What are the main advantages of sexual reproduction? (Ưu điểm chính của sinh sản hữu tính là gì?)", "answer": "It promotes variation, because offspring inherit genes from two parents and crossing-over and independent assortment mix genes; variation is advantageous to species in fluctuating environments. – Nó thúc đẩy sự biến dị vì con thừa hưởng gen của hai bố mẹ, cùng với trao đổi chéo và phân li độc lập; biến dị có lợi cho loài trong môi trường biến động."}, {"type": "question", "qType": "open", "question": "3. What phenomenon occur if sperm cell meet an egg in the three-quarter of the Fallopian tube? (Hiện tượng gì xảy ra nếu tinh trùng gặp trứng ở 3/4 vòi trứng?)", "answer": "Fertilization occurs: the sperm penetrates the secondary oocyte (which completes its second meiotic division) to form a zygote; the embryo then takes about 3 days to reach the uterus. – Xảy ra sự thụ tinh: tinh trùng xâm nhập noãn bào thứ cấp (noãn hoàn tất giảm nhiễm lần hai) tạo hợp tử; phôi mất khoảng 3 ngày để đến tử cung."}, {"type": "question", "qType": "open", "question": "4. What are the roles of endocrines in sexual reproduction activities? (Vai trò của các tuyến nội tiết trong hoạt động sinh sản là gì?)", "answer": "Testosterone (from Leydig cells) stimulates spermatogenesis, sexual behavior and secondary sexual characteristics; melatonin from the pineal gland links reproductive behavior to day length; in females hormones control follicle growth, ovulation and the estrus cycle (phần hormone cái là kiến thức mở rộng). – Testosterone kích thích sinh tinh, hành vi tính dục và đặc điểm sinh dục phụ; melatonin của tuyến tùng gắn hành vi sinh sản với độ dài ngày; ở con cái, hormone điều khiển sự phát triển nang trứng, rụng trứng và chu kỳ động dục."}, {"type": "question", "qType": "open", "question": "5. What is estrus cycle? (Chu kỳ động dục là gì?)", "answer": "The recurring reproductive cycle of female mammals in which follicles develop, the female comes into heat (estrus) and ovulates, followed by a corpus luteum phase, repeated until pregnancy occurs (kiến thức mở rộng). – Chu kỳ sinh sản lặp lại ở con cái động vật có vú: nang trứng phát triển, con cái động dục (estrus) và rụng trứng, sau đó là giai đoạn thể vàng, lặp lại cho đến khi có thai."}, {"type": "question", "qType": "open", "question": "6. How many egg does a cow normally ovulate in one estrus cycle? (Một con bò thường rụng bao nhiêu trứng trong một chu kỳ động dục?)", "answer": "Normally one egg (occasionally two) (kiến thức mở rộng). – Thường là một trứng (đôi khi hai)."}, {"type": "question", "qType": "open", "question": "7. Where were sperm cells made? Where were they stored and then activated? (Tinh trùng được tạo ở đâu? Được dự trữ và sau đó hoạt hóa ở đâu?)", "answer": "Sperm are produced in the seminiferous tubules of the testes, mature and are stored in the epididymides and vas deferens, and become active when mixed with seminal fluids at ejaculation. – Tinh trùng được tạo trong ống sinh tinh của tinh hoàn, trưởng thành và dự trữ trong mào tinh và ống dẫn tinh, rồi hoạt hóa khi hòa với dịch tinh lúc xuất tinh."}, {"type": "content", "title": "Practice 2: True or false statements", "content": "Quyết định đúng (True) hay sai (False), rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "truefalse", "question": "1. In mammals, the fertilization process occurs out side the body. (Ở động vật có vú, quá trình thụ tinh xảy ra bên ngoài cơ thể.)", "answer": "false", "explain": "Sai: động vật có vú thụ tinh trong (internal fertilization), tinh trùng gặp trứng trong vòi trứng."}, {"type": "question", "qType": "truefalse", "question": "2. In aquatic animal, (except aquatic mammals e.g. whale) fertilization occur out side the body. (Ở động vật thủy sinh (trừ thú biển như cá voi), thụ tinh xảy ra bên ngoài cơ thể.)", "answer": "true", "explain": "Đúng với phần lớn: loài thụ tinh ngoài là loài sống dưới nước (một số ngoại lệ như cá mập thụ tinh trong)."}, {"type": "question", "qType": "truefalse", "question": "3. With the advanced technologies, it is possible to fertilize the eggs in vitro. (Nhờ công nghệ tiên tiến, có thể thụ tinh trứng trong ống nghiệm.)", "answer": "true", "explain": "Đúng: thụ tinh trong ống nghiệm (IVF) là công nghệ sinh sản hiện đại."}, {"type": "question", "qType": "truefalse", "question": "4. The castrated animals could produce sperm cells. (Động vật bị thiến vẫn có thể tạo tinh trùng.)", "answer": "false", "explain": "Sai: tinh trùng được tạo ra ở tinh hoàn; thiến là lấy tinh hoàn đi nên không còn sinh tinh."}, {"type": "question", "qType": "truefalse", "question": "5. Artificial Insemination technique (AI) is common used in pig production. (Kỹ thuật thụ tinh nhân tạo (AI) được dùng phổ biến trong chăn nuôi heo.)", "answer": "true", "explain": "Đúng: thụ tinh nhân tạo rất phổ biến trong chăn nuôi heo."}, {"type": "content", "title": "IV. Assignment", "content": "Từ toàn bộ thông tin trên, hãy viết một đoạn ngắn (khoảng 50 từ) tóm tắt về sinh sản động vật cơ bản. Học thuộc toàn bộ từ vựng."}], "rev": 1, "prev": 1}, {"id": 5, "title": "Y học thú y", "sub": "Veterinary Medicine", "color": "#6BBAB5", "reading": [{"en": "Veterinary medicine is a scientific branch focusing on pathogens, pathogenesis, changes in the cells, organs, and in the whole animal body when pathogens invaded.", "vi": "Thú y học là một ngành khoa học tập trung nghiên cứu mầm bệnh, cơ chế sinh bệnh, và những biến đổi ở tế bào, cơ quan và toàn bộ cơ thể động vật khi mầm bệnh xâm nhập."}, {"en": "Its researches and experiments are mostly on the diagnostic scheme, effective treatments and prevention in order to protect the animals from diseases thus increase the economic efficiency of animal production.", "vi": "Các nghiên cứu và thí nghiệm của ngành chủ yếu về quy trình chẩn đoán, phương pháp điều trị hiệu quả và phòng bệnh nhằm bảo vệ vật nuôi khỏi bệnh tật, qua đó tăng hiệu quả kinh tế của chăn nuôi."}, {"en": "It also greatly contributed to the development of the animal production sector and community health protection.", "vi": "Ngành này cũng đóng góp rất lớn cho sự phát triển của lĩnh vực chăn nuôi và việc bảo vệ sức khỏe cộng đồng."}, {"en": "Veterinary science is vital to the study and protection of animal production practices, herd health and monitoring the spread of disease.", "vi": "Khoa học thú y có vai trò sống còn trong việc nghiên cứu và bảo vệ các thực hành chăn nuôi, sức khỏe đàn vật nuôi và giám sát sự lây lan của dịch bệnh."}, {"en": "It requires the acquisition and application of scientific knowledge in multiple disciplines and uses technical skills directed at disease prevention in both domestic and wild animals.", "vi": "Nó đòi hỏi việc tiếp thu và vận dụng kiến thức khoa học ở nhiều lĩnh vực và sử dụng các kỹ năng kỹ thuật hướng tới phòng bệnh cho cả động vật nuôi và động vật hoang dã."}, {"en": "Veterinary science helps safeguard human health through the careful monitoring of livestock, companion animal and wildlife health.", "vi": "Khoa học thú y góp phần bảo vệ sức khỏe con người thông qua việc giám sát cẩn thận sức khỏe của vật nuôi, thú cưng và động vật hoang dã."}, {"en": "Emerging zoonotic diseases around the globe require capabilities in epidemiology and infectious disease surveillance (by means of quantitative parasitology) and control that are particularly well-suited to veterinary science's “herd health” approach.", "vi": "Các bệnh lây từ động vật sang người đang nổi lên trên toàn cầu đòi hỏi năng lực về dịch tễ học, giám sát và kiểm soát bệnh truyền nhiễm (bằng ký sinh trùng học định lượng), rất phù hợp với cách tiếp cận “sức khỏe đàn” của khoa học thú y."}, {"en": "Veterinary medicine is informally as old as the human/animal bond but in recent years has expanded exponentially because of the availability of advanced diagnostic and therapeutic techniques for most species.", "vi": "Thú y học có thể nói là lâu đời như mối gắn bó giữa con người và động vật, nhưng những năm gần đây đã phát triển vượt bậc nhờ có các kỹ thuật chẩn đoán và điều trị tiên tiến cho hầu hết các loài."}, {"en": "Animals nowadays often receive advanced medical, dental, and surgical care including insulin injections, root canals, hip replacements, cataract extractions, and pacemakers.", "vi": "Ngày nay động vật thường được chăm sóc y tế, nha khoa và phẫu thuật tiên tiến, gồm tiêm insulin, điều trị tủy răng, thay khớp háng, phẫu thuật đục thủy tinh thể và đặt máy tạo nhịp tim."}, {"en": "Veterinary specialization has become more common in recent years.", "vi": "Sự chuyên khoa hóa trong thú y ngày càng phổ biến trong những năm gần đây."}, {"en": "Currently 20 veterinary specialties are recognized by the American Veterinary Medical Association (AVMA), including anesthesiology, behavior, dermatology, emergency and critical care, internal medicine, cardiology, oncology, neurology, radiology and surgery.", "vi": "Hiện có 20 chuyên khoa thú y được Hiệp hội Thú y Hoa Kỳ (AVMA) công nhận, gồm gây mê, hành vi, da liễu, cấp cứu và hồi sức, nội khoa, tim mạch, ung thư học, thần kinh, chẩn đoán hình ảnh và phẫu thuật."}, {"en": "In order to become a specialist, a veterinarian must complete additional training after graduation from veterinary school in the form of an internship and residency and then pass a rigorous examination.", "vi": "Để trở thành bác sĩ chuyên khoa, bác sĩ thú y phải hoàn thành thêm chương trình đào tạo sau khi tốt nghiệp trường thú y, dưới hình thức thực tập và nội trú, rồi vượt qua một kỳ thi nghiêm ngặt."}, {"en": "Veterinarians assist in ensuring the quality, quantity, and security of food supplies by working to maintain the health of livestock and inspecting the meat itself.", "vi": "Bác sĩ thú y góp phần bảo đảm chất lượng, số lượng và an ninh nguồn cung thực phẩm bằng cách duy trì sức khỏe vật nuôi và kiểm tra chính thịt."}, {"en": "Veterinary scientists occupy important positions in biological, chemical, agricultural and pharmaceutical research.", "vi": "Các nhà khoa học thú y giữ những vị trí quan trọng trong nghiên cứu sinh học, hóa học, nông nghiệp và dược phẩm."}], "extra": [], "vocab": [["Veterinary", "/ˈvet.ər.ɪ.nər.i/", "(thuộc) thú y"], ["Medicine", "/ˈmed.ɪ.sən/", "Y học, Y khoa, thuốc"], ["Diagnostic", "/ˌdaɪ.əɡˈnɒs.tɪk/", "Chẩn đoán (adj); triệu chứng (n)"], ["Therapeutic", "/ˌθer.əˈpjuː.tɪk/", "Chữa bệnh"], ["Domestic", "/dəˈmes.tɪk/", "Thuộc gia đình"], ["Exotic", "/ɪɡˈzɒt.ɪk/", "Ở nước ngoài đưa vào"], ["Wildlife", "/ˈwaɪld.laɪf/", "Thú vật hoang dã"], ["Vital", "/ˈvaɪ.təl/", "Sống còn, quan trọng"], ["Protection", "/prəˈtek.ʃən/", "Sự bảo vệ"], ["Disease", "/dɪˈziːz/", "Bệnh tật"], ["Epidemiology", "/ˌep.ɪ.diː.miˈɒl.ə.dʒi/", "Dịch tễ học"], ["Cataract", "/ˈkæt.ər.ækt/", "Bệnh đục thủy tinh thể"], ["Anesthetic", "/ˌæn.əsˈθet.ɪk/", "Gây mê"], ["Dermatology", "/ˌdɜː.məˈtɒl.ə.dʒi/", "Bệnh ngoài da"], ["Cardiology", "/ˌkɑː.diˈɒl.ə.dʒi/", "Khoa tim mạch"], ["Oncology", "/ɒŋˈkɒl.ə.dʒi/", "Ung thư học"], ["Neurology", "/njʊəˈrɒl.ə.dʒi/", "Khoa thần kinh học"], ["Radiology", "/ˌreɪ.diˈɒl.ə.dʒi/", "Phóng xạ (X quang)"], ["Surgery", "/ˈsɜː.dʒər.i/", "Phẫu thuật"], ["Rigorous", "/ˈrɪɡ.ər.əs/", "Nghiêm khắc"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. Why is it important to study on medicine and diseases in animal production? (Vì sao việc nghiên cứu thuốc và bệnh tật trong chăn nuôi lại quan trọng?)", "answer": "Because it protects animals from diseases and so increases the economic efficiency of animal production; it also contributes to the development of the sector and to community health protection. – Vì nó bảo vệ vật nuôi khỏi bệnh, nhờ đó tăng hiệu quả kinh tế chăn nuôi, đồng thời góp phần phát triển ngành và bảo vệ sức khỏe cộng đồng."}, {"type": "question", "qType": "open", "question": "2. What does veterinary science do to help on improving human and animal health? (Khoa học thú y làm gì để cải thiện sức khỏe con người và động vật?)", "answer": "It monitors the health of livestock, companion animals and wildlife, works on disease prevention, and applies epidemiology and infectious disease surveillance and control to emerging zoonotic diseases. – Nó giám sát sức khỏe vật nuôi, thú cưng và động vật hoang dã, phòng bệnh, và vận dụng dịch tễ học, giám sát và kiểm soát bệnh truyền nhiễm đối với các bệnh lây từ động vật sang người."}, {"type": "question", "qType": "open", "question": "3. What made veterinary science develop rapidly in recent years? (Điều gì khiến khoa học thú y phát triển nhanh trong những năm gần đây?)", "answer": "The availability of advanced diagnostic and therapeutic techniques for most species. – Sự sẵn có của các kỹ thuật chẩn đoán và điều trị tiên tiến cho hầu hết các loài."}, {"type": "question", "qType": "open", "question": "4. How many veterinary specialties are there? And what are they? (Có bao nhiêu chuyên khoa thú y? Đó là những chuyên khoa nào?)", "answer": "There are 20 specialties recognized by the AVMA, including anesthesiology, behavior, dermatology, emergency and critical care, internal medicine, cardiology, oncology, neurology, radiology and surgery. – Có 20 chuyên khoa được AVMA công nhận, gồm gây mê, hành vi, da liễu, cấp cứu và hồi sức, nội khoa, tim mạch, ung thư học, thần kinh, chẩn đoán hình ảnh và phẫu thuật."}, {"type": "question", "qType": "open", "question": "5. What do Veterinarians do to ensure the quality, quantity, and security of food supplies? (Bác sĩ thú y làm gì để bảo đảm chất lượng, số lượng và an ninh nguồn cung thực phẩm?)", "answer": "They work to maintain the health of livestock and inspect the meat itself. – Họ duy trì sức khỏe vật nuôi và kiểm tra chính thịt."}, {"type": "content", "title": "Practice 2: True or False statement", "content": "Quyết định đúng (True) hay sai (False), rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "truefalse", "question": "1. Veterinary medicine is the application of medical, diagnostic and therapeutic principles to men. (Thú y học là việc áp dụng các nguyên tắc y học, chẩn đoán và điều trị cho con người.)", "answer": "false", "explain": "Sai: thú y học áp dụng cho động vật, không phải cho con người."}, {"type": "question", "qType": "truefalse", "question": "2. Veterinary science studies and protects animals, herd health and monitoring the spread of disease. (Khoa học thú y nghiên cứu và bảo vệ động vật, sức khỏe đàn và giám sát sự lây lan dịch bệnh.)", "answer": "true", "explain": "Đúng: bài đọc nói khoa học thú y “vital to the study and protection of animal production practices, herd health and monitoring the spread of disease”."}, {"type": "question", "qType": "truefalse", "question": "3. Veterinary science only focuses on protection of wild animals. (Khoa học thú y chỉ tập trung bảo vệ động vật hoang dã.)", "answer": "false", "explain": "Sai: phòng bệnh cho cả động vật nuôi (domestic) và động vật hoang dã (wild)."}, {"type": "question", "qType": "truefalse", "question": "4. Veterinarian must complete additional training after graduation from veterinary school in the form of an internship and residency and then pass a rigorous examination. (Bác sĩ thú y phải hoàn thành đào tạo bổ sung sau khi tốt nghiệp (thực tập, nội trú) rồi vượt qua kỳ thi nghiêm ngặt.)", "answer": "true", "explain": "Đúng: đây là điều kiện để trở thành bác sĩ chuyên khoa (specialist) theo bài đọc."}, {"type": "question", "qType": "truefalse", "question": "5. Animals in general have never received advanced medical, dental, and surgical care. (Nhìn chung động vật chưa từng được chăm sóc y tế, nha khoa, phẫu thuật tiên tiến.)", "answer": "false", "explain": "Sai: ngày nay động vật thường được chăm sóc tiên tiến như tiêm insulin, điều trị tủy răng, thay khớp háng, phẫu thuật đục thủy tinh thể, đặt máy tạo nhịp tim."}, {"type": "content", "title": "Practice 3: Fill in the blank the most appropriate word(s)", "content": "Chọn đáp án thích hợp nhất để điền vào chỗ trống, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "choice", "question": "1. A veterinarian should be in multiple disciplines in order to work with diseases ……… in both domestic and wild animals. (Bác sĩ thú y nên có kiến thức nhiều lĩnh vực để làm việc với bệnh ……… ở cả động vật nuôi và hoang dã.)", "options": ["A. Prevention and treatment", "B. Spreading and shedding", "C. Collection and isolation", "D. All are correct."], "answer": 0}, {"type": "question", "qType": "choice", "question": "2. Veterinary science monitors of livestock, companion animal and wildlife ……, thus, it will helps safeguard human ……… (Khoa học thú y giám sát vật nuôi, thú cưng và động vật hoang dã, nhờ đó bảo vệ ……… con người.)", "options": ["A. Colours", "B. Size", "C. Health", "D. Behavior"], "answer": 2}, {"type": "question", "qType": "choice", "question": "3. One of the common veterinary specialties is focusing on the skin diseases so called ……… (Một chuyên khoa thú y phổ biến tập trung vào các bệnh ngoài da gọi là ………)", "options": ["A. Neurology", "B. Cardiology", "C. Ontology", "D. Dermatology"], "answer": 3}, {"type": "question", "qType": "choice", "question": "4. ……… are very important in biological, chemical, agricultural and pharmaceutical research (……… rất quan trọng trong nghiên cứu sinh học, hóa học, nông nghiệp và dược phẩm)", "options": ["A. Chemists", "B. Nutritionists", "C. Physicist", "D. Veterinary scientists"], "answer": 3}, {"type": "content", "title": "IV. Assignment", "content": "Dùng toàn bộ thông tin trên để viết một đoạn ngắn (khoảng 50 từ) tóm tắt nhận thức của bạn về thú y học nói chung."}], "rev": 1, "prev": 1}, {"id": 6, "title": "Ký sinh trùng học", "sub": "Parasites", "color": "#9B8AD4", "reading": [{"en": "Parasitism", "vi": "Sự ký sinh"}, {"en": "Parasitism is a type of symbiotic relationship between organisms of different species in which one, the parasite, benefits from a prolonged close association with the other, the host, which is harmed.", "vi": "Ký sinh là một dạng quan hệ đồng sinh giữa các sinh vật thuộc những loài khác nhau, trong đó một bên, gọi là ký sinh trùng, được lợi từ mối liên hệ gần gũi kéo dài với bên kia, gọi là vật chủ, bên bị hại."}, {"en": "In general, parasites are much smaller than their hosts, have a high degree of specialization for their mode of life and reproduce more quickly and in greater numbers than their hosts.", "vi": "Nhìn chung, ký sinh trùng nhỏ hơn nhiều so với vật chủ, chuyên hóa ở mức cao cho phương thức sống của chúng và sinh sản nhanh hơn, với số lượng lớn hơn vật chủ."}, {"en": "The parasitic mode of life is the most common on the planet, with representatives from all major taxa from the simplest unicellular organisms to complex vertebrates.", "vi": "Phương thức sống ký sinh là phổ biến nhất trên hành tinh, với đại diện ở mọi nhóm phân loại lớn, từ những sinh vật đơn bào đơn giản nhất đến các động vật có xương sống phức tạp."}, {"en": "Every host species has its own unique species of parasite, so the number of parasitic species greatly exceeds the number of free host species.", "vi": "Mỗi loài vật chủ có loài ký sinh trùng riêng của nó, nên số loài ký sinh vượt xa số loài vật chủ."}, {"en": "Classification of parasites", "vi": "Phân loại ký sinh trùng"}, {"en": "Parasites are classified basing on a variety of aspects of their interactions with their hosts and on their life cycles.", "vi": "Ký sinh trùng được phân loại dựa trên nhiều khía cạnh trong tương tác của chúng với vật chủ và dựa trên vòng đời của chúng."}, {"en": "Some of these classifications can be raised for illustration as follows:", "vi": "Một số cách phân loại này có thể nêu ra để minh họa như sau:"}, {"en": "Those that live inside the host are called endoparasites (e.g., hookworms) and those that live on its surface are called ectoparasites (e.g., some mites).", "vi": "Những loài sống bên trong vật chủ gọi là nội ký sinh (ví dụ: giun móc) và những loài sống trên bề mặt vật chủ gọi là ngoại ký sinh (ví dụ: một số loài ve, mạt)."}, {"en": "Epiparasite is the parasite that feeds on another parasite.", "vi": "Ký sinh bậc hai là loài ký sinh trùng sống nhờ vào một ký sinh trùng khác."}, {"en": "This kind of relationship can also be referred to as “hyperparasitism”, and is very common in the insect world.", "vi": "Kiểu quan hệ này còn được gọi là “siêu ký sinh”, và rất phổ biến trong thế giới côn trùng."}, {"en": "Parasitoids are parasites that eventually cause the host to die as a result of infection, often from a loss of host tissues or nutrients.", "vi": "Ký sinh gây chết vật chủ là những ký sinh trùng cuối cùng làm vật chủ chết do nhiễm bệnh, thường là do mất mô hoặc chất dinh dưỡng của vật chủ."}, {"en": "Parasitoids are sometimes called necrotrophs.", "vi": "Ký sinh gây chết vật chủ đôi khi còn được gọi là sinh vật hoại sinh trên mô chết."}, {"en": "In contrast, biotrophic parasites cannot survive in a dead host.", "vi": "Ngược lại, ký sinh trùng sống nhờ mô sống không thể tồn tại trong vật chủ đã chết."}, {"en": "The harm in parasitic interactions concern the biological fitness of the organisms involved.", "vi": "Tác hại trong các tương tác ký sinh liên quan đến sức thích nghi sinh học của các sinh vật tham gia."}, {"en": "Parasites reduce host fitness in many ways, ranging from general or specialized pathology, impairment of secondary sex characteristics, to the modification of host behavior.", "vi": "Ký sinh trùng làm giảm sức thích nghi của vật chủ theo nhiều cách, từ bệnh lý chung hay chuyên biệt, suy giảm các đặc điểm sinh dục phụ, đến việc làm thay đổi hành vi của vật chủ."}, {"en": "Parasites increase their fitness by exploiting hosts for food, habitat and dispersal.", "vi": "Ký sinh trùng tăng sức thích nghi của mình bằng cách khai thác vật chủ để lấy thức ăn, nơi cư trú và phát tán."}, {"en": "Parasitology", "vi": "Ký sinh trùng học"}, {"en": "Parasitology is the study of parasites, their hosts, and the relationship between them.", "vi": "Ký sinh trùng học là ngành nghiên cứu về ký sinh trùng, vật chủ của chúng và mối quan hệ giữa hai bên."}, {"en": "As a biological discipline, the scope of parasitology is not determined by the organism or environment in question, but by their way of life.", "vi": "Là một ngành sinh học, phạm vi của ký sinh trùng học không được xác định bởi sinh vật hay môi trường đang xét, mà bởi lối sống của chúng."}, {"en": "This means it forms a synthesis of other disciplines, and draws on techniques from fields such as cell biology, bioinformatics, biochemistry, molecular biology, immunology, genetics, evolution and ecology.", "vi": "Điều này có nghĩa nó là sự tổng hợp của nhiều ngành khác và sử dụng kỹ thuật từ các lĩnh vực như sinh học tế bào, tin sinh học, hóa sinh, sinh học phân tử, miễn dịch học, di truyền học, tiến hóa và sinh thái học."}, {"en": "Veterinary parasitology", "vi": "Ký sinh trùng học thú y"}, {"en": "Veterinary parasitology is the study of animal parasites, especially relationships between parasites and animal hosts, and their interactions.", "vi": "Ký sinh trùng học thú y là ngành nghiên cứu ký sinh trùng của động vật, đặc biệt là mối quan hệ giữa ký sinh trùng và vật chủ là động vật, cùng các tương tác của chúng."}, {"en": "Parasites of domestic animals (livestock and pet animals) as well as wildlife animals are considered.", "vi": "Ngành này xem xét ký sinh trùng của động vật nuôi (vật nuôi và thú cưng) cũng như của động vật hoang dã."}, {"en": "Veterinary parasitology studies genesis and development of parasites in animal host.", "vi": "Ký sinh trùng học thú y nghiên cứu sự hình thành và phát triển của ký sinh trùng trong vật chủ là động vật."}, {"en": "Veterinary parasitology also studies taxonomy and systematics of parasites, morphology, life cycles, and living needs of parasites in environment and in animal host.", "vi": "Ngành này cũng nghiên cứu phân loại học và hệ thống học của ký sinh trùng, hình thái học, vòng đời và nhu cầu sống của ký sinh trùng trong môi trường và trong vật chủ."}, {"en": "Diagnosis, treatment, and prevention of animal parasites are designed using procured observations.", "vi": "Việc chẩn đoán, điều trị và phòng ngừa ký sinh trùng ở động vật được xây dựng dựa trên các quan sát thu thập được."}, {"en": "Data obtained from parasitological research in animals helps in veterinary practice and improve animal breeding.", "vi": "Dữ liệu thu được từ nghiên cứu ký sinh trùng ở động vật giúp ích cho thực hành thú y và cải thiện công tác giống vật nuôi."}, {"en": "Major goal of veterinary parasitology is to protect animals and improve their health status.", "vi": "Mục tiêu chính của ký sinh trùng học thú y là bảo vệ động vật và cải thiện tình trạng sức khỏe của chúng."}, {"en": "Moreover, a number of animal parasites are transmitted to humans.", "vi": "Hơn nữa, một số ký sinh trùng của động vật có thể lây sang người."}, {"en": "Therefore, veterinary parasitology is also important for public health.", "vi": "Do đó, ký sinh trùng học thú y cũng quan trọng đối với sức khỏe cộng đồng."}, {"en": "Divisions of veterinary parasitology", "vi": "Các phân ngành của ký sinh trùng học thú y"}, {"en": "The field of veterinary parasitology covers some different divisions.", "vi": "Lĩnh vực ký sinh trùng học thú y bao gồm một số phân ngành khác nhau."}, {"en": "Veterinary Protozoology focuses on veterinary important protozoans, which are, in Greek proto = first and zoa = animals, one-celled eukaryotes, (singular protozoon).", "vi": "Đơn bào học thú y tập trung vào các động vật nguyên sinh quan trọng trong thú y, vốn trong tiếng Hy Lạp proto = đầu tiên và zoa = động vật, là sinh vật nhân thực đơn bào (số ít: protozoon)."}, {"en": "That implies that protozoa are unicellular microbes whose cells have membrane-bound nuclei that commonly show characteristics usually associated with animals - mobility and heterotrophy.", "vi": "Điều đó có nghĩa động vật nguyên sinh là vi sinh vật đơn bào có nhân bao bọc bởi màng, thường mang những đặc điểm gắn với động vật – khả năng di động và dị dưỡng."}, {"en": "Veterinary Helminthology is the study of veterinary important helminth parasites, a division of eukaryotic (internal) parasites that, unlike external parasites such as lice and fleas, live inside their host.", "vi": "Giun sán học thú y là ngành nghiên cứu các ký sinh trùng giun sán quan trọng trong thú y, một nhóm ký sinh trùng nhân thực (nội ký sinh) mà khác với ngoại ký sinh như chấy rận và bọ chét, sống bên trong vật chủ."}, {"en": "They are worm-like organisms (worms, flukes and tape-worm) that live and feed off living hosts, receiving nourishment and protection while disrupting their hosts' nutrient absorption, causing weakness and disease.", "vi": "Chúng là những sinh vật giống con giun (giun, sán lá và sán dây) sống và ăn bám trên vật chủ còn sống, nhận dinh dưỡng và sự bảo vệ trong khi làm gián đoạn sự hấp thu dưỡng chất của vật chủ, gây suy yếu và bệnh tật."}, {"en": "Those that live inside the digestive tract are called intestinal parasites.", "vi": "Những loài sống trong đường tiêu hóa gọi là ký sinh trùng đường ruột."}, {"en": "They can live inside humans as well as other animals.", "vi": "Chúng có thể sống trong cơ thể người cũng như các động vật khác."}, {"en": "Veterinary Entomology (Arachnoentomology) concerns the veterinary important Arachnids and Insects.", "vi": "Côn trùng học thú y (Arachnoentomology) quan tâm đến các loài nhện và côn trùng quan trọng trong thú y."}, {"en": "Where the term Arachnids refers to a class (Arachnida) of joint-legged invertebrate animals.", "vi": "Trong đó thuật ngữ Arachnids chỉ một lớp (Arachnida) động vật không xương sống có chân phân đốt."}, {"en": "They are chiefly terrestrial arthropods, comprising some 65,000 to 73,000 named species including spiders, scorpions, etc.", "vi": "Chúng chủ yếu là động vật chân đốt sống trên cạn, gồm khoảng 65.000 đến 73.000 loài đã được đặt tên, trong đó có nhện, bọ cạp, v.v."}, {"en": "Signs and symptoms of parasitic infection", "vi": "Dấu hiệu và triệu chứng của nhiễm ký sinh trùng"}, {"en": "Once parasitically infected, a host may show some signs and symptoms including but not limited to:", "vi": "Khi bị nhiễm ký sinh trùng, vật chủ có thể biểu hiện một số dấu hiệu và triệu chứng, bao gồm nhưng không giới hạn ở:"}, {"en": "Poor to no appetite.", "vi": "Kém ăn hoặc bỏ ăn."}, {"en": "Weight loss.", "vi": "Sụt cân."}, {"en": "No weight gain or growth seen in an animal that appears to be eating well.", "vi": "Không tăng cân hoặc không lớn ở con vật trông vẫn ăn uống tốt."}, {"en": "Diarrhea or loose and frequent bowel movements.", "vi": "Tiêu chảy hoặc đi phân lỏng và thường xuyên."}, {"en": "Extremely smelly stools.", "vi": "Phân rất hôi."}, {"en": "Poor color membrane (darker or duller coloration, becoming pale).", "vi": "Màu niêm mạc kém (sẫm hơn hoặc xỉn hơn, trở nên nhợt nhạt)."}, {"en": "Lethargy (inactivity, sleepiness, not very alert, dull eyes).", "vi": "Lờ đờ (ít hoạt động, buồn ngủ, kém tỉnh táo, mắt đờ đẫn)."}, {"en": "A combination of several of the above symptoms is usually seen, and symptoms can range from being fairly mild – slight decrease in appetite and loose stools, to quite severe – extreme lethargy and dehydration caused by frequent diarrhea.", "vi": "Thường thấy sự kết hợp của nhiều triệu chứng trên, và triệu chứng có thể từ khá nhẹ – giảm ăn nhẹ và phân lỏng, đến khá nặng – cực kỳ lờ đờ và mất nước do tiêu chảy liên tục."}, {"en": "Diagnosis of parasites", "vi": "Chẩn đoán ký sinh trùng"}, {"en": "A number of various methods can be used to identify and to diagnose parasites in animals, which are briefly listed as:", "vi": "Có thể dùng nhiều phương pháp khác nhau để xác định và chẩn đoán ký sinh trùng ở động vật, được liệt kê ngắn gọn như sau:"}, {"en": "Coprological examination: flotation, sedimentation, McMaster method, Baermann method.", "vi": "Xét nghiệm phân: phương pháp phù nổi, lắng cặn, McMaster, Baermann."}, {"en": "Haematology: blood smear and Giemsa-stain, Diff-Quick, QBC.", "vi": "Huyết học: phết máu và nhuộm Giemsa, Diff-Quick, QBC."}, {"en": "Skin scraping.", "vi": "Cạo da."}, {"en": "Immunological methods: indirect immunofluorescence, ELISA, immunoblotting (Western blot).", "vi": "Các phương pháp miễn dịch: miễn dịch huỳnh quang gián tiếp, ELISA, miễn dịch thấm (Western blot)."}, {"en": "Prevention and treatment", "vi": "Phòng ngừa và điều trị"}, {"en": "For the above-mentioned harm and discouraged effects, the protection against and treatment for parasitic diseases is of vital importance.", "vi": "Do những tác hại và ảnh hưởng bất lợi nêu trên, việc phòng và điều trị bệnh ký sinh trùng có tầm quan trọng sống còn."}, {"en": "In general, the most basic actions to carry out can be summarized as:", "vi": "Nhìn chung, những việc cơ bản nhất cần làm có thể tóm tắt như sau:"}, {"en": "Vaccinate for prevention or medicate for treatment of parasitic diseases.", "vi": "Tiêm vắc-xin để phòng bệnh hoặc dùng thuốc để điều trị bệnh ký sinh trùng."}, {"en": "Sanitize shed, pasture and water sources for animal.", "vi": "Vệ sinh chuồng trại, đồng cỏ và nguồn nước cho vật nuôi."}, {"en": "Destroy the intermediate host of parasites.", "vi": "Tiêu hủy vật chủ trung gian của ký sinh trùng."}, {"en": "Manage fecal matter for destruction of parasites’ eggs and larvae.", "vi": "Xử lý phân để tiêu diệt trứng và ấu trùng của ký sinh trùng."}], "extra": [], "vocab": [["Appetite", "/ˈæpɪtaɪt/", "Sự thèm ăn"], ["Arachnid", "/əˈræknɪd/", "Động vật thuộc lớp nhện"], ["Arthropod", "/ˈɑːrθrəˌpɒd/", "Động vật chân đốt"], ["Biological", "/ˌbaɪəˈlɒdʒɪkəl/", "Thuộc sinh vật học"], ["Dehydration", "/ˌdiːhaɪˈdreɪʃən/", "Sự mất nước"], ["Ectoparasite", "/ˌektəʊˈpærəsaɪt/", "Ngoại ký sinh trùng"], ["Endoparasite", "/ˌendəʊˈpærəsaɪt/", "Nội ký sinh trùng"], ["Entomology", "/ˌentəˈmɒlədʒi/", "Côn trùng học"], ["Epiparasite", "/ˈepɪˌpærəsaɪt/", "Ký sinh trùng bậc hai"], ["Eukaryotic", "/ˌjuːkæriˈɒtɪk/", "(Thuộc) sinh vật nhân thực"], ["Flotation", "/fləʊˈteɪʃən/", "Phù nổi"], ["Genetics", "/dʒəˈnetɪks/", "Di truyền học"], ["Helminth", "/ˈhelmɪnθ/", "Giun sán"], ["Helminthology", "/ˌhelmɪnˈθɒlədʒi/", "Khoa học về giun sán"], ["Hyperparasitism", "/ˌhaɪpəˈpærəsaɪtɪzəm/", "Siêu ký sinh"], ["Immunology", "/ˌɪmjʊˈnɒlədʒi/", "Miễn dịch học"], ["Interaction", "/ˌɪntərˈækʃən/", "Tương tác"], ["Invertebrate", "/ɪnˈvɜːtɪbrət/", "Động vật không xương sống"], ["Membrane", "/ˈmembreɪn/", "Màng"], ["Mode of life", "/məʊd əv laɪf/", "Phương thức sống"], ["Morphology", "/mɔːˈfɒlədʒi/", "Hình thái học"], ["Parasitology", "/ˌpærəsaɪˈtɒlədʒi/", "Ký sinh trùng học"], ["Pathology", "/pəˈθɒlədʒi/", "Bệnh học"], ["Rot manure fecal matter", "/rɒt məˈnjʊə ˈfiːkəl ˈmætə/", "Ủ phân"], ["Sedimentation", "/ˌsedɪmenˈteɪʃən/", "Lắng cặn"], ["Symbiotic", "/ˌsɪmbaɪˈɒtɪk/", "Đồng sinh"], ["Taxon", "/ˈtæksɒn/", "Nhóm phân loại"], ["Taxonomy", "/tækˈsɒnəmi/", "Phân loại học"], ["Terrestrial", "/təˈrestriəl/", "(Sống) trên mặt đất"], ["Tissue", "/ˈtɪʃuː/", "Mô"], ["Uni-", "/ˈjuːni/", "Một, đơn"], ["Vertebrate", "/ˈvɜːtɪbrət/", "Động vật có xương sống"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What does it mean by the term parasitism? What is parasite? (Ký sinh nghĩa là gì? Ký sinh trùng là gì?)", "answer": "Parasitism is a symbiotic relationship between organisms of different species in which the parasite benefits from a prolonged close association with the host, which is harmed. – Ký sinh là quan hệ đồng sinh giữa hai loài, trong đó ký sinh trùng được lợi từ mối liên hệ gần gũi kéo dài với vật chủ, còn vật chủ bị hại."}, {"type": "question", "qType": "open", "question": "2. How can parasites be classified? (Ký sinh trùng được phân loại như thế nào?)", "answer": "Based on their interactions with hosts and their life cycles: endoparasites vs ectoparasites, epiparasites (hyperparasitism), and parasitoids vs biotrophic parasites. – Dựa trên tương tác với vật chủ và vòng đời: nội ký sinh và ngoại ký sinh, ký sinh bậc hai (siêu ký sinh), ký sinh gây chết vật chủ và ký sinh sống nhờ mô sống."}, {"type": "question", "qType": "open", "question": "3. What kind of parasite is endoparasite? (Nội ký sinh trùng là loại gì?)", "answer": "Parasites that live inside the host, e.g. hookworms. – Ký sinh trùng sống bên trong vật chủ, ví dụ giun móc."}, {"type": "question", "qType": "open", "question": "4. What kind of parasite is ectoparasite? (Ngoại ký sinh trùng là loại gì?)", "answer": "Parasites that live on the surface of the host, e.g. some mites. – Ký sinh trùng sống trên bề mặt vật chủ, ví dụ một số loài ve, mạt."}, {"type": "question", "qType": "open", "question": "5. What kind of parasite is epiparasite? (Ký sinh bậc hai là loại gì?)", "answer": "A parasite that feeds on another parasite (hyperparasitism), very common in the insect world. – Ký sinh trùng sống nhờ vào một ký sinh trùng khác (siêu ký sinh), rất phổ biến ở côn trùng."}, {"type": "question", "qType": "open", "question": "6. What kind of parasite is Parasitoid? (Ký sinh gây chết vật chủ là loại gì?)", "answer": "A parasite that eventually causes the host to die as a result of infection, often from loss of host tissues or nutrients (sometimes called necrotrophs). – Ký sinh trùng cuối cùng làm vật chủ chết do nhiễm bệnh, thường do mất mô hoặc chất dinh dưỡng của vật chủ."}, {"type": "question", "qType": "open", "question": "7. What are the general effects caused by parasites to host animal? (Ký sinh trùng gây những ảnh hưởng chung nào cho vật chủ?)", "answer": "They reduce host fitness: general or specialized pathology, impairment of secondary sex characteristics, and modification of host behavior; symptoms include poor appetite, weight loss and diarrhea. – Chúng làm giảm sức thích nghi của vật chủ: bệnh lý chung hay chuyên biệt, suy giảm đặc điểm sinh dục phụ, thay đổi hành vi; triệu chứng gồm kém ăn, sụt cân, tiêu chảy."}, {"type": "question", "qType": "open", "question": "8. What does it mean by the term Veterinary Parasitology? (Ký sinh trùng học thú y nghĩa là gì?)", "answer": "The study of animal parasites, especially the relationships and interactions between parasites and animal hosts (domestic and wild animals). – Ngành nghiên cứu ký sinh trùng của động vật, đặc biệt là mối quan hệ và tương tác giữa ký sinh trùng và vật chủ là động vật (nuôi và hoang dã)."}, {"type": "question", "qType": "open", "question": "9. Why is veterinary parasitology important? (Vì sao ký sinh trùng học thú y quan trọng?)", "answer": "It helps veterinary practice and animal breeding, protects animals and improves their health, and since some animal parasites are transmitted to humans it is also important for public health. – Nó giúp thực hành thú y và công tác giống, bảo vệ vật nuôi và cải thiện sức khỏe chúng, đồng thời một số ký sinh trùng lây sang người nên cũng quan trọng với sức khỏe cộng đồng."}, {"type": "question", "qType": "open", "question": "10. What are divisions of Veterinary Parasitology? (Các phân ngành của ký sinh trùng học thú y là gì?)", "answer": "Veterinary Protozoology, Veterinary Helminthology and Veterinary Entomology (Arachnoentomology). – Đơn bào học thú y, giun sán học thú y và côn trùng học thú y (nhện – côn trùng)."}, {"type": "question", "qType": "open", "question": "11. What kind of parasites is the focus of Veterinary Protozoology? (Đơn bào học thú y tập trung vào loại ký sinh trùng nào?)", "answer": "Protozoans: unicellular eukaryotes whose cells have membrane-bound nuclei, showing mobility and heterotrophy. – Động vật nguyên sinh: sinh vật nhân thực đơn bào, có nhân bao bọc bởi màng, có khả năng di động và dị dưỡng."}, {"type": "question", "qType": "open", "question": "12. What kind of parasites is the focus of Veterinary Helminthology? (Giun sán học thú y tập trung vào loại ký sinh trùng nào?)", "answer": "Helminths: worm-like internal parasites (worms, flukes and tape-worms) that live inside the host and disrupt its nutrient absorption. – Giun sán: ký sinh trùng đường trong giống con giun (giun, sán lá, sán dây) sống trong vật chủ và làm gián đoạn sự hấp thu dưỡng chất."}, {"type": "question", "qType": "open", "question": "13. What kind of parasites is the focus of Veterinary Entomology? (Côn trùng học thú y tập trung vào loại ký sinh trùng nào?)", "answer": "Arachnids (spiders, scorpions, mites…) and insects – joint-legged arthropods important in veterinary medicine. – Nhện (nhện, bọ cạp, ve mạt…) và côn trùng – động vật chân đốt quan trọng trong thú y."}, {"type": "question", "qType": "open", "question": "14. What are the general symptoms and signs of parasitic infection of animal? (Triệu chứng và dấu hiệu chung của nhiễm ký sinh trùng ở động vật là gì?)", "answer": "Poor or no appetite, weight loss or no weight gain, diarrhea or loose frequent stools, very smelly stools, pale/dull membranes, lethargy; severe cases show extreme lethargy and dehydration. – Kém ăn hoặc bỏ ăn, sụt cân hoặc không tăng cân, tiêu chảy hoặc phân lỏng, phân rất hôi, niêm mạc nhợt, lờ đờ; ca nặng thì cực kỳ lờ đờ và mất nước."}, {"type": "question", "qType": "open", "question": "15. How can parasites be identified and diagnosed? (Làm thế nào để xác định và chẩn đoán ký sinh trùng?)", "answer": "By coprological examination (flotation, sedimentation, McMaster, Baermann), haematology (blood smear, Giemsa stain, Diff-Quick, QBC), skin scraping and immunological methods (indirect immunofluorescence, ELISA, Western blot). – Bằng xét nghiệm phân, huyết học (phết máu, nhuộm Giemsa…), cạo da và các phương pháp miễn dịch (miễn dịch huỳnh quang gián tiếp, ELISA, Western blot)."}, {"type": "question", "qType": "open", "question": "16. How can parasitic diseases be prevented or cured? (Làm thế nào để phòng hoặc chữa bệnh ký sinh trùng?)", "answer": "Vaccinate or medicate; sanitize sheds, pasture and water sources; destroy intermediate hosts; manage fecal matter to destroy parasite eggs and larvae. – Tiêm vắc-xin hoặc dùng thuốc; vệ sinh chuồng trại, đồng cỏ, nguồn nước; tiêu hủy vật chủ trung gian; xử lý phân để diệt trứng và ấu trùng."}, {"type": "content", "title": "Practice 2: Diagnostic methods", "content": "Mô tả ngắn các phương pháp chẩn đoán ký sinh trùng. Đáp án là kiến thức chung (bài đọc chỉ liệt kê tên phương pháp), bạn đối chiếu thêm với bài giảng."}, {"type": "question", "qType": "open", "question": "1. Give a brief description of flotation method for identifying and diagnosing parasites in animals, types of parasite to be identified. (Mô tả ngắn phương pháp phù nổi và loại ký sinh trùng phát hiện được.)", "answer": "Feces are mixed with a flotation solution denser than parasite eggs (e.g. saturated salt or sugar); eggs/oocysts float to the surface and are collected on a coverslip and examined under the microscope. It detects eggs of nematodes, cestodes and some trematodes, and protozoan oocysts. – Trộn phân với dung dịch nổi có tỷ trọng cao hơn trứng (muối hoặc đường bão hòa); trứng/noãn nang nổi lên mặt, lấy bằng lamen và soi kính hiển vi. Phát hiện trứng giun tròn, sán dây, một số sán lá và noãn nang đơn bào."}, {"type": "question", "qType": "open", "question": "2. Give a brief description of sedimentation method for identifying and diagnosing parasites in animals, types of parasite to be identified. (Mô tả ngắn phương pháp lắng cặn và loại ký sinh trùng phát hiện được.)", "answer": "Feces are suspended in water and left to settle (or centrifuged); heavy eggs sink and the sediment is examined microscopically. It is used for heavy eggs such as trematode (fluke) eggs. – Hòa phân trong nước để lắng (hoặc ly tâm); trứng nặng chìm xuống và cặn được soi kính. Dùng cho trứng nặng như trứng sán lá."}, {"type": "question", "qType": "open", "question": "3. What is the Baermann method? Describe the procedure of using this method for identifying and diagnosing parasites in animals? (Phương pháp Baermann là gì? Mô tả quy trình.)", "answer": "A technique to recover live larvae: fresh feces wrapped in gauze are suspended in a funnel of warm water; active larvae migrate out of the feces and sink into the funnel stem, and are collected and examined. Used for lungworm larvae and other nematode larvae (e.g. Strongyloides). – Kỹ thuật thu ấu trùng còn sống: gói phân tươi trong gạc, treo trong phễu nước ấm; ấu trùng chui ra và lắng xuống cuống phễu, được thu lại để soi. Dùng cho ấu trùng giun phổi và giun tròn khác."}, {"type": "question", "qType": "open", "question": "4. How can McMaster method be used for identifying and diagnosing parasites in animals? (Phương pháp McMaster dùng để chẩn đoán ký sinh trùng như thế nào?)", "answer": "A quantitative flotation method: a known weight of feces is mixed with flotation fluid and loaded in a McMaster counting chamber; eggs are counted and converted to eggs per gram (EPG) to estimate worm burden. – Phương pháp phù nổi định lượng: trộn lượng phân đã biết với dung dịch nổi, cho vào buồng đếm McMaster; đếm trứng và quy ra số trứng trên mỗi gam phân (EPG) để ước tính mức nhiễm."}, {"type": "content", "title": "IV. Assignment", "content": "1) Viết một đoạn ngắn về một loại ký sinh trùng giun sán (giun, sán lá, sán dây): đặc điểm hình thái, vòng đời và tác hại. 2) Viết đoạn ngắn về một bệnh ký sinh trùng: triệu chứng và cách chữa. 3) Viết đoạn ngắn về quy trình phòng bệnh ký sinh trùng ở một trại chăn nuôi bạn biết."}], "rev": 1, "prev": 1}, {"id": 7, "title": "Vi sinh vật thú y", "sub": "Microbiology", "color": "#D49A5A", "reading": [{"en": "Microbiology is a scientific branch.", "vi": "Vi sinh vật học là một ngành khoa học."}, {"en": "Its research mainly focused on microorganism’s characteristics such as morphology, sizes, biological, and chemo/physiological, its studies included bacteria, viruses, fungus, protozoa….", "vi": "Nghiên cứu của ngành chủ yếu tập trung vào các đặc điểm của vi sinh vật như hình thái, kích thước, đặc tính sinh học và hóa/sinh lý, gồm các nghiên cứu về vi khuẩn, virus, nấm, động vật nguyên sinh…."}, {"en": "Applying these researches into practice in term of improving productivities, protect farm animals, plants and community health.", "vi": "Các nghiên cứu này được ứng dụng vào thực tiễn nhằm nâng cao năng suất, bảo vệ vật nuôi, cây trồng và sức khỏe cộng đồng."}, {"en": "Microbiology is a broad term which includes many branches like virology, mycology, parasitology and others.", "vi": "Vi sinh vật học là một thuật ngữ rộng gồm nhiều phân ngành như virus học, nấm học, ký sinh trùng học và các ngành khác."}, {"en": "A person who specializes in the area of microbiology is a microbiologist.", "vi": "Người chuyên về lĩnh vực vi sinh vật học là nhà vi sinh vật học."}, {"en": "Although much is now known in the field of microbiology, advances are being made regularly.", "vi": "Mặc dù hiện nay đã biết nhiều trong lĩnh vực vi sinh vật học, những tiến bộ vẫn liên tục xuất hiện."}, {"en": "We have probably only studied about one percent of all of the microbe species on Earth.", "vi": "Có lẽ chúng ta mới nghiên cứu khoảng một phần trăm tổng số loài vi sinh vật trên Trái Đất."}, {"en": "Thus, despite the fact that over three hundred years have passed since the discovery of microbes, the field of microbiology could be said to be in its infancy relative to other biological disciplines such as zoology, botany and entomology.", "vi": "Vì vậy, dù đã hơn ba trăm năm trôi qua kể từ khi phát hiện ra vi sinh vật, vi sinh vật học vẫn có thể coi là còn non trẻ so với các ngành sinh học khác như động vật học, thực vật học và côn trùng học."}, {"en": "Bacteria and microorganisms were first observed by Antonie van Leeuwenhoek in 1676 using a single-lens microscope of his own design.", "vi": "Vi khuẩn và vi sinh vật được Antonie van Leeuwenhoek quan sát lần đầu vào năm 1676 bằng kính hiển vi một thấu kính do chính ông thiết kế."}, {"en": "In doing so Leeuwenhoek made one of the most important discoveries in biology and initiated the scientific fields of bacteriology and microbiology.", "vi": "Nhờ vậy, Leeuwenhoek đã có một trong những khám phá quan trọng nhất của sinh học và mở ra các ngành khoa học về vi khuẩn học và vi sinh vật học."}, {"en": "The name “bacterium” was introduced much later, by Ehrenberg in 1828, derived from the Greek βακτηριον meaning “small stick”.", "vi": "Tên gọi “bacterium” (vi khuẩn) được Ehrenberg đưa ra muộn hơn nhiều, vào năm 1828, bắt nguồn từ tiếng Hy Lạp βακτηριον nghĩa là “cây gậy nhỏ”."}, {"en": "While Van Leeuwenhoek is often cited as the first microbiologist, the first recorded microbiological observation, that of the fruiting bodies of molds, was made earlier in 1665 by Robert Hooke.", "vi": "Tuy Van Leeuwenhoek thường được nhắc đến như nhà vi sinh vật học đầu tiên, quan sát vi sinh vật đầu tiên được ghi lại, về thể quả của nấm mốc, đã được Robert Hooke thực hiện sớm hơn vào năm 1665."}, {"en": "The field of bacteriology (later a subdiscipline of microbiology) is generally considered to have been founded by Ferdinand Cohn (1828–1898), a botanist whose studies on algae and photosynthetic bacteria led him to describe several bacteria including Bacillus and Beggiatoa.", "vi": "Ngành vi khuẩn học (sau này là một phân ngành của vi sinh vật học) thường được coi là do Ferdinand Cohn (1828–1898) sáng lập, một nhà thực vật học mà các nghiên cứu về tảo và vi khuẩn quang hợp đã dẫn ông đến việc mô tả nhiều loại vi khuẩn, trong đó có Bacillus và Beggiatoa."}, {"en": "Cohn was also the first to formulate a scheme for the taxonomic classification of bacteria.", "vi": "Cohn cũng là người đầu tiên xây dựng sơ đồ phân loại học cho vi khuẩn."}, {"en": "Louis Pasteur (1822–1895) and Robert Koch (1843–1910) were contemporaries of Cohn’s and are often considered to be the founders of medical microbiology.", "vi": "Louis Pasteur (1822–1895) và Robert Koch (1843–1910) là những người cùng thời với Cohn và thường được xem là những người sáng lập ngành vi sinh vật học y học."}, {"en": "Pasteur is most famous for his series of experiments designed to disprove then widely held theory of spontaneous generation, thereby solidifying microbiology’s identity as a biological science.", "vi": "Pasteur nổi tiếng nhất với loạt thí nghiệm nhằm bác bỏ thuyết tự sinh vốn được chấp nhận rộng rãi lúc bấy giờ, qua đó củng cố vị thế của vi sinh vật học như một ngành khoa học sinh học."}, {"en": "Pasteur also designed methods for food preservation (pasteurization) and vaccines against several diseases such as anthrax, fowl cholera and rabies.", "vi": "Pasteur cũng đã thiết kế các phương pháp bảo quản thực phẩm (tiệt trùng Pasteur) và vắc-xin phòng một số bệnh như nhiệt thán, dịch tả gia cầm và bệnh dại."}, {"en": "Koch is best known for his contributions to the germ theory of disease, proving that specific diseases were caused by specific pathogenic microorganisms.", "vi": "Koch được biết đến nhiều nhất nhờ đóng góp cho thuyết mầm bệnh, chứng minh rằng những bệnh cụ thể do những vi sinh vật gây bệnh cụ thể gây ra."}, {"en": "He developed a series of criteria that have become known as the Koch's postulates.", "vi": "Ông đã xây dựng một loạt tiêu chuẩn mà ngày nay được gọi là các tiêu chuẩn Koch."}, {"en": "Koch was one of the first scientists to focus on the isolation of bacteria in pure culture resulting in his description of several novel bacteria including Mycobacterium tuberculosis, the causative agent of tuberculosis.", "vi": "Koch là một trong những nhà khoa học đầu tiên tập trung vào việc phân lập vi khuẩn trong môi trường nuôi cấy thuần, dẫn đến việc ông mô tả nhiều loại vi khuẩn mới, trong đó có Mycobacterium tuberculosis, tác nhân gây bệnh lao."}, {"en": "While Pasteur and Koch are often considered the founders of microbiology, their work did not accurately reflect the true diversity of the microbial world because of their exclusive focus on microorganisms having direct medical relevance.", "vi": "Dù Pasteur và Koch thường được xem là những người sáng lập vi sinh vật học, công trình của họ chưa phản ánh đúng sự đa dạng thực sự của thế giới vi sinh vật vì họ chỉ tập trung vào những vi sinh vật có liên quan trực tiếp đến y học."}, {"en": "It was not until the work of Martinus Beijerinck (1851–1931) and Sergei Winogradsky (1856–1953), the founders of general microbiology (an older term encompassing aspects of microbial physiology, diversity and ecology), that the true breadth of microbiology was revealed.", "vi": "Phải đến công trình của Martinus Beijerinck (1851–1931) và Sergei Winogradsky (1856–1953), những người sáng lập vi sinh vật học đại cương (một thuật ngữ cũ bao gồm sinh lý, đa dạng và sinh thái của vi sinh vật), tầm vóc thực sự của vi sinh vật học mới được bộc lộ."}, {"en": "Beijerinck made two major contributions to microbiology: the discovery of viruses and the development of enrichment culture techniques.", "vi": "Beijerinck có hai đóng góp lớn cho vi sinh vật học: phát hiện ra virus và phát triển kỹ thuật nuôi cấy làm giàu."}, {"en": "While his work on the Tobacco Mosaic Virus established the basic principles of virology, it was his development of enrichment culturing that had the most immediate impact on microbiology by allowing for the cultivation of a wide range of microbes with wildly different physiologies.", "vi": "Trong khi nghiên cứu của ông về virus khảm thuốc lá đặt nền móng cho các nguyên lý cơ bản của virus học, thì chính việc phát triển nuôi cấy làm giàu mới có tác động tức thời nhất đến vi sinh vật học, nhờ cho phép nuôi cấy nhiều loại vi sinh vật có sinh lý rất khác nhau."}, {"en": "Winogradsky was the first to develop the concept of chemolithotrophy and to thereby reveal the essential role played by microorganisms in geochemical processes.", "vi": "Winogradsky là người đầu tiên đưa ra khái niệm hóa dưỡng vô cơ và qua đó chỉ ra vai trò thiết yếu của vi sinh vật trong các quá trình địa hóa."}, {"en": "He was responsible for the first isolation and description of both nitrifying and nitrogen-fixing bacteria.", "vi": "Ông là người đầu tiên phân lập và mô tả cả vi khuẩn nitrat hóa lẫn vi khuẩn cố định đạm."}, {"en": "The vast increase in the number of microbiological investigation and in scientific knowledge during the 1800s opened new fields of science, including disciplines called environmental science, immunology, epidemiology, chemotherapy, and genetic engineering.", "vi": "Sự gia tăng mạnh mẽ về số lượng nghiên cứu vi sinh vật và kiến thức khoa học trong thế kỷ 19 đã mở ra những lĩnh vực khoa học mới, gồm các ngành như khoa học môi trường, miễn dịch học, dịch tễ học, hóa trị liệu và kỹ thuật di truyền."}, {"en": "Microorganisms played significant role in the development of this disciplines because microorganisms are relatively easy to grow, take up little space, and are available by the trillions.", "vi": "Vi sinh vật đóng vai trò quan trọng trong sự phát triển của các ngành này vì chúng tương đối dễ nuôi, chiếm ít không gian và có sẵn với số lượng hàng nghìn tỷ."}, {"en": "Much of what has been learned about microbes also applies to other organisms, including humans.", "vi": "Phần lớn những gì học được về vi sinh vật cũng áp dụng cho các sinh vật khác, kể cả con người."}], "extra": [], "vocab": [["Microbiology", "/ˌmaɪ.krəʊ.baɪˈɒl.ə.dʒi/", "Vi trùng học"], ["Microorganism", "/ˌmaɪ.krəʊˈɔː.ɡən.ɪ.zəm/", "Vi sinh vật"], ["Microbe", "/ˈmaɪ.krəʊb/", "Vi trùng, vi khuẩn"], ["Unicellular", "/ˌjuː.nɪˈsel.jə.lər/", "Đơn bào"], ["Cluster", "/ˈklʌs.tər/", "Bó, cụm"], ["Fungi", "/ˈfʌn.dʒaɪ/", "Nấm"], ["Protists", "/ˈprəʊ.tɪsts/", "Động vật nguyên sinh"], ["Bacteria", "/bækˈtɪə.ri.ə/", "Vi khuẩn"], ["Algae", "/ˈæl.dʒiː/", "Tảo"], ["Virus", "/ˈvaɪə.rəs/", "Vi rút"], ["Mycology", "/maɪˈkɒl.ə.dʒi/", "Nấm học"], ["Parasitology", "/ˌpær.ə.sɪˈtɒl.ə.dʒi/", "Ký sinh trùng học"], ["Zoology", "/zuˈɒl.ə.dʒi/", "Động vật học"], ["Botany", "/ˈbɒt.ən.i/", "Thực vật học"], ["Entomology", "/ˌen.təˈmɒl.ə.dʒi/", "Côn trùng học"], ["Anthrax", "/ˈæn.θræks/", "Bệnh nhiệt thán"], ["Taxonomic", "/ˌtæk.səˈnɒm.ɪk/", "Thuộc phân loại"], ["Contemporary", "/kənˈtem.pər.ər.i/", "Đương thời, cùng thời"], ["Cholera", "/ˈkɒl.ər.ə/", "Bệnh dịch tả"], ["Germ", "/dʒɜːm/", "Mầm bệnh, vi trùng"], ["Novel", "/ˈnɒv.əl/", "Mới lạ, lạ thường"], ["Breadth", "/bredθ/", "Quan điểm"], ["Nitrifying", "/ˈnaɪ.trɪ.faɪ.ɪŋ/", "Nitrat hóa"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What is common in the following studies: virology, mycology, parasitology? (Điểm chung của virus học, nấm học và ký sinh trùng học là gì?)", "answer": "They are all branches (sub-fields) of microbiology, studying microorganisms – viruses, fungi and parasites (protozoa). – Chúng đều là các phân ngành của vi sinh vật học, nghiên cứu vi sinh vật – virus, nấm và ký sinh trùng (đơn bào)."}, {"type": "question", "qType": "open", "question": "2. When were bacteria and microorganisms first observed? (Vi khuẩn và vi sinh vật được quan sát lần đầu khi nào?)", "answer": "In 1676, by Antonie van Leeuwenhoek using a single-lens microscope of his own design (the first recorded observation, of mold fruiting bodies, was by Robert Hooke in 1665). – Năm 1676, do Antonie van Leeuwenhoek quan sát bằng kính hiển vi một thấu kính tự thiết kế (quan sát đầu tiên được ghi lại, về thể quả nấm mốc, là của Robert Hooke năm 1665)."}, {"type": "question", "qType": "open", "question": "3. Why Louis Pasteur (1822–1895) and Robert Koch (1843–1910) are often considered to be the founders of medical microbiology? (Vì sao Pasteur và Koch thường được xem là những người sáng lập vi sinh vật học y học?)", "answer": "Pasteur disproved spontaneous generation and designed pasteurization and vaccines (anthrax, fowl cholera, rabies); Koch developed the germ theory of disease, proved specific microbes cause specific diseases, isolated bacteria in pure culture and formulated Koch’s postulates. – Pasteur bác bỏ thuyết tự sinh, tạo ra phương pháp tiệt trùng và vắc-xin; Koch xây dựng thuyết mầm bệnh, chứng minh vi sinh vật cụ thể gây bệnh cụ thể, phân lập vi khuẩn thuần và đề ra tiêu chuẩn Koch."}, {"type": "question", "qType": "open", "question": "4. Why it was said that the true breadth of microbiology not revealed until the work of Martinus Beijerinck (1851–1931) and Sergei Winogradsky (1856–1953)? (Vì sao nói tầm vóc thực sự của vi sinh vật học chỉ lộ ra nhờ Beijerinck và Winogradsky?)", "answer": "Because Pasteur and Koch focused only on microorganisms of direct medical relevance, whereas Beijerinck (viruses, enrichment cultures) and Winogradsky (chemolithotrophy, nitrifying and nitrogen-fixing bacteria, role of microbes in geochemical processes) revealed the wider diversity and ecology of microbes. – Vì Pasteur và Koch chỉ chú ý vi sinh vật liên quan trực tiếp đến y học, còn Beijerinck (virus, nuôi cấy làm giàu) và Winogradsky (hóa dưỡng vô cơ, vi khuẩn nitrat hóa và cố định đạm, vai trò địa hóa) đã cho thấy sự đa dạng và sinh thái rộng hơn của vi sinh vật."}, {"type": "content", "title": "Practice 2: True or false statement", "content": "Quyết định đúng (True) hay sai (False), rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "truefalse", "question": "1. We have studied all everything of all microbe species on earth. (Chúng ta đã nghiên cứu tất cả mọi thứ về mọi loài vi sinh vật trên Trái Đất.)", "answer": "false", "explain": "Sai: bài đọc nói có lẽ chúng ta mới nghiên cứu khoảng một phần trăm các loài vi sinh vật."}, {"type": "question", "qType": "truefalse", "question": "2. Louis Pasteur made two major contributions to microbiology: the discovery of viruses and the development of enrichment culture techniques. (Louis Pasteur có hai đóng góp lớn: phát hiện virus và kỹ thuật nuôi cấy làm giàu.)", "answer": "false", "explain": "Sai: hai đóng góp này là của Martinus Beijerinck, không phải của Pasteur."}, {"type": "question", "qType": "truefalse", "question": "3. Ferdinand Cohn (1828–1898), a biologist whose studies on fungi led him to describe several bacteria including Bacillus and Beggiatoa. (Ferdinand Cohn là nhà sinh học, nghiên cứu về nấm giúp ông mô tả nhiều vi khuẩn.)", "answer": "false", "explain": "Sai: Cohn là nhà thực vật học (botanist), nghiên cứu về tảo và vi khuẩn quang hợp (không phải nấm)."}, {"type": "question", "qType": "truefalse", "question": "4. Pasteur designed methods for food preservation (pasteurization) and vaccines against several diseases such as anthrax, fowl cholera and rabies. (Pasteur thiết kế phương pháp bảo quản thực phẩm và vắc-xin phòng nhiều bệnh.)", "answer": "true", "explain": "Đúng: câu này lấy từ bài đọc."}, {"type": "question", "qType": "truefalse", "question": "5. Antonie van Leeuwenhoek designed a single-lens microscope and observed Bacteria microorganisms in 1676. (Leeuwenhoek tự thiết kế kính hiển vi một thấu kính và quan sát vi khuẩn năm 1676.)", "answer": "true", "explain": "Đúng: bài đ     if(Array.isArray(parsed[i].imgs)) lessons[i].imgs=parsed[i].imgs;

 }

function cleanForSpeech(text){
 if(!text) return '';
 // Remove content inside parentheses () and brackets [] including the brackets
 // e.g. "Production (n)" -> "Production", "Significant (adj)" -> "Significant"
 let cleaned = text.replace(/\s*\([^)]*\)/g, '').replace(/\s*\[[^\]]*\]/g, '').trim();
 // Also remove extra spaces
 cleaned = cleaned.replace(/\s{2,}/g, ' ').trim();
 // If after cleaning empty, fallback to original without parentheses symbols
 if(!cleaned) cleaned = text.replace(/[()\[\]]/g, '').trim();
 return cleaned;
}

// Bọc từng từ của 1 phần tử thành <span class="word">, ghi lại vị trí ký tự trong chuỗi đọc
function wrapWords(el, text, spans){
 const raw=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
 if(!raw) return text;
 karaokeEls.push({el, html:el.innerHTML});
 el.textContent='';
 raw.split(' ').forEach((w,i)=>{
  if(i>0){ el.appendChild(document.createTextNode(' ')); text+=' '; }
  const sp=document.createElement('span'); sp.className='word'; sp.textContent=w; el.appendChild(sp);
  spans.push({span:sp, start:text.length}); text+=w;
 });
 el.classList.add('highlight-mode');
 return text;
}

 enEls.forEach((el,i)=>{
  if(enSpans.length) enText+= (i>0 && enEls[i-1].classList.contains('numbered-title')) ? ': ' : ' ';
  enText=wrapWords(el,enText,enSpans);
 });
 if(enSpans.length) parts.push({text:enText, spans:enSpans, lang:'en', k:-2});
 if(withVi){
  const viEl=card.querySelector('.vie'); const viSpans=[];
  const viText=viEl? wrapWords(viEl,'',viSpans) : '';

 }

}

function chunkText(text){
 const pieces=[]; let last=0; const re=/[.!?;:,](\s+)/g; let m;
 while((m=re.exec(text))){ const end=m.index+1+m[1].length; pieces.push([last,end,text[m.index]]); last=end; }
 if(last<text.length) pieces.push([last,text.length,'']);
 const chunks=[]; let st=null;
 pieces.forEach(([a,b,p])=>{ if(st===null) st=a; const len=b-st; if((/[.!?;:]/.test(p) && len>=60) || len>=180 || p===''){ chunks.push([st,b]); st=null; } });
 if(st!==null) chunks.push([st,text.length]);
 return chunks.filter(([a,b])=>text.slice(a,b).trim());
}

 for(let i=0;i<sp.length;i++){ if(sp[i].start<=ci) k=i; else break; }
 if(ci>=pt.text.length) k=sp.length;
 if(k===pt.k) return; pt.k=k;
 sp.forEach((s,i)=>{ s.span.classList.toggle('read',i<k); s.span.classList.toggle('active',i===k); });
 const cur=sp[k]; if(!cur) return;
 const box=document.getElementById('mainContent'); const r=cur.span.getBoundingClientRect(); const br0=box.getBoundingClientRect(); const mob=isMobileLayout(); const topOff=mob? (document.getElementById('topBar').offsetHeight+document.getElementById('audioBar').offsetHeight-90) : 0; const br={top:Math.max(br0.top,0)+topOff, bottom:Math.min(br0.bottom, innerHeight)};
 if(r.top<br.top+90 || r.bottom>br.bottom-40) cur.span.scrollIntoView({behavior:'smooth',block:'center'});
}
function setVoice(u, lang){

  const vv=voices.find(v=>/^vi/i.test(v.lang)); if(vv) u.voice=vv; u.lang='vi-VN';
 }else{
  const sel=document.getElementById('voiceSelect'); const voice=voices.find(v=>v.name===sel.value); if(voice) u.voice=voice; u.lang='en-US';
 }
}

function speakParts(parts, onEnd){

 let qi=0;
 function finish(){
  stopKTimer();
  parts.forEach(pt=>pt.spans.forEach(x=>{ x.span.classList.remove('active'); x.span.classList.add('read'); }));
  setTimeout(()=>{ if(sid===speechSession) clearHighlight(); },700);
  if(onEnd) onEnd(); else resetPlayBtn();
 }
 function next(){
  if(sid!==speechSession) return;
  if(qi>=queue.length){ finish(); return; }
  const q=queue[qi++];
  const u=new SpeechSynthesisUtterance(q.pt.text.slice(q.a,q.b));
  setVoice(u,q.pt.lang); u.rate=rate;
  let gotBoundary=false;
  u.onstart=()=>{
   if(sid!==speechSession) return;
   const pi=parts.indexOf(q.pt); parts.forEach((pt,j)=>{ if(j<pi) markPos(pt,Infinity); });
   markPos(q.pt,q.a); stopKTimer();
   // Dự phòng: giọng nào không báo vị trí từ (VD giọng Google online) thì tự ước lượng theo thời gian
   const cps=(q.pt.lang==='vi'?13:14.5)*rate; let start=performance.now(), lastT=start;
   kTimer=setInterval(()=>{
    const now=performance.now(); if(synth.paused) start+=now-lastT; lastT=now;
    if(gotBoundary || synth.paused) return;
    markPos(q.pt, Math.min(q.a+Math.floor((now-start)/1000*cps), q.b-1));
   },90);
  };
  u.onboundary=e=>{ if(sid!==speechSession) return; if(e.name && e.name!=='word') return; gotBoundary=true; markPos(q.pt, q.a+e.charIndex); };
  u.onend=()=>{ if(sid!==speechSession) return; stopKTimer(); next(); };
  u.onerror=e=>{ if(sid!==speechSession) return; stopKTimer(); if(e.error==='interrupted'||e.error==='canceled') return; next(); };

}

const importInput=document.createElement('input'); importInput.type='file'; importInput.accept='.json'; importInput.style.display='none'; document.body.appendChild(importInput);

importInput.onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(Array.isArray(parsed) && parsed.length>0){
        // Ghi đè lessons
        for(let i=0;i<Math.min(parsed.length, lessons.length);i++){
          if(parsed[i].reading) lessons[i].reading=parsed[i].reading;
          if(parsed[i].vocab) lessons[i].vocab=parsed[i].vocab;
          if(parsed[i].practice) lessons[i].practice=parsed[i].practice;
          if(parsed[i].extra) lessons[i].extra=parsed[i].extra;
          if(parsed[i].hard) lessons[i].hard=parsed[i].hard;
          if(Array.isArray(parsed[i].imgs)) lessons[i].imgs=parsed[i].imgs;
        }
        saveLessons(); renderAll();
        const t=document.createElement('div'); t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#8CB580] text-black px-4 py-2 rounded-full text-sm font-medium shadow-lg z-50'; t.textContent='✅ Đã nhập lại dữ liệu từ JSON'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
      }
    }catch(err){ alert('File JSON lỗi: '+err.message); }
  };

function imgvSets(){
  const all=[];
  lessons.forEach((ll,li)=>{
    BUILTIN_IMGS.filter(b=>b.lesson===ll.id).forEach(b=>all.push({...b, li, builtin:true}));
    (ll.imgs||[]).forEach(u=>all.push({...u, li, builtin:false}));
  });
  return all;
}
function imgvNorm(t){
  return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();
}
function imgvSing(t){ return t.split(' ').map(w=>w.length>3? w.replace(/(es|s)$/,'') : w).join(' '); }
function imgvEq(input, it){
  const a=imgvNorm(input); if(!a) return false;
  return [it.word,...(it.alts||[])].some(x=>{ const b=imgvNorm(x); return a===b || imgvSing(a)===imgvSing(b); });
}
function imgvShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  const top=document.createElement('div'); top.className='flex flex-wrap items-center justify-center gap-2';

    <button data-sc="all" class="ivBtn ${cfg.scope==='all'?'on':''}">📚 Tất cả các bài</button>
