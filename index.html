<style>
body{font-family:Inter,system-ui;background:#0F0F0F;color:#E5E7EB}
.sidebar{background:#161616;border-right:1px solid #262626}
.card{background:#1E1E1E;border:1px solid #2A2A2A}
.eng{font-size:16px;line-height:1.7;color:#E5E7EB}
.vie{font-size:14px;color:#9CA3AF;font-style:italic;border-left:3px solid #8CB580;padding-left:12px;margin:8px 0 20px 0;line-height:1.6}
.yellow-badge{background:#FACC15;color:#000;font-weight:800;width:34px;height:34px;min-width:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 0 4px rgba(250,204,21,0.18);flex-shrink:0}
.numbered-title{font-weight:800;color:#8CB580 !important;font-size:17px;line-height:1.4}
.numbered-card{border-left:4px solid #FACC15 !important;background:linear-gradient(90deg, rgba(250,204,21,0.06) 0%, #1E1E1E 18%) !important}
.tab-active{background:#8CB580;color:#000 !important;font-weight:600}
.word{transition:all 0.15s ease; border-radius:4px; padding:1px 2px;}
.word.active{background:#FACC15;color:#000 !important;font-weight:700;box-shadow:0 0 8px rgba(250,204,21,0.6);}
.word.read{color:#8CB580 !important;opacity:0.8;}
.eng.highlight-mode .word{opacity:0.6;}
.numbered-title .word.active{background:#8CB580;color:#000 !important;}
.vie.highlight-mode .word{opacity:0.75;}
.vie .word.active{background:#FACC15;color:#000 !important;font-style:normal;opacity:1;}
.vie .word.read{color:#FACC15 !important;opacity:0.85;}
.word.active{opacity:1 !important;}
.row-new{animation:rowNew 2s ease}
.qopt-ok{border-color:#8CB580 !important;background:rgba(140,181,128,.15) !important}
.qopt-bad{border-color:#F87171 !important;background:rgba(248,113,113,.12) !important}
.qfb{margin-top:10px;font-size:13px;font-weight:600}
.hintBtn{margin-top:10px;padding:6px 14px;border-radius:999px;background:#2A2A2A;font-size:12px}
.sys-card .eng{font-weight:700;color:#8CB580 !important}
.sys-card .vie{font-weight:600;font-style:normal;color:#C9D6C3}
#quizOpts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:760px;margin-top:16px}
@media (max-width:640px){#quizOpts{grid-template-columns:repeat(2,1fr)}}
.spkBtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:8px;border-radius:9999px;background:#2A2A2A;vertical-align:middle}
.spkBtn:hover{background:#333}
.orgTable{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:14px}
.orgTable th:first-child{border-top-left-radius:12px}.orgTable th:last-child{border-top-right-radius:12px}
.orgC{vertical-align:top;padding:12px;border-bottom:1px solid #2A2A2A;border-left:1px solid #2A2A2A}
.orgC:first-child{border-left:0;width:20%}.orgTable td:nth-child(2){width:30%}
.orgRow:nth-child(even) .orgC{background:rgba(255,255,255,.025)}
.orgSys{font-weight:800;color:#8CB580}
.orgFn{list-style:disc;padding-left:18px}.orgFn li{margin-bottom:8px}.orgFn li:last-child{margin-bottom:0}
.viSm{font-size:12px;color:#9CA3AF;font-style:italic;margin-top:2px;line-height:1.5}
.orgSpk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-top:8px;border-radius:9999px;background:#2A2A2A;font-size:13px}
.orgSpk:hover{background:#333}
.sub-card{margin-left:28px}
@media (max-width:640px){.sub-card{margin-left:14px}}
#selPop{position:fixed;z-index:60;width:300px;max-width:calc(100vw - 16px);background:#1E1E1E;border:1px solid #3A3A3A;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:10px;display:none}
#selPop .sp-word{font-weight:700;color:#FACC15;font-size:14px;margin-bottom:8px;word-break:break-word;max-height:60px;overflow:auto}
#selPop .sp-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;background:#2A2A2A;font-size:13px;margin-top:6px}
#selPop .sp-btn:hover{background:#333}
#selPop .sp-btn.pri{background:#8CB580;color:#000;font-weight:700}
#selPop input{width:100%;background:#0F0F0F;border:1px solid #2A2A2A;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px;outline:none;color:#E5E7EB}
#selPop input:focus{border-color:#8CB580}
::highlight(pair-mean){background-color:#FACC15;color:#000}
mark.pair-mean{background:#FACC15;color:#000;border-radius:3px;padding:0 1px}
#selPop .sp-mean{font-size:12px;color:#E5E7EB;background:#0F0F0F;border:1px solid #2A2A2A;border-radius:10px;padding:6px 9px;margin-bottom:4px;line-height:1.5}
#selPop .sp-mean b{color:#8CB580}
#selPop .sp-note{font-size:11px;color:#9CA3AF;margin-top:6px}
@keyframes rowNew{0%{background:rgba(140,181,128,.45)}100%{background:transparent}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

<script>
const lessons = [{"id": 1, "title": "Tổng quan về khoa học vật nuôi", "sub": "Overview of Animal Sciences", "color": "#8CB580", "reading": [{"en": "Animal agriculture is a significant portion of agriculture production.", "vi": "Ngành chăn nuôi động vật chiếm một phần quan trọng trong sản lượng nông nghiệp."}, {"en": "Related research, education, and extension activities are continually changing to address new challenges and opportunities brought about by rapidly advancing technologies, evolving consumer demand, and the need to make positive contributions to environmental, human, and animal health.", "vi": "Các hoạt động nghiên cứu, giáo dục và khuyến nông liên quan liên tục thay đổi để giải quyết những thách thức và cơ hội mới do công nghệ tiến bộ nhanh chóng, nhu cầu của người tiêu dùng thay đổi và nhu cầu đóng góp tích cực cho sức khỏe môi trường, con người và động vật mang lại."}, {"en": "Efficient, science-based animal agriculture translates into affordable and high-quality food for the consumer.", "vi": "Ngành chăn nuôi hiệu quả dựa trên cơ sở khoa học mang lại nguồn thực phẩm chất lượng cao và giá cả phải chăng cho người tiêu dùng."}, {"en": "Researchers collaborate with industry and other interested parties to develop and disseminate knowledge and methods to improve agriculturally relevant animal systems.", "vi": "Các nhà nghiên cứu hợp tác với ngành công nghiệp và các bên liên quan khác để phát triển và phổ biến kiến thức cũng như phương pháp nhằm cải thiện các hệ thống vật nuôi liên quan đến nông nghiệp."}, {"en": "1. Animal Breeding, Genetics & Genomics: Animal protein is essential in meeting escalating nutritional needs around the world.", "vi": "1. Nhân giống, Di truyền & Bộ gen Động vật: Protein động vật là thiết yếu để đáp ứng nhu cầu dinh dưỡng ngày càng tăng trên toàn thế giới."}, {"en": "Animal Breeding, Genetics & Genomics research focuses on desirable genetic animal traits that have revolutionized poultry, livestock, and fish production.", "vi": "Nghiên cứu về Nhân giống, Di truyền & Bộ gen động vật tập trung vào các tính trạng di truyền mong muốn ở động vật, vốn đã cách mạng hóa ngành sản xuất gia cầm, gia súc và cá."}, {"en": "These genetic traits include animals that are leaner; have increased disease resistance; or excel in growth rate or the production of eggs, meat, milk, wool, or mohair.", "vi": "Các tính trạng di truyền này bao gồm động vật ít mỡ (nhiều nạc) hơn; có khả năng kháng bệnh tăng lên; hoặc vượt trội về tốc độ tăng trưởng hoặc sản lượng trứng, thịt, sữa, len hoặc vải nỉ (mohair)."}, {"en": "The natural efficiency of an animal to use nutrients in its feed could affect the nutrients in the manure and thus affect the environment.", "vi": "Hiệu quả tự nhiên của động vật trong việc sử dụng chất dinh dưỡng trong thức ăn có thể ảnh hưởng đến chất dinh dưỡng trong phân và do đó ảnh hưởng đến môi trường."}, {"en": "2. Animal Nutrition and Growth: Inefficient nutrient intake by animals is financially and environmentally costly in animal operations from livestock farms to fish farms.", "vi": "2. Dinh dưỡng và Tăng trưởng Động vật: Sự hấp thụ chất dinh dưỡng không hiệu quả ở động vật gây tốn kém về mặt tài chính và môi trường trong các hoạt động chăn nuôi từ trang trại gia súc đến trang trại nuôi cá."}, {"en": "It not only hurts animal growth, health, and well-being, but it may also affect the safety and quality of the food products.", "vi": "Nó không chỉ làm tổn hại đến sự tăng trưởng, sức khỏe và sự thoải mái của động vật mà còn có thể ảnh hưởng đến sự an toàn và chất lượng của các sản phẩm thực phẩm."}, {"en": "It may result in excess nutrients polluting the environment in the form of odors or ground water contamination.", "vi": "Nó có thể dẫn đến việc dư thừa chất dinh dưỡng gây ô nhiễm môi trường dưới dạng mùi hôi hoặc ô nhiễm nguồn nước ngầm."}, {"en": "The primary objective of the Animal Growth and Nutrition Program is to discover the nutritional, biological, and genetic factors underlying normal animal growth, nutrient digestion and efficiency, metabolism, lactation, and muscle and bone development.", "vi": "Mục tiêu chính của Chương trình Dinh dưỡng và Tăng trưởng Động vật là phát hiện ra các yếu tố dinh dưỡng, sinh học và di truyền làm cơ sở cho sự tăng trưởng bình thường của động vật, sự tiêu hóa và hiệu quả dinh dưỡng, sự trao đổi chất, sự tiết sữa, cũng như sự phát triển của cơ và xương."}, {"en": "3. Animal Products: Americans buy approximately $100 billion of animal products at the farm gate, and several times that amount at retail each year.", "vi": "3. Các sản phẩm từ Động vật: Người Mỹ mua khoảng 100 tỷ đô la các sản phẩm từ động vật tại trang trại và gấp nhiều lần số đó tại các cửa hàng bán lẻ mỗi năm."}, {"en": "These products include meat and meat products, poultry products (meat and eggs), fish, shellfish, dairy products (milk and cheese), and non-food products such as fiber (wool, mohair, cashmere, and leather).", "vi": "Các sản phẩm này bao gồm thịt và các sản phẩm từ thịt, sản phẩm gia cầm (thịt và trứng), cá, động vật có vỏ (sò, hến,...), sản phẩm từ sữa (sữa và phô mai), và các sản phẩm phi thực phẩm như xơ sợi (len, vải nỉ mohair, len cashmere và da)."}, {"en": "The quality and safety of animal products prior to harvest are influenced by genetics, nutrition, and management systems.", "vi": "Chất lượng và độ an toàn của các sản phẩm động vật trước khi thu hoạch chịu ảnh hưởng bởi di truyền, dinh dưỡng và hệ thống quản lý."}, {"en": "After harvest they are affected by handling, processing, storage, and marketing practices.", "vi": "Sau khi thu hoạch, chúng bị ảnh hưởng bởi các phương thức vận chuyển/xử lý, chế biến, bảo quản và tiếp thị."}, {"en": "4. Animal Reproduction: Reproductive efficiency is the major factor affecting profitability in many livestock production systems.", "vi": "4. Sinh sản ở Động vật: Hiệu quả sinh sản là yếu tố chính ảnh hưởng đến lợi nhuận trong nhiều hệ thống sản xuất chăn nuôi."}, {"en": "For example, the fertility of domestic ruminants (cattle and sheep), even under optimal conditions, is only about 50 percent.", "vi": "Ví dụ, khả năng sinh sản của động vật nhai lại (trâu bò và cừu), ngay cả trong điều kiện tối ưu, chỉ khoảng 50%."}, {"en": "Inefficient reproduction may be caused by numerous factors, including increased genetic selection for meat or milk production traits, early embryonic and fetal loss, failure to reach puberty at an optimum age, environmental stressors, production of low-potency sperm, and limited sex drive.", "vi": "Sinh sản kém hiệu quả có thể do nhiều yếu tố gây ra, bao gồm việc tăng cường chọn lọc di truyền cho các tính trạng sản xuất thịt hoặc sữa, sảy phôi và thai sớm, không đạt tuổi thành thục sinh sản ở độ tuổi tối ưu, các yếu tố gây căng thẳng từ môi trường, sản xuất tinh trùng chất lượng thấp và hạn chế ham muốn tình dục."}, {"en": "5. Animal Well-being: Evaluating farm animal well-being is a challenge to the animal food industry and scientific communities.", "vi": "5. Phúc lợi Động vật: Đánh giá phúc lợi của vật nuôi trang trại là một thách thức đối với ngành công nghiệp thực phẩm động vật và các cộng đồng khoa học."}, {"en": "Scientists study how to accurately measure an animal’s state of comfort and well-being in different environmental conditions.", "vi": "Các nhà khoa học nghiên cứu cách đo lường chính xác trạng thái thoải mái và khỏe mạnh của động vật trong các điều kiện môi trường khác nhau."}, {"en": "They also work to understand how animals react both behaviorally and biologically in stressful situations, such as in transport, or when animals must be restrained during medical treatment.", "vi": "Họ cũng nghiên cứu để hiểu cách động vật phản ứng cả về hành vi và sinh học trong các tình huống căng thẳng, chẳng hạn như khi vận chuyển hoặc khi động vật phải bị cố định trong quá trình đánh giá hoặc điều trị y tế."}, {"en": "These understandings are important to those who work with animals as pets, livestock, or wildlife to ensure the safety and well-being of both animals and humans as they interact.", "vi": "Những hiểu biết này rất quan trọng đối với những người làm việc với động vật với tư cách là thú cưng, gia súc hoặc động vật hoang dã để đảm bảo sự an toàn và phúc lợi của cả động vật và con người khi họ tương tác."}], "extra": [], "vocab": [["Agriculture (n)", "['æ   gri   kʌl   t∫ə]", "Nông nghiệp"], ["Significant (adj)", "[sig  'ni  fi  kənt]", "Quan trọng"], ["Portion (n)", "['pɔ:∫n]", "Phần"], ["Production (n)", "", "Sự sản xuất"], ["Address (v)", "[ə'dres]", "Giải quyết"], ["Challenges (n)", "['t∫ælindʒ]", "Thách thứC. thử thách"], ["Rapidly advancing technology", "['ræ pid li] [əd'vɑ:n sin] [tek'nɔlədʒi]", "Công nghệ tiến bộ nhanh chóng"], ["Evolve", "[i'vɔl - vin]", "Đang tiến triển"], ["Efficient", "[i'fi∫ənt]", "Hiệu quả"], ["Affordable", "[ə'fɔ:də bl]", "Phải chăng"], ["Consumer", "[kən'sju:mə]", "Người tiêu thụ/ tiêu dùng"], ["Disseminate (n)", "[di'se mi neit]", "Phổ biến, truyền bá"], ["Knowledge (n)", "['nɔ lidʒ]", "Sự hiểu biết, kiến thức"], ["Relevant", "['reləvənt]", "Liên quan"], ["Breeding", "['bri:diη]", "Sự sinh sản, Gây giống"], ["Genetics", "[dʒi'netiks]", "Di truyền"], ["Genomics", "[dʒi'noumik]", "Gen"], ["Escalating", "['es kə lei tin]", "Leo thang"], ["Nutritional", "[nju:'tri∫nl]", "(thuộc) Dinh dưỡng"], ["Desirable", "[di'zaiərəbl]", "Ao ướC. mong dợi"], ["Trait", "[treit]", "Nét, điểm"], ["Revolutionize", "[,revə'lu:∫ənaiz]", "Cách mạng hóa"], ["Poultry", "['poul tri]", "Gia cầm"], ["Livestock", "['laiv stɔk]", "Vật nuôi, thú nuôi"], ["Leaner", "[‘li:nə]", "ốm hơn"], ["Excel", "[ik'sel]", "Trội"], ["Wool", "[wul]", "Len"], ["Mohair", "['mou heə]", "Vải nỉ"], ["Manure", "[mə'njuə]", "Phân bón"], ["Growth", "[grouθ]", "Sư tăng trưởng, phát triển"], ["Intake (n)", "['inteik]", "Sự hấp thu"], ["Odor", "['oudə]", "Mùi/ dấu vết"], ["contamination", "[kən ,tæmi 'nei ∫n]", "sự làm bẩn, sự làm ô uế"], ["Digestion", "[di'dʒest∫n]", "Sự tiêu hóa"], ["metabolism", "[mə'tæbəlizm]", "sự trao đổi chất; sự chuyển hoá"], ["Lactation (n)", "[læk'tei∫n]", "Sự sinh sữA. thải sữa"], ["Puberty (n)", "['pju:bəti]", "Tuổi thành thục về tính"], ["Shellfish (n)", "['∫el fi∫]", "Sò, hến, động vật có vỏ"], ["Cashmere", "[kæ∫'miə]", "khăn san (bằng len) casơmia"], ["Leather (n)", "['leðə]", "Da/ Bằng da"], ["Fertility (n)", "[fə:'tiliti]", "Khả năng sinh sản, thụ tinh"], ["Ruminant (n)", "['ru:minənt]", "loài nhai lại"], ["Optimal (adj)", "", "Tối ưu"], ["Embryonic", "[,em bri'ɔnik]", "trong thời kỳ đầu của sự phát triển/ phôi thai"], ["Fetal loss", "['fi:tl] [lɔs]", "Mất thai nhi"], ["conceive", "[kən'si:v]", "Thụ thai"], ["Photoperiod (n)", "[,fou tou 'piə ri əd]", "Chu kỳ chiếu sáng"], ["Sperm", "[spə:m]", "tinh dịch"], ["Limited sex drive", "", "Hạn chế ham muốn tình dục"], ["Well-being (n)", "", "Hạnh phúc. khỏe mạnh"], ["Bedding", "['bediη]", "Chất độn chuồng"], ["Quarter", "['kwɔ: tə]", "Khu vực"], ["React", "[ri:'ækt]", "Tác động, phản ứng lại"], ["Re-strain (v)", "[ri:'strein]", "Cố định gia súc"], ["Medical evaluation or treatment", "['me di kl] [i,væ lju 'ei ∫n]\n['tri:t mənt]", "Đánh giá hoặc điều trị y khoa"], ["Interact (v)", "[,in tə 'rækt]", "Tương tác"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What should researchers and educationists do to improve agriculturally relevant animal systems? (Các nhà nghiên cứu và giáo dục nên làm gì để cải thiện các hệ thống vật nuôi liên quan đến nông nghiệp?)", "answer": "They should collaborate with industry and other interested parties to develop and disseminate knowledge and methods. – Họ cần hợp tác với ngành công nghiệp và các bên liên quan khác để phát triển và phổ biến kiến thức cũng như phương pháp."}, {"type": "question", "qType": "open", "question": "2. How many genetic traits do researchers focus on? (Các nhà nghiên cứu tập trung vào bao nhiêu tính trạng di truyền?)", "answer": "Three main groups of desirable traits: animals that are leaner; animals with increased disease resistance; and animals that excel in growth rate or in the production of eggs, meat, milk, wool, or mohair. – Ba nhóm tính trạng chính: ít mỡ (nhiều nạc) hơn; kháng bệnh tốt hơn; vượt trội về tốc độ tăng trưởng hoặc sản lượng trứng, thịt, sữa, len, mohair."}, {"type": "question", "qType": "open", "question": "3. What could be the consequences if inefficient nutrient intake by animals? (Hấp thụ dinh dưỡng kém hiệu quả ở động vật có thể gây ra hậu quả gì?)", "answer": "It is financially and environmentally costly; it hurts animal growth, health, and well-being; it may affect the safety and quality of food products; and excess nutrients may pollute the environment (odors, ground water contamination). – Tốn kém về tài chính và môi trường; hại đến tăng trưởng, sức khỏe, phúc lợi của vật nuôi; ảnh hưởng an toàn và chất lượng thực phẩm; dinh dưỡng dư thừa gây ô nhiễm (mùi hôi, ô nhiễm nước ngầm)."}, {"type": "question", "qType": "open", "question": "4. How many products can be harvested from animals? (Có thể thu được bao nhiêu loại sản phẩm từ động vật?)", "answer": "Meat and meat products, poultry products (meat and eggs), fish, shellfish, dairy products (milk and cheese), and non-food products such as fiber (wool, mohair, cashmere, and leather). – Thịt và sản phẩm từ thịt, sản phẩm gia cầm (thịt, trứng), cá, động vật có vỏ, sản phẩm sữa (sữa, phô mai) và sản phẩm phi thực phẩm như xơ sợi (len, mohair, cashmere, da)."}, {"type": "question", "qType": "open", "question": "5. What are the main factors affecting the quality of these animal products? (Những yếu tố chính nào ảnh hưởng đến chất lượng của các sản phẩm động vật này?)", "answer": "Before harvest: genetics, nutrition, and management systems. After harvest: handling, processing, storage, and marketing practices. – Trước thu hoạch: di truyền, dinh dưỡng, hệ thống quản lý. Sau thu hoạch: vận chuyển/xử lý, chế biến, bảo quản và tiếp thị."}, {"type": "question", "qType": "open", "question": "6. What could be the causative factors accounted for the inefficient reproduction? (Những nguyên nhân nào dẫn đến sinh sản kém hiệu quả?)", "answer": "Increased genetic selection for meat or milk production traits; early embryonic and fetal loss; failure to reach puberty at an optimum age; environmental stressors (temperature extremes, changes in photoperiod); production of low-potency sperm; and limited sex drive. – Tăng chọn lọc di truyền cho tính trạng thịt/sữa; sảy phôi và thai sớm; không đạt tuổi thành thục đúng lúc; yếu tố gây căng thẳng từ môi trường; tinh trùng chất lượng thấp; hạn chế ham muốn tình dục."}, {"type": "content", "title": "Practice 2: True or false statement", "content": "Chọn True (Đúng) hoặc False (Sai) – app sẽ báo ngay đúng hay sai."}, {"type": "question", "qType": "truefalse", "question": "1. Research, education and extension activities did not change to address new challenges and opportunities. (Nghiên cứu, giáo dục và khuyến nông đã không thay đổi để giải quyết thách thức và cơ hội mới.)", "answer": "false", "explain": "Sai: bài đọc nói các hoạt động này \"continually changing\"."}, {"type": "question", "qType": "truefalse", "question": "2. Researchers collaborate with industry and other interested parties to develop and disseminate knowledge and methods to improve agriculturally relevant animal systems. (Các nhà nghiên cứu hợp tác với ngành công nghiệp và các bên liên quan để phát triển và phổ biến kiến thức, phương pháp.)", "answer": "true", "explain": "Đúng: đúng nguyên văn bài đọc."}, {"type": "question", "qType": "truefalse", "question": "3. The quality and safety of animal products prior to harvest do not depend on genetics, nutrition, and management systems. (Chất lượng và an toàn sản phẩm trước thu hoạch không phụ thuộc vào di truyền, dinh dưỡng và quản lý.)", "answer": "false", "explain": "Sai: bài đọc nói chúng \"are influenced by\" các yếu tố này."}, {"type": "question", "qType": "truefalse", "question": "4. Inefficient nutrient intake by animals does not affect environment in animal operations from livestock farms to fish farms. (Hấp thụ dinh dưỡng kém hiệu quả không ảnh hưởng đến môi trường.)", "answer": "false", "explain": "Sai: bài đọc nói nó \"environmentally costly\" và gây ô nhiễm."}, {"type": "content", "title": "Practice 3: Word/phrase usage", "content": "Fill in the blank the most appropriate word or phrase – Chọn từ/cụm từ phù hợp nhất điền vào chỗ trống. Bấm vào đáp án để kiểm tra."}, {"type": "question", "qType": "choice", "question": "1. One of the most important tasks for the extensionist is to ……… knowledge to the farmers. (Một trong những nhiệm vụ quan trọng nhất của cán bộ khuyến nông là ……… kiến thức cho nông dân.)", "options": ["A. disseminate (phổ biến)", "B. talk", "C. tell", "D. get"], "answer": 0}, {"type": "question", "qType": "choice", "question": "2. Besides dogs and cats, some wild animals e.g. snakes, crocodile etc. are also considered as ……… (Ngoài chó mèo, một số động vật hoang dã như rắn, cá sấu… cũng được xem là ………)", "options": ["A. friendly", "B. pets (thú cưng)", "C. aggressive", "D. submissive"], "answer": 1}, {"type": "question", "qType": "choice", "question": "3. Animal products include meat, eggs, fish, shellfish, milk and cheese, wool, mohair, cashmere, and ……… (Sản phẩm động vật gồm thịt, trứng, cá, động vật có vỏ, sữa và phô mai, len, mohair, cashmere và ………)", "options": ["A. leather (da)", "B. livestock", "C. poultry", "D. genetic"], "answer": 0}, {"type": "question", "qType": "choice", "question": "4. The quality and safety of animal products ……… are influenced by genetics, nutrition, and management systems. (Chất lượng và an toàn sản phẩm động vật ……… chịu ảnh hưởng bởi di truyền, dinh dưỡng và hệ thống quản lý.)", "options": ["A. during the harvest", "B. after harvest", "C. prior harvest (trước thu hoạch)", "D. All are correct"], "answer": 2}, {"type": "question", "qType": "choice", "question": "5. After harvest, the quality and safety of animal products are affected by handling, processing techniques, transportation methods, ………, and marketing practices. (Sau thu hoạch, chất lượng và an toàn sản phẩm bị ảnh hưởng bởi xử lý, kỹ thuật chế biến, phương thức vận chuyển, ……… và tiếp thị.)", "options": ["A. storage (bảo quản)", "B. nutrients", "C. humidity", "D. temperature"], "answer": 0}], "rev": 2, "prev": 3}, {"id": 2, "title": "Sinh lý học vật nuôi", "sub": "Animal Physiology", "color": "#7BAEDF", "reading": [{"en": "1. Physiology: Physiology is about the functions of living organisms – how they eat, breathe, and move about, and what they do just to keep alive.", "vi": "1. Sinh lý học: Sinh lý học nghiên cứu về các chức năng của sinh vật sống – cách chúng ăn, thở, di chuyển và những gì chúng làm để duy trì sự sống."}, {"en": "To use more technical words, physiology is about food and feeding, digestion, respiration, transport of gases in the blood, circulation and function of the heart, excretion and kidney function, muscle and movements, and so on.", "vi": "Nói theo thuật ngữ chuyên môn hơn, sinh lý học nghiên cứu về thức ăn và sự ăn uống, sự tiêu hóa, sự hô hấp, sự vận chuyển khí trong máu, sự tuần hoàn và chức năng của tim, sự bài tiết và chức năng thận, cơ và sự vận động, v.v."}, {"en": "The dead animal has the structures that carry out these functions; in the living animal, the structures work.", "vi": "Con vật đã chết vẫn có các cấu trúc thực hiện những chức năng này; nhưng chỉ ở con vật còn sống, các cấu trúc đó mới hoạt động."}, {"en": "Physiology is also about how the living organism adjusts to the adversities of the environment – obtains enough water to live or avoids too much water, escapes freezing to death or dying from excessive heat, moves about to find suitable surroundings, food, and mates – and how it obtains information about the environment through its senses.", "vi": "Sinh lý học cũng nghiên cứu cách sinh vật sống thích nghi với những bất lợi của môi trường – lấy đủ nước để sống hoặc tránh bị thừa nước, tránh bị chết cóng hoặc chết vì quá nóng, di chuyển để tìm môi trường sống, thức ăn và bạn tình phù hợp – và cách nó thu nhận thông tin về môi trường thông qua các giác quan."}, {"en": "Finally, physiology is about the regulation of all these functions – how they are correlated and integrated into a smooth-functioning organism.", "vi": "Cuối cùng, sinh lý học nghiên cứu sự điều hòa tất cả các chức năng này – cách chúng liên kết và phối hợp với nhau thành một cơ thể hoạt động nhịp nhàng."}, {"en": "Physiology is not only a description of function; it also asks why and how.", "vi": "Sinh lý học không chỉ là sự mô tả chức năng; nó còn đặt câu hỏi tại sao và như thế nào."}, {"en": "To understand how an animal functions, it is necessary to be familiar both with its structure and with some elementary physics and chemistry.", "vi": "Để hiểu một con vật hoạt động như thế nào, cần phải nắm rõ cả cấu tạo của nó lẫn một số kiến thức vật lý và hóa học cơ bản."}, {"en": "For example, we cannot understand respiration unless we know about oxygen.", "vi": "Ví dụ, chúng ta không thể hiểu được sự hô hấp nếu không biết về oxy."}, {"en": "Since ancient times breathing movements have been known as a sign of life or death, but the true meaning of respiration could not be understood until chemists had discovered oxygen.", "vi": "Từ thời cổ đại, cử động thở đã được biết đến như một dấu hiệu của sự sống hay cái chết, nhưng ý nghĩa thực sự của sự hô hấp chỉ được hiểu khi các nhà hóa học phát hiện ra oxy."}, {"en": "The understanding of how living organisms function is helped enormously by using a comparative approach.", "vi": "Việc tìm hiểu cách các sinh vật sống hoạt động được hỗ trợ rất nhiều nhờ sử dụng phương pháp so sánh."}, {"en": "By comparing different animals and examining how each has solved its problem of living within the constraints of the available environment, we gain insight into general principles that otherwise might remain obscure.", "vi": "Bằng cách so sánh các loài động vật khác nhau và xem xét mỗi loài đã giải quyết vấn đề sinh tồn của mình như thế nào trong giới hạn của môi trường sẵn có, chúng ta hiểu sâu hơn về những nguyên lý chung mà nếu không làm vậy có thể vẫn còn mơ hồ."}, {"en": "No animal exists, or can exist, independently of an environment, and the animal that utilizes the resources of the environment must also be able to cope with the difficulties it presents.", "vi": "Không có loài động vật nào tồn tại, hoặc có thể tồn tại, độc lập với môi trường, và con vật khai thác các nguồn tài nguyên của môi trường thì cũng phải có khả năng đối phó với những khó khăn mà môi trường đặt ra."}, {"en": "Thus, a comparative and environmental approach provides deeper insight into physiology.", "vi": "Vì vậy, cách tiếp cận so sánh và môi trường giúp hiểu sâu hơn về sinh lý học."}, {"en": "Examining how an animal copes with its environment often tends to show what is good for the animal.", "vi": "Việc xem xét cách một con vật đối phó với môi trường thường có xu hướng cho thấy điều gì là có lợi cho con vật đó."}, {"en": "This may bring us uncomfortably close to explanations that suggest evidence of purpose, or teleology, and many biologists consider this scientifically improper.", "vi": "Điều này có thể đưa chúng ta đến gần một cách khó chịu với những cách giải thích ngụ ý có mục đích, hay còn gọi là thuyết mục đích (teleology), và nhiều nhà sinh học cho rằng điều này không phù hợp về mặt khoa học."}, {"en": "However, we all do tend to ask, Why? What good is it for the animal?", "vi": "Tuy nhiên, tất cả chúng ta đều có xu hướng hỏi: Tại sao? Điều đó có lợi gì cho con vật?"}, {"en": "Anyway, the animal has to survive, and there is nothing improper or unscientific in finding out how and why it succeeds.", "vi": "Dù sao đi nữa, con vật phải sinh tồn, và việc tìm hiểu nó thành công như thế nào và tại sao thì không có gì là sai trái hay phản khoa học."}, {"en": "If it did not arrive at solutions to the problem of survival, it would no longer be around to interest us, and that is what physiology is all about.", "vi": "Nếu nó không tìm ra giải pháp cho vấn đề sinh tồn, nó đã không còn tồn tại để chúng ta quan tâm, và đó chính là toàn bộ ý nghĩa của sinh lý học."}, {"en": "Source: Knut Schmidt-Nielsen. Animal Physiology – Adaptation and Environment. 5th Edition. Cambridge University Press.", "vi": "Nguồn: Knut Schmidt-Nielsen. Sinh lý học động vật – Sự thích nghi và Môi trường. Tái bản lần thứ 5. Nhà xuất bản Đại học Cambridge."}, {"en": "2. Overview of Organ Systems of the Animal Body", "vi": "2. Tổng quan các hệ cơ quan của cơ thể động vật"}, {"en": "Table: Organ System – Major Component Organs – Function", "vi": "Bảng: Hệ cơ quan – Các cơ quan chính – Chức năng", "table": {"head": [["Organ System", "Hệ cơ quan"], ["Major Component Organs", "Các cơ quan chính"], ["Function", "Chức năng"]], "rows": [{"sys": "Integumentary system", "viSys": "Hệ bì", "comp": "skin, nails, and hair; cutaneous sense organs and glands.", "viComp": "da, móng và lông; các cơ quan cảm giác ở da và các tuyến.", "fn": ["Protects deeper organs from injury due to bumps, chemicals, bacteria, and dehydration.", "Excretes salts and urea.", "Helps regulate body temperature."], "viFn": ["Bảo vệ các cơ quan bên trong khỏi tổn thương do va chạm, hóa chất, vi khuẩn và sự mất nước.", "Bài tiết muối và urê.", "Giúp điều hòa thân nhiệt."]}, {"sys": "Skeletal system", "viSys": "Hệ xương", "comp": "bones, cartilages, tendons, ligaments, and joints.", "viComp": "xương, sụn, gân, dây chằng và khớp.", "fn": ["Supports and protects internal organs.", "Provides levers for muscular action.", "Stores minerals (calcium and others).", "Cavities provide a site for blood cell formation."], "viFn": ["Nâng đỡ và bảo vệ các cơ quan nội tạng.", "Tạo đòn bẩy cho hoạt động của cơ.", "Dự trữ khoáng chất (canxi và các chất khác).", "Các khoang xương là nơi hình thành tế bào máu."]}, {"sys": "Muscular system", "viSys": "Hệ cơ", "comp": "muscles attached to the skeleton.", "viComp": "các cơ bám vào bộ xương.", "fn": ["Skeletal muscles contract, or shorten; in doing so, they move bones to allow motion (running, walking, etc.), grasping and manipulation of the environment, and facial expression.", "Generates heat."], "viFn": ["Cơ xương co lại, hay ngắn lại; khi đó, chúng làm xương chuyển động để tạo ra sự vận động (chạy, đi, v.v.), sự cầm nắm và thao tác với môi trường xung quanh, cũng như biểu cảm trên mặt.", "Sinh nhiệt."]}, {"sys": "Nervous system", "viSys": "Hệ thần kinh", "comp": "brain, spinal cord, nerves, and special sense organs.", "viComp": "não, tủy sống, dây thần kinh và các cơ quan cảm giác đặc biệt.", "fn": ["Allows body to detect changes in its internal and external environment and to respond by activating appropriate muscles or glands.", "Helps maintain short-term homeostasis via rapid electrical signals."], "viFn": ["Giúp cơ thể phát hiện những thay đổi trong môi trường bên trong và bên ngoài, và phản ứng lại bằng cách kích hoạt các cơ hoặc tuyến thích hợp.", "Giúp duy trì cân bằng nội môi ngắn hạn thông qua các tín hiệu điện nhanh."]}, {"sys": "Endocrine system", "viSys": "Hệ nội tiết", "comp": "pituitary, thyroid, parathyroid, adrenal, pineal glands, ovaries, testes, and pancreas.", "viComp": "tuyến yên, tuyến giáp, tuyến cận giáp, tuyến thượng thận, tuyến tùng, buồng trứng, dịch hoàn và tuyến tụy.", "fn": ["Promotes growth and development.", "Produces chemical “messengers” (hormones) that travel in the blood to exert effects on various “target organs”.", "Regulates long-term homeostasis."], "viFn": ["Thúc đẩy sự sinh trưởng và phát triển.", "Sản xuất các “chất truyền tin” hóa học (hormone) di chuyển trong máu để tác động lên các “cơ quan đích” khác nhau.", "Điều hòa cân bằng nội môi dài hạn."]}, {"sys": "Cardiovascular system", "viSys": "Hệ tim mạch", "comp": "heart, blood vessels, and blood.", "viComp": "tim, mạch máu và máu.", "fn": ["Primarily a transport system that carries blood containing oxygen, carbon dioxide, nutrients, wastes, ions, hormones, and other substances to and from cells.", "Pumping action of the heart propels blood through vessels.", "Protects body with blood clots, antibodies, and other protein molecules."], "viFn": ["Chủ yếu là một hệ thống vận chuyển, đưa máu chứa oxy, khí cacbonic, chất dinh dưỡng, chất thải, ion, hormone và các chất khác đến và đi khỏi các tế bào.", "Hoạt động bơm của tim đẩy máu đi qua các mạch máu.", "Bảo vệ cơ thể nhờ cục máu đông, kháng thể và các phân tử protein khác."]}, {"sys": "Lymphatic / Immune system", "viSys": "Hệ bạch huyết / miễn dịch", "comp": "lymphatic vessels, lymph nodes, spleen, thymus, and tonsils.", "viComp": "mạch bạch huyết, hạch bạch huyết, lá lách, tuyến ức và amidan.", "fn": ["Picks up fluid leaked from the blood vessels and returns it to the blood.", "Cleanses blood of pathogens and other debris.", "Houses cells (lymphocytes and others) that act in immune response."], "viFn": ["Thu gom dịch thoát ra từ mạch máu và đưa trở lại máu.", "Làm sạch máu khỏi mầm bệnh và các chất lạ khác.", "Là nơi chứa các tế bào (tế bào lympho và các loại khác) tham gia vào phản ứng miễn dịch."]}, {"sys": "Respiratory system", "viSys": "Hệ hô hấp", "comp": "nose, pharynx, larynx, trachea, bronchi, and lungs.", "viComp": "mũi, hầu, thanh quản, khí quản, phế quản và phổi.", "fn": ["Keeps blood continuously supplied with oxygen while removing carbon dioxide.", "Contributes to the acid-base balance of the blood via its carbonic acid/bicarbonate buffer system."], "viFn": ["Liên tục cung cấp oxy cho máu đồng thời loại bỏ khí cacbonic.", "Góp phần cân bằng axit – bazơ của máu thông qua hệ đệm axit cacbonic/bicarbonat."]}, {"sys": "Digestive system", "viSys": "Hệ tiêu hóa", "comp": "mouth, esophagus, stomach, small and large intestines, teeth, salivary glands, liver, gallbladder, and pancreas.", "viComp": "miệng, thực quản, dạ dày, ruột non và ruột già, răng, tuyến nước bọt, gan, túi mật và tuyến tụy.", "fn": ["Breaks down ingested foods to tiny particles that can be absorbed into the blood.", "Undigested residue leaves the body as feces."], "viFn": ["Phân giải thức ăn đã ăn vào thành những phần tử nhỏ có thể hấp thu vào máu.", "Phần cặn bã không tiêu hóa được thải ra khỏi cơ thể dưới dạng phân."]}, {"sys": "Urinary system", "viSys": "Hệ tiết niệu", "comp": "kidneys, ureters, urinary bladder, and urethra.", "viComp": "thận, niệu quản, bàng quang và niệu đạo.", "fn": ["Rids the body of nitrogen-containing wastes (urea, uric acid, ammonia) from protein and nucleic acid breakdown.", "Maintains water, electrolyte, and acid-base balance of blood."], "viFn": ["Loại bỏ khỏi cơ thể các chất thải chứa nitơ (urê, axit uric, amoniac) sinh ra từ quá trình phân giải protein và axit nucleic.", "Duy trì cân bằng nước, điện giải và axit – bazơ của máu."]}, {"sys": "Reproductive system", "viSys": "Hệ sinh sản", "comp": "Male: testes, scrotum, penis, and duct system; Female: ovaries, uterine tubes, uterus, and vagina.", "viComp": "Con đực: dịch hoàn, bao dịch hoàn, dương vật và hệ thống ống dẫn; Con cái: buồng trứng, vòi trứng, tử cung và âm đạo.", "fn": ["Produces germ cells (sperm or eggs) for perpetuation of the species.", "Female uterus houses a developing fetus until birth."], "viFn": ["Sản sinh tế bào sinh dục (tinh trùng hoặc trứng) để duy trì nòi giống.", "Tử cung của con cái là nơi nuôi dưỡng bào thai đang phát triển cho đến khi sinh."]}]}}], "extra": [], "vocab": [["Integument", "/ɪnˈteɡ.jə.mənt/", "Lớp áo, vỏ bọc"], ["Skeletal", "/ˈskel.ɪ.təl/", "(Thuộc về) bộ xương"], ["Muscular", "/ˈmʌs.kjə.lər/", "Cơ, bắp thịt"], ["Nervous", "/ˈnɜː.vəs/", "(Thuộc về) thần kinh"], ["Endocrine", "/ˈen.də.krɪn/", "Tuyến nội tiết, thuộc về nội tiết"], ["Cardiovascular", "/ˌkɑː.di.əʊˈvæs.kjə.lər/", "(Thuộc về) tim mạch"], ["Lymphatic", "/lɪmˈfæt.ɪk/", "(Thuộc về) bạch huyết"], ["Immune", "/ɪˈmjuːn/", "Miễn dịch"], ["Respiratory", "/rɪˈspɪr.ə.tər.i/", "(Thuộc về) hô hấp"], ["Digestive", "/daɪˈdʒes.tɪv/", "Tiêu hóa"], ["Urinary", "/ˈjʊə.rɪ.nər.i/", "(Thuộc về) nước tiểu"], ["Reproductive", "/ˌriː.prəˈdʌk.tɪv/", "Sinh sản, tái sản xuất"], ["Cutaneous sense organ and glands", "", "Cơ quan nhận cảm và tuyến trên da"], ["Cartilages", "/ˈkɑː.tɪ.lɪdʒɪz/", "Sụn"], ["Tendon", "/ˈten.dən/", "Gân"], ["Ligament", "/ˈlɪɡ.ə.mənt/", "Dây chằng, dây chằng phụ"], ["Joint", "/dʒɔɪnt/", "Khớp nối, mắt, mấu (để nối)"], ["Spinal cord", "/ˈspaɪ.nəl kɔːd/", "Tuỷ sống"], ["Nerves", "/nɜːvz/", "Dây thần kinh"], ["Special sense organs", "", "Tổ chức nhận cảm đặc biệt"], ["Pituitary", "/pɪˈtʃuː.ɪ.tər.i/", "Tuyến yên"], ["Thyroid", "/ˈθaɪ.rɔɪd/", "Tuyến giáp trạng"], ["Parathyroid", "/ˌpær.əˈθaɪ.rɔɪd/", "Tuyến cận giáp trạng"], ["Adrenal", "/əˈdriː.nəl/", "Tuyến thượng thận"], ["Pineal gland", "/ˈpɪn.i.əl ˌɡlænd/", "Tuyến tùng"], ["Ovary", "/ˈəʊ.vər.i/", "Buồng trứng"], ["Testes", "/ˈtes.tiːz/", "Dịch hoàn"], ["Pancreas", "/ˈpæŋ.kri.əs/", "Tuyến tuỵ"], ["Vessel", "/ˈves.əl/", "Mạch quản"], ["Lymph node", "/lɪmf nəʊd/", "Hạch lympho"], ["Spleen", "/spliːn/", "Lá lách"], ["Thymus", "/ˈθaɪ.məs/", "Tuyến ức"], ["Tonsil", "/ˈtɒn.səl/", "Amidan, tuyến hạnh nhân"], ["Pharynx", "/ˈfær.ɪŋks/", "Hầu, họng"], ["Larynx", "/ˈlær.ɪŋks/", "Thanh quản"], ["Trachea", "/trəˈkiː.ə/", "Khí quản, ống khí"], ["Bronchi", "/ˈbrɒŋ.kaɪ/", "Phế quản"], ["Esophagus", "/ɪˈsɒf.ə.ɡəs/", "Thực quản"], ["Small and large intestine", "", "Ruột non và ruột già"], ["Salivary gland", "/səˈlaɪ.vər.i ɡlænd/", "Tuyến nước bọt"], ["Liver", "/ˈlɪv.ər/", "Gan"], ["Gallbladder", "/ˈɡɔːlˌblæd.ər/", "Túi mật"], ["Kidney", "/ˈkɪd.ni/", "Thận"], ["Ureter", "/ˈjʊə.rɪ.tər/", "Niệu quản"], ["Urinary bladder", "/ˈjʊə.rɪ.nər.i ˈblæd.ər/", "Bàng quang"], ["Urethra", "/jʊəˈriː.θrə/", "Niệu đạo"], ["Scrotum", "/ˈskrəʊ.təm/", "Bao dịch hoàn"], ["Penis", "/ˈpiː.nɪs/", "Dương vật"], ["Duct system", "", "Hệ thống ống (sinh tinh)"], ["Sperm", "/spɜːm/", "Tinh trùng"], ["Uterine tubes", "", "Vòi trứng (vòi Fallop)"], ["Uterus", "/ˈjuː.tər.əs/", "Dạ con, tử cung"], ["Vagina", "/vəˈdʒaɪ.nə/", "Âm đạo"], ["Blood cell formation", "", "Hình thành tế bào máu"], ["Cavity", "/ˈkæv.ə.ti/", "Khoang, hốc"], ["Motion", "/ˈməʊ.ʃən/", "Vận động"], ["Grasping", "/ˈɡrɑː.spɪŋ/", "Phản xạ"], ["Manipulation", "/məˌnɪp.jəˈleɪ.ʃən/", "Thao tác"], ["Facial expression", "", "Biểu thị ngoài"], ["Generate", "/ˈdʒen.ə.reɪt/", "Sinh, sinh sản"], ["Homeostasis", "/ˌhəʊ.mi.əˈsteɪ.sɪs/", "Nội môi, tính cân bằng tự nhiên"], ["Exert", "/ɪɡˈzɜːt/", "Đưa vào sử dụng, áp dụng cái gì"], ["Clot", "/klɒt/", "Đông máu"], ["Antibodies", "/ˈæn.tiˌbɒd.iz/", "Kháng thể"], ["Fluid leaked", "", "Sự thoát dịch"], ["Pathogen", "/ˈpæθ.ə.dʒən/", "Mầm bệnh, nguồn bệnh"], ["Debris", "/ˈdeb.riː/", "Mảnh vỡ, mảnh vụn, chất lạ (vào cơ thể)"], ["Ingest", "/ɪnˈdʒest/", "Ăn vào bụng"], ["Delivery", "/dɪˈlɪv.ər.i/", "Sự phân phát"], ["Undigested", "/ˌʌn.daɪˈdʒes.tɪd/", "Không tiêu hoá, không hấp thụ"], ["Feces", "/ˈfiː.siːz/", "Phân"], ["Perpetuation", "/pəˌpetʃ.uˈeɪ.ʃən/", "Sự duy trì"], ["Fetus", "/ˈfiː.təs/", "Thai, bào thai"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What is the main function of the skin? (Chức năng chính của da là gì?)", "answer": "The skin protects deeper organs from injury (bumps, chemicals, bacteria, dehydration), excretes salts and urea, and helps regulate body temperature. – Da bảo vệ các cơ quan bên trong khỏi tổn thương, bài tiết muối và urê, giúp điều hòa thân nhiệt."}, {"type": "question", "qType": "open", "question": "2. How do animals react to the invasion of foreign substances (e.g. pathogen)? (Động vật phản ứng thế nào khi chất lạ, ví dụ mầm bệnh, xâm nhập?)", "answer": "The lymphatic/immune system responds: lymph nodes and spleen cleanse the blood of pathogens and debris; lymphocytes produce antibodies and other cells destroy the invaders (immune response); inflammation and fever may occur. – Hệ bạch huyết/miễn dịch phản ứng: làm sạch máu khỏi mầm bệnh, tế bào lympho tạo kháng thể và tiêu diệt tác nhân lạ; có thể gây viêm, sốt."}, {"type": "question", "qType": "open", "question": "3. What is the function of the skeletal system? (Chức năng của hệ xương là gì?)", "answer": "It supports and protects internal organs, provides levers for muscular action, stores minerals (calcium and others), and its cavities are a site for blood cell formation. – Nâng đỡ, bảo vệ nội tạng; tạo đòn bẩy cho cơ; dự trữ khoáng; khoang xương là nơi tạo tế bào máu."}, {"type": "question", "qType": "open", "question": "4. What is the main difference between blood in the vein and blood in the artery? (Khác biệt chính giữa máu tĩnh mạch và máu động mạch?)", "answer": "Arteries carry oxygen-rich blood away from the heart to the tissues; veins carry blood low in oxygen and rich in carbon dioxide back to the heart (except the pulmonary artery and veins). – Động mạch đưa máu giàu oxy từ tim đến mô; tĩnh mạch đưa máu nghèo oxy, giàu CO₂ về tim (ngoại trừ động/tĩnh mạch phổi)."}, {"type": "question", "qType": "open", "question": "5. How do the ingested feeds travel in the digestive system? (Thức ăn di chuyển trong hệ tiêu hóa như thế nào?)", "answer": "Mouth → esophagus → stomach → small intestine → large intestine, pushed along by muscular contractions (peristalsis); nutrients are absorbed into the blood and undigested residue leaves the body as feces. – Miệng → thực quản → dạ dày → ruột non → ruột già nhờ nhu động; chất dinh dưỡng được hấp thu, cặn bã thải ra thành phân."}, {"type": "question", "qType": "open", "question": "6. Which part of the intestine the digestion and absorption processes are mostly taken place? (Tiêu hóa và hấp thu diễn ra chủ yếu ở đoạn ruột nào?)", "answer": "In the small intestine (mainly the duodenum and jejunum). – Ở ruột non (chủ yếu tá tràng và hỗng tràng)."}, {"type": "question", "qType": "open", "question": "7. How does protease break down the protein structure? (Protease phân giải cấu trúc protein như thế nào?)", "answer": "Protease hydrolyzes (breaks with water) the peptide bonds between amino acids, splitting proteins into smaller peptides and free amino acids that can be absorbed. – Protease thủy phân liên kết peptit giữa các axit amin, cắt protein thành peptit nhỏ và axit amin tự do để hấp thu."}, {"type": "question", "qType": "open", "question": "8. What is the name of hormone secreted by the adrenal? (Tuyến thượng thận tiết ra hormone gì?)", "answer": "Adrenal medulla: adrenaline (epinephrine) and noradrenaline; adrenal cortex: cortisol (glucocorticoids) and aldosterone. – Tủy thượng thận: adrenalin, noradrenalin; vỏ thượng thận: cortisol, aldosteron."}, {"type": "question", "qType": "open", "question": "9. What are the most important factors that make the cows come into heat? (Những yếu tố quan trọng nhất làm bò động dục?)", "answer": "Reproductive hormones (FSH, LH and estrogen from the developing follicle, after progesterone falls), together with reaching puberty, good nutrition and body condition, good health and suitable environment/season. – Hormone sinh sản (FSH, LH, estrogen khi progesteron giảm), cùng với đến tuổi thành thục, dinh dưỡng và thể trạng tốt, sức khỏe và môi trường phù hợp."}, {"type": "question", "qType": "open", "question": "10. How do we detect the cow if she comes on heat? (Làm sao phát hiện bò động dục?)", "answer": "Main sign: she stands still to be mounted by other cows or a bull. Other signs: mounting other cows, restlessness, bellowing, swollen red vulva, clear mucus discharge, reduced feed intake and milk yield; aids such as tail paint or pedometers. – Dấu hiệu chính: đứng yên cho con khác nhảy lên; ngoài ra nhảy lên con khác, bồn chồn, kêu rống, âm hộ sưng đỏ, chảy dịch nhầy trong, giảm ăn và giảm sữa."}], "rev": 4, "prev": 1}, {"id": 3, "title": "Dinh dưỡng động vật", "sub": "Animal Nutrition", "color": "#D4A84B", "reading": [{"en": "1. The role of animal nutrition: Animal nutrition plays an important part in the animal production and has implications for the composition and quality of the livestock products (milk, meat and eggs) that people consume.", "vi": "1. Vai trò của dinh dưỡng động vật: Dinh dưỡng động vật đóng vai trò quan trọng trong sản xuất chăn nuôi và có liên quan đến thành phần cũng như chất lượng của các sản phẩm vật nuôi (sữa, thịt và trứng) mà con người tiêu thụ."}, {"en": "To achieve more efficient animal production, amino acids, fatty acids, minerals, vitamins, and water must be provided in amounts necessary to meet the animal’s requirements.", "vi": "Để sản xuất chăn nuôi hiệu quả hơn, axit amin, axit béo, khoáng chất, vitamin và nước phải được cung cấp với lượng cần thiết để đáp ứng nhu cầu của vật nuôi."}, {"en": "The formulation of balanced diets that provide the correct amounts and proportions of these nutrients is essential to support the requirements for maintenance, growth, and reproduction.", "vi": "Việc xây dựng khẩu phần ăn cân đối, cung cấp đúng lượng và đúng tỷ lệ các chất dinh dưỡng này, là điều thiết yếu để đáp ứng nhu cầu duy trì, sinh trưởng và sinh sản."}, {"en": "As nutrient requirements become more accurately defined through research, it is possible to formulate diets more precisely.", "vi": "Khi nhu cầu dinh dưỡng được xác định chính xác hơn nhờ nghiên cứu, ta có thể xây dựng khẩu phần ăn chính xác hơn."}, {"en": "Thus, there is a continuing need to quantify nutrients requirements accurately for various stages of an animal’s life cycle.", "vi": "Vì vậy, luôn cần tiếp tục định lượng chính xác nhu cầu dinh dưỡng cho các giai đoạn khác nhau trong vòng đời của vật nuôi."}, {"en": "2. The nutrition composition: The nutrition compositions include energy, protein and amino acids, vitamin, minerals, and water.", "vi": "2. Thành phần dinh dưỡng: Các thành phần dinh dưỡng gồm năng lượng, protein và axit amin, vitamin, khoáng chất và nước."}, {"en": "Energy plays an important part of animal nutrition.", "vi": "Năng lượng đóng vai trò quan trọng trong dinh dưỡng động vật."}, {"en": "Estimates of energy intakes of animal are expressed as kilocalories (kcal) or mega-calories (Mcal) of digestible energy (DE) or of metabolizable energy (ME) per kilogram of feed and animal per day.", "vi": "Lượng năng lượng ăn vào của vật nuôi được ước tính bằng kilocalo (kcal) hoặc megacalo (Mcal) năng lượng tiêu hóa (DE) hoặc năng lượng trao đổi (ME) trên mỗi kilôgam thức ăn và trên mỗi con mỗi ngày."}, {"en": "Digestible energy is dietary gross energy intake minus the gross energy of the excreted feces.", "vi": "Năng lượng tiêu hóa là năng lượng thô ăn vào từ khẩu phần trừ đi năng lượng thô của phân thải ra."}, {"en": "Metabolizable energy is the gross energy of the diet minus fecal, gaseous, and urinary gross energy.", "vi": "Năng lượng trao đổi là năng lượng thô của khẩu phần trừ đi năng lượng thô của phân, khí và nước tiểu."}, {"en": "Net energy (NE) is the difference between the metabolizable energy and heat increment (HI).", "vi": "Năng lượng thuần (NE) là hiệu số giữa năng lượng trao đổi và nhiệt tăng thêm (HI)."}, {"en": "The heat increment is the amount of heat released because of the energy costs of the digestive and metabolic processes.", "vi": "Nhiệt tăng thêm là lượng nhiệt được giải phóng do chi phí năng lượng của các quá trình tiêu hóa và chuyển hóa."}, {"en": "It has been demonstrated that net energy, although difficult to measure, is the best measure of the energy available to an animal for maintenance and production.", "vi": "Người ta đã chứng minh rằng năng lượng thuần, tuy khó đo, là thước đo tốt nhất về năng lượng mà vật nuôi có thể dùng cho duy trì và sản xuất."}, {"en": "Protein generally refers to crude protein, which is defined for feedstuffs as the nitrogen content x 6.25.", "vi": "Protein thường được hiểu là protein thô, được xác định đối với thức ăn gia súc bằng hàm lượng nitơ nhân với 6,25."}, {"en": "This definition is based on the assumption that the nitrogen content is 16 grams of nitrogen per 100 g of protein.", "vi": "Định nghĩa này dựa trên giả định rằng hàm lượng nitơ là 16 gam nitơ trong 100 g protein."}, {"en": "The capacity of the diets to provide sufficient indispensable (essential) amino acids and nitrogen for synthesis of dispensable (nonessential) amino acids determines the adequacy of a dietary protein level.", "vi": "Khả năng của khẩu phần cung cấp đủ axit amin thiết yếu và nitơ để tổng hợp các axit amin không thiết yếu quyết định mức protein trong khẩu phần có đủ hay không."}, {"en": "Although dispensable amino acids are needed for normal metabolism, dietary sources are not usually required.", "vi": "Mặc dù các axit amin không thiết yếu cần cho quá trình chuyển hóa bình thường, nhưng thường không cần cung cấp từ khẩu phần."}, {"en": "They can be obtained from feeds or are synthesized by using amino groups derived from amino acids present in excess of the requirement.", "vi": "Chúng có thể lấy từ thức ăn hoặc được tổng hợp nhờ các nhóm amin lấy từ những axit amin dư thừa so với nhu cầu."}, {"en": "The term vitamin describes an organic compound distinct from amino acids, carbohydrates, and lipids that is required in minute amounts for normal growth and reproduction.", "vi": "Thuật ngữ vitamin chỉ một hợp chất hữu cơ khác với axit amin, carbohydrate và lipid, cần với lượng rất nhỏ cho sinh trưởng và sinh sản bình thường."}, {"en": "Vitamins are generally classified as either fat-soluble or water-soluble.", "vi": "Vitamin thường được phân thành hai nhóm: tan trong mỡ hoặc tan trong nước."}, {"en": "The fat-soluble vitamins include vitamins A, D, E, and K.", "vi": "Các vitamin tan trong mỡ gồm vitamin A, D, E và K."}, {"en": "The water-soluble vitamins include the B vitamins (biotin, choline, folacin, niacin, pantothenic acid, riboflavin, thiamin, B6, and B12) and ascorbic acid.", "vi": "Các vitamin tan trong nước gồm các vitamin nhóm B (biotin, choline, folacin, niacin, axit pantothenic, riboflavin, thiamin, B6 và B12) và axit ascorbic."}, {"en": "Water accounts for as much as 82 percent of empty body weight (whole body weight less gastrointestinal tract contents) in the 1.5 kg neonatal pig and declines to 53 percent in the 9 kg market hog.", "vi": "Nước chiếm tới 82% khối lượng cơ thể rỗng (khối lượng toàn thân trừ đi chất chứa trong đường tiêu hóa) ở heo sơ sinh nặng 1,5 kg và giảm xuống còn 53% ở heo thịt nặng 9 kg."}, {"en": "Many variable factors, including environmental ones, govern the water requirement of animals.", "vi": "Nhiều yếu tố biến động, kể cả yếu tố môi trường, chi phối nhu cầu nước của vật nuôi."}, {"en": "Animals obtain water from three sources: (1) water that is consumed; (2) water that is a component of feedstuffs; and (3) water that originates from the breakdown of carbohydrates, fat, and protein (metabolic water).", "vi": "Vật nuôi lấy nước từ ba nguồn: (1) nước uống vào; (2) nước là thành phần của thức ăn; và (3) nước sinh ra từ sự phân giải carbohydrate, chất béo và protein (nước chuyển hóa)."}, {"en": "Water is lost from the body by four routes: (1) the lungs (respiration); (2) the skin (evaporation), (3) the intestines (defecation), and (4) the kidneys (urination).", "vi": "Nước mất khỏi cơ thể qua bốn đường: (1) phổi (hô hấp); (2) da (bay hơi); (3) ruột (đại tiện); và (4) thận (tiểu tiện)."}, {"en": "3. Animal feeding practices: Animal feeding practices have developed over time, and have generally been validated by their use.", "vi": "3. Thực hành cho ăn: Các thực hành cho ăn đã phát triển theo thời gian và nhìn chung được kiểm chứng qua thực tế sử dụng."}, {"en": "The pace of development has quickened markedly over the past 150 years - in particular, the intensification of the livestock industry in the second half of the 20th century means that a much wider variety of ingredients is used in feed than previously.", "vi": "Tốc độ phát triển đã tăng rõ rệt trong 150 năm qua – đặc biệt, sự thâm canh hóa ngành chăn nuôi vào nửa sau thế kỷ 20 khiến thức ăn ngày nay dùng nhiều loại nguyên liệu đa dạng hơn trước rất nhiều."}, {"en": "This includes ingredients that might not be thought part of an animal's natural diet, such as fishmeal.", "vi": "Trong đó có cả những nguyên liệu mà người ta có thể không nghĩ là thuộc khẩu phần tự nhiên của vật nuôi, chẳng hạn bột cá."}, {"en": "Concerns about the recycling of animal material into feed (a practice common in developed countries for many decades) have led, during the past ten to 15 years, to a number of prohibitions on what may be used in feed.", "vi": "Những lo ngại về việc tái chế vật liệu có nguồn gốc động vật thành thức ăn (một thực hành phổ biến ở các nước phát triển trong nhiều thập kỷ) đã dẫn đến, trong 10 đến 15 năm qua, một số lệnh cấm đối với những thứ được phép dùng trong thức ăn."}, {"en": "The use of mammalian meat and bone meal (MBM) was banned because it was thought to have caused or spread mad-cow disease (Bovine spongiform encephalopathy, BSE); the ban was subsequently extended to almost all forms of processed animal protein (PAP).", "vi": "Việc sử dụng bột thịt xương của động vật có vú (MBM) bị cấm vì người ta cho rằng nó gây ra hoặc làm lây lan bệnh bò điên (bệnh não xốp ở bò, BSE); sau đó lệnh cấm được mở rộng sang hầu hết các dạng protein động vật được chế biến (PAP)."}, {"en": "However, there is no positive, restricted list of what may be fed to farmed livestock.", "vi": "Tuy nhiên, không có danh sách “dương tính”, giới hạn nào quy định những gì được phép cho vật nuôi ăn."}, {"en": "This is partly because of the likely length of such a list, which could run to hundreds of items, and partly because research into animal nutrition is continually revealing new uses for potential crops.", "vi": "Một phần vì danh sách như vậy có thể rất dài, lên tới hàng trăm mục, và một phần vì nghiên cứu về dinh dưỡng động vật liên tục phát hiện những cách dùng mới cho các loại cây trồng tiềm năng."}, {"en": "Research also continues into the genetic modification of crops used for feed.", "vi": "Nghiên cứu cũng tiếp tục về việc biến đổi di truyền các loại cây trồng dùng làm thức ăn chăn nuôi."}, {"en": "Farmers' choices of what to feed their livestock will be governed by many different factors - the age and species of the animals concerned, their intended products (meat, milk, or eggs), the price and availability of feed materials, their nutritive value, and even the time of year and the geographical location (soil type and climate) of the farm.", "vi": "Lựa chọn của người chăn nuôi về thức ăn cho vật nuôi chịu chi phối bởi nhiều yếu tố – tuổi và loài vật nuôi, sản phẩm dự định (thịt, sữa hay trứng), giá cả và nguồn cung nguyên liệu, giá trị dinh dưỡng của chúng, thậm chí cả thời điểm trong năm và vị trí địa lý (loại đất và khí hậu) của trang trại."}, {"en": "The energy and nutrients that feed provide occur in different proportions in different materials, and for many animals, a typical diet will consist of a combination of feeds to provide everything they need for their health, welfare, and production.", "vi": "Năng lượng và dưỡng chất mà thức ăn cung cấp có tỷ lệ khác nhau ở các nguyên liệu khác nhau, và với nhiều loài vật nuôi, một khẩu phần điển hình sẽ gồm sự phối hợp nhiều loại thức ăn để cung cấp mọi thứ chúng cần cho sức khỏe, phúc lợi và sản xuất."}, {"en": "Ruminants (cattle, sheep, and goats) are an exception to this because grass may be the only ingredient in their diet for much of the year.", "vi": "Động vật nhai lại (trâu bò, cừu và dê) là ngoại lệ vì cỏ có thể là thành phần duy nhất trong khẩu phần của chúng trong phần lớn thời gian của năm."}], "extra": [], "vocab": [["Implication", "[,impli'kei∫n]", "Sự liên quan, (Số nhiều) Sự quan hệ mật thiết"], ["Composition", "[,kɔmpə'zi∫n]", "Thành phần"], ["Achieve", "[ə't∫i:v]", ""], ["Amino acid", "['æsid]", "Axit amin"], ["Mineral", "['minərəl]", "Khoáng chất"], ["Provide", "[prə'vaid]", "Cung cấp"], ["Necessary", "['nesisəri]", "Cấn thiết"], ["Requirement", "[ri'kwaiəmənt]", "Nhu cầu, sự đòi hỏi"], ["Formulation", "[,fɔ:mju'lei∫n]", "Sự làm thành công thức. xây dựng công thức"], ["Proportion", "[prə'pɔ:∫n]", "Tỉ lệ"], ["maintenance", "['meintinəns]", "Duy trì"], ["Accurately", "['ækjuritli]", "Đúng đắn, Chính xác"], ["Define", "[di'fain]", "Xác định, định nghĩa"], ["Precisely (adv)", "[pri'saisli]", "Rõ ràng, chính xác"], ["Quantify (v)", "['kwɔntifai]", "Xác định số lượng, định lượng"], ["Estimate", "['estimit - 'estimeit]", "Đánh giá, ước lượng"], ["Digestible energy", "[di'dʒestəbl] ['enədʒi]", "Năng lượng tiêu hoá"], ["Metabolizable energy", "[mə'tæbəlaizəbl] ['enədʒi]", "Năng lượng trao đổi/ chuyển hóa"], ["Gross energy", "[grous]", "Năng lượng thô"], ["Net energy", "", "Năng lượng thuần"], ["Excreted feces", "[eks'kri:t] ['fi:si:z]", "Phân thải ra"], ["Gaseous", "['geizjəs]", "Khí"], ["Urinary", "['juərinəri]", "Nước tiểu"], ["Heat increment", "[hi:t]\n['inkrimənt]", "Sự tăng nhiệt lượng"], ["Metabolic processes", "[,metə'bɔlik] ['prouses]", "Quá trình chuyển hóa"], ["Feedstuff", "[fi:d 'stʌf]", "Thức ăn gia súc"], ["Crude protein", "[kru:d] ['prouti:n]", "Protein thô"], ["Assumption", "[ə'sʌmp∫n]", "Sự thừa nhận, sự cho là đúng"], ["Capacity", "[kə'pæsiti]", "Khản năng, sức chứa"], ["Sufficient", "[sə'fi∫nt]", "Đủ/ có khả năng"], ["Indispensable", "[,indis'pensəbl]", "cần thiết"], ["Dispensable", "[dis'pensəbl]", "Sự không cần thiết"], ["Synthesis", "['sinθəsis]", "Tổng hợp"], ["Determine", "[di'tə:min]", "Xác định"], ["Adequacy", "['ædikwəsi]", "Sự tương xứng/ thích hợp"], ["Dietary", "['daiətəri]", "Chế độ ăn"], ["Obtain", "[əb'tein]", "Đạt được/ lấy được"], ["Excess", "[ik'ses]", "Vượt quá"], ["Compound", "['kɔmpaund]", "Hợp chất"], ["Distinct", "[dis'tiηkt]", "Đặc biệt/riêng biệt"], ["Readily", "['redili]", "Dễ dàng"], ["Constituent", "[kən'stitjuənt]", "Cấu tạo, thành phần"], ["Microorganism", "[,maikrou'ɔ:gənizm]", "Vi sinh vật"], ["Intestinal tract", "[in'testinl] [trækt]", "Đường ruột"], ["Fat soluble", "[fæt]  ['sɔljubl]", "Hoà tan trong mỡ"], ["Water soluble", "['wɔ:tə]  ['sɔljubl]", "Hoà tan trong nước"], ["Gastrointestinal tract contents", "", "Chất trong đường tiêu hóa"], ["Neonatal", "", "Mới sinh"], ["Govern", "['gʌvən]", "Chi phối/ quản lý"], ["Breakdown", "['breikdaun]", "Phân hủy"], ["Respiration", "[,respə'rei∫n]", "Sự hô hấp"], ["Evaporation", "[i,væpə'rei∫n]", "Sự làm bay hơi, bốc hơi"], ["Intestine", "[in'testin]", "Ruột"], ["Defecation", "[,defi'kei∫n]", "Đại tiện"], ["Kidney", "['kidni]", "Thận"], ["Urination", "[,juəri'nei∫n]", "Tiểu tiện"], ["Validate", "['vælideit]", "Làm cho có hiệu lực, hợp lệ"], ["Intensification", "[in,tensifi'kei∫n]", "Sự tăng lên cao/ phát triển mạnh mẽ"], ["Ingredient", "[in'gri:djənt]", "Thành phần"], ["Fishmeal", "[fi∫][mi:l]", "Bột cá"], ["Prohibitions", "[,prouhi'bi∫n]", "Sự ngăn cấm, sự cấm"], ["Mammalian", "[mæ'meiljən]", "Thuộc động vật có vú, loài thú"], ["Bone meal", "[boun] [mi:l]", "Bột xương thịt"], ["Processed animal protein (PAP)", "", "Protein động vật được chế biến"], ["Genetic modification", "[dʒi'netik] [,mɔdifi'kei∫n]", "Biến đổi di truyền"], ["Feed materials", "[fi:d] [mə'tiəriəl]", "Nguyên liệu thức ăn"], ["Nutritive value", "['nju:tritiv] ['vælju:]", "Giá trị dinh dưỡng"], ["Grass", "[grɑ:s]", "Cỏ"], ["Exception", "[ik'sep∫n]", "Ngoại lệ"], ["Welfare", "['welfeə]", "Sức khỏe tốt, hạnh phúc"]], "practice": [{"type": "content", "title": "Practice 1: Working with detail", "content": "Đọc từng câu rồi quyết định đúng (True) hay sai (False) theo bài đọc, sau đó bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "truefalse", "question": "1. To achieve more efficient animal production, we must provide in amounts necessary of nutrition to meet the animal’s requirements. (Để sản xuất chăn nuôi hiệu quả hơn, ta phải cung cấp dinh dưỡng với lượng cần thiết để đáp ứng nhu cầu của vật nuôi.)", "answer": "true", "explain": "Đúng: bài đọc nói các chất dinh dưỡng “must be provided in amounts necessary to meet the animal’s requirements”."}, {"type": "question", "qType": "truefalse", "question": "2. The net energy, although easy to measure, is the best measure of the energy available to an animal for maintenance and production. (Năng lượng thuần, tuy dễ đo, là thước đo tốt nhất…)", "answer": "false", "explain": "Sai: bài đọc nói net energy “although difficult to measure” (khó đo), không phải dễ đo."}, {"type": "question", "qType": "truefalse", "question": "3. The dispensable amino acids can’t be obtained from feeds. (Axit amin không thiết yếu không thể lấy từ thức ăn.)", "answer": "false", "explain": "Sai: bài đọc nói chúng “can be obtained from feeds or are synthesized…” (có thể lấy từ thức ăn hoặc được tổng hợp)."}, {"type": "question", "qType": "truefalse", "question": "4. Many variable factors, including environmental ones, govern the water requirement of animal. (Nhiều yếu tố biến động, kể cả môi trường, chi phối nhu cầu nước của vật nuôi.)", "answer": "true", "explain": "Đúng: câu này lấy nguyên từ bài đọc."}, {"type": "question", "qType": "truefalse", "question": "5. The use of mammalian meat and bone meal (MBM) was banned due to the veterinary hygiene. (Bột thịt xương động vật có vú bị cấm vì vệ sinh thú y.)", "answer": "false", "explain": "Sai: MBM bị cấm vì người ta cho rằng nó gây ra hoặc làm lây lan bệnh bò điên (BSE)."}, {"type": "content", "title": "Practice 2: Checking Your Understanding", "content": "Đọc kỹ từng câu hỏi và trả lời, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What are nutrition compositions in the livestock feedstuffs? (Các thành phần dinh dưỡng trong thức ăn chăn nuôi là gì?)", "answer": "They include energy, protein and amino acids, vitamins, minerals, and water. – Gồm năng lượng, protein và axit amin, vitamin, khoáng chất và nước."}, {"type": "question", "qType": "open", "question": "2. How can we define crude protein? (Protein thô được định nghĩa như thế nào?)", "answer": "Crude protein is defined for feedstuffs as the nitrogen content x 6.25, based on the assumption that protein contains 16 g of nitrogen per 100 g. – Protein thô được xác định bằng hàm lượng nitơ x 6,25, dựa trên giả định protein chứa 16 g nitơ trong 100 g."}, {"type": "question", "qType": "open", "question": "3. Why some vitamins are not required in diets? (Vì sao một số vitamin không cần có trong khẩu phần?)", "answer": "Vitamins are needed only in minute amounts, and some can be synthesized by the animal itself or by gut microorganisms, so they need not be supplied by the diet (câu trả lời suy luận, bài đọc không nêu trực tiếp). – Vitamin chỉ cần với lượng rất nhỏ, và một số có thể do chính vật nuôi hoặc vi sinh vật đường ruột tổng hợp nên không cần bổ sung qua khẩu phần."}, {"type": "question", "qType": "open", "question": "4. How much is water amount in empty body weight in the 1.5 kg neonatal piglet? (Nước chiếm bao nhiêu trong khối lượng cơ thể rỗng của heo con sơ sinh 1,5 kg?)", "answer": "Water accounts for as much as 82 percent of empty body weight. – Nước chiếm tới 82% khối lượng cơ thể rỗng."}, {"type": "question", "qType": "open", "question": "5. Why a typical diet of the ruminants will not consist of a combination of feeds? (Vì sao khẩu phần điển hình của động vật nhai lại không gồm nhiều loại thức ăn phối hợp?)", "answer": "Because grass may be the only ingredient in their diet for much of the year. – Vì cỏ có thể là thành phần duy nhất trong khẩu phần của chúng trong phần lớn thời gian của năm."}, {"type": "content", "title": "Practice 3: Building Vocabulary", "content": "Chọn từ/cụm từ tốt nhất để hoàn thành câu rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "choice", "question": "1. Amino acids, fatty acids, minerals, vitamins, and water are the substances in the feedstuffs. These ……… are necessary for animal growth. (Axit amin, axit béo, khoáng chất, vitamin và nước là các chất trong thức ăn. Các ……… này cần cho sự sinh trưởng của vật nuôi.)", "options": ["A. nutrition", "B. compositions", "C. growth", "D. livestock"], "answer": 1}, {"type": "question", "qType": "choice", "question": "2. The term vitamin describes an organic compound distinct from amino acids, carbohydrate, and lipids that is required in minute amounts for normal ……… and reproduction. (Vitamin là hợp chất hữu cơ cần với lượng nhỏ cho ……… và sinh sản bình thường.)", "options": ["A. energy", "B. minerals", "C. combination", "D. growth"], "answer": 3}, {"type": "question", "qType": "choice", "question": "3. Ruminants include animals such as cattle, sheep and ……… (Động vật nhai lại gồm trâu bò, cừu và ………)", "options": ["A. pig", "B. dog", "C. cow", "D. chicken"], "answer": 2}, {"type": "question", "qType": "choice", "question": "4. Estimates of energy intakes of animal are expressed as kilocalories (kcal) or mega-calories (Mcal) of digestible energy (DE) or of ……… energy per kilogram of feed and animal per day. (Lượng năng lượng ăn vào được tính bằng kcal hoặc Mcal năng lượng tiêu hóa (DE) hoặc năng lượng ……… (ME).)", "options": ["A. metabolizable", "B. crude", "C. net", "D. gross"], "answer": 0}, {"type": "question", "qType": "choice", "question": "5. For many animals, a typical diet will consist of a combination of feeds to provide everything they need for their health, welfare and production. However, there is an exception to ……… because grass may be the only ingredient in their diet for much of the year. (Với nhiều loài, khẩu phần gồm nhiều loại thức ăn. Tuy nhiên, có ngoại lệ với ……… vì cỏ có thể là thành phần duy nhất.)", "options": ["A. mammalian", "B. ruminants", "C. livestocks", "D. poultry"], "answer": 1}, {"type": "content", "title": "Practice 4: Finding the Main Ideas", "content": "Chọn ý chính của từng đoạn (đoạn 1 = vai trò dinh dưỡng; 2 = năng lượng; 3 = protein/axit amin; 4 = nước; 5 = thực hành cho ăn). Đáp án do mình suy từ bài đọc, bạn đối chiếu lại giúp."}, {"type": "question", "qType": "choice", "question": "The main idea of paragraph 1:", "options": ["A. The importance of animal nutrition", "B. The need of formulation of balanced diets", "C. The role of feed to the animal health"], "answer": 0}, {"type": "question", "qType": "choice", "question": "The main idea of paragraph 2:", "options": ["A. Clarification of the energy role to the animal growth", "B. Classification of the energy of animal feeds", "C. How to measure the net energy in animal feeds"], "answer": 1}, {"type": "question", "qType": "choice", "question": "The main idea of paragraph 3:", "options": ["A. The definition of protein and classification of amino acids", "B. The protein digestion in digestive tract", "C. The synthesis of protein in the animal organs"], "answer": 0}, {"type": "question", "qType": "choice", "question": "The main idea of paragraph 4:", "options": ["A. Drinking water for livestock", "B. Water in animal husbandry", "C. The animal farms should establish the water system for their animals"], "answer": 1}, {"type": "question", "qType": "choice", "question": "The main idea of paragraph 5:", "options": ["A. The use of materials in animal feed production.", "B. The risk of using processed animal products as animal feeds", "C. The grass production for cows."], "answer": 0}], "rev": 1, "prev": 1}, {"id": 4, "title": "Sinh sản động vật", "sub": "Animal Reproduction", "color": "#D48A9A", "reading": [{"en": "1. Asexual Reproduction: Asexual reproduction involves one parent.", "vi": "1. Sinh sản vô tính: Sinh sản vô tính chỉ liên quan đến một cá thể bố mẹ."}, {"en": "As a result, the offspring tend to have the same genotype and phenotype; they lack variation.", "vi": "Do đó, con cái có xu hướng có cùng kiểu gen và kiểu hình; chúng thiếu sự biến dị."}, {"en": "It is advantageous in a constant environment because a large number of offspring can be produced in a short time.", "vi": "Hình thức này có lợi trong môi trường ổn định vì có thể tạo ra số lượng lớn con cái trong thời gian ngắn."}, {"en": "Examples: Flatworms can divide into 2 halves; each half grows into a separate organism.", "vi": "Ví dụ: Giun dẹp có thể phân đôi thành 2 nửa; mỗi nửa phát triển thành một cơ thể riêng."}, {"en": "Cnidarians undergo budding where a new individual grows from and then breaks off the parent individual.", "vi": "Ruột khoang sinh sản bằng cách nảy chồi: một cá thể mới mọc ra từ cá thể mẹ rồi tách ra."}, {"en": "Echinoderms can be cut to form new individuals.", "vi": "Da gai có thể bị cắt ra để tạo thành các cá thể mới."}, {"en": "Insects - parthenogenesis (unfertilized egg develops).", "vi": "Côn trùng – sinh sản đơn tính (trứng chưa thụ tinh vẫn phát triển thành cá thể mới)."}, {"en": "Sexual Reproduction", "vi": "Sinh sản hữu tính"}, {"en": "Sexual reproduction involves the fusion of two gametes.", "vi": "Sinh sản hữu tính là sự kết hợp của hai giao tử."}, {"en": "Sperm and eggs are sometimes produced by the same individual and sometimes produced by different individuals.", "vi": "Tinh trùng và trứng đôi khi do cùng một cá thể tạo ra, đôi khi do các cá thể khác nhau tạo ra."}, {"en": "The sexes of vertebrates are separate but some vertebrates can change sex.", "vi": "Động vật có xương sống thường phân tính (đực, cái riêng biệt) nhưng một số loài có thể đổi giới tính."}, {"en": "Variation", "vi": "Sự biến dị"}, {"en": "Sexual reproduction promotes variation because offspring inherit genes from two different parents.", "vi": "Sinh sản hữu tính thúc đẩy sự biến dị vì con cái thừa hưởng gen từ hai bố mẹ khác nhau."}, {"en": "In addition, when an individual produces gametes, crossing-over and independent assortment mix genes from that individual’s parents.", "vi": "Ngoài ra, khi một cá thể tạo giao tử, hiện tượng trao đổi chéo và phân li độc lập sẽ trộn lẫn các gen của bố mẹ cá thể đó."}, {"en": "Gametes are haploid; they contain some genes from the individual’s mother and some from the father.", "vi": "Giao tử là đơn bội; chúng chứa một số gen từ mẹ và một số gen từ bố của cá thể đó."}, {"en": "Variation is advantageous to species in fluctuating environments.", "vi": "Sự biến dị có lợi cho loài trong môi trường biến động."}, {"en": "2. Reproductive cycles: Reproductive cycles in many vertebrates and invertebrates are related to changes in day length.", "vi": "2. Chu kỳ sinh sản: Chu kỳ sinh sản ở nhiều loài động vật có xương sống và không xương sống liên quan đến sự thay đổi độ dài ngày."}, {"en": "Day length is a reliable indicator of season for timing circannual events such as reproductive behavior and migration.", "vi": "Độ dài ngày là chỉ báo đáng tin cậy về mùa để định thời điểm các sự kiện theo chu kỳ năm như hành vi sinh sản và di cư."}, {"en": "In many species, the pineal gland secretes melatonin in the dark.", "vi": "Ở nhiều loài, tuyến tùng tiết melatonin trong bóng tối."}, {"en": "Increasing day length (decreased melatonin levels) triggers reproductive behavior.", "vi": "Ngày dài ra (mức melatonin giảm) sẽ kích hoạt hành vi sinh sản."}, {"en": "Fertilization", "vi": "Sự thụ tinh"}, {"en": "External fertilization", "vi": "Thụ tinh ngoài"}, {"en": "During external fertilization, many gametes are released into the water by each sex at the same time and place.", "vi": "Trong thụ tinh ngoài, mỗi giới phóng nhiều giao tử vào nước cùng một lúc và cùng một nơi."}, {"en": "This type of fertilization requires water because animal sperm must swim to the eggs.", "vi": "Kiểu thụ tinh này cần có nước vì tinh trùng phải bơi đến trứng."}, {"en": "Water also protects the gametes from drying out.", "vi": "Nước cũng bảo vệ giao tử khỏi bị khô."}, {"en": "Species which have external fertilization are either aquatic or return to water for reproduction.", "vi": "Các loài thụ tinh ngoài hoặc sống dưới nước, hoặc quay trở lại nước để sinh sản."}, {"en": "Internal fertilization", "vi": "Thụ tinh trong"}, {"en": "Internal fertilization is practiced by species that lay shelled eggs or have a period of internal embryonic development.", "vi": "Thụ tinh trong có ở những loài đẻ trứng có vỏ hoặc có giai đoạn phát triển phôi bên trong cơ thể."}, {"en": "This type of fertilization enables animals to reproduce in a terrestrial environment because it enables sperm to swim to the egg and it prevents gametes from drying out.", "vi": "Kiểu thụ tinh này giúp động vật sinh sản trên cạn vì tinh trùng vẫn bơi được đến trứng và giao tử không bị khô."}, {"en": "The male often has a copulatory organ (a penis) for transferring sperm.", "vi": "Con đực thường có cơ quan giao phối (dương vật) để chuyển tinh trùng."}, {"en": "Males of some aquatic animals (ex: sharks, skates, rays) have specialized pelvic fins which allow the sperm to be passed to the female.", "vi": "Con đực của một số loài thủy sinh (ví dụ: cá mập, cá đuối) có vây bụng chuyên biệt giúp chuyển tinh trùng sang con cái."}, {"en": "Penis", "vi": "Dương vật"}, {"en": "The penis evolved independently in insects.", "vi": "Dương vật tiến hóa một cách độc lập ở côn trùng."}, {"en": "It is found in all mammals.", "vi": "Nó có ở tất cả các loài động vật có vú."}, {"en": "Some reptiles and birds have a penis but most have a single opening for the reproductive, excretory, and digestive systems called a cloaca.", "vi": "Một số loài bò sát và chim có dương vật, nhưng phần lớn chỉ có một lỗ chung cho hệ sinh sản, bài tiết và tiêu hóa gọi là lỗ huyệt."}, {"en": "3. Male Reproductive System", "vi": "3. Hệ sinh dục đực"}, {"en": "Male Reproductive Structures", "vi": "Cấu trúc sinh dục đực"}, {"en": "Sperm are produced in the seminiferous tubules of the testes but mature in the epididymis.", "vi": "Tinh trùng được tạo ra trong các ống sinh tinh của tinh hoàn nhưng trưởng thành trong mào tinh."}, {"en": "They are stored in the epididymides and vas deferens.", "vi": "Chúng được dự trữ trong mào tinh và ống dẫn tinh."}, {"en": "The penis contains 3 masses of spongy erectile tissue with distensible blood spaces that produce erection when blood flow in the veins is inhibited.", "vi": "Dương vật có 3 khối mô cương xốp với các khoang máu giãn được, tạo ra sự cương cứng khi dòng máu trong tĩnh mạch bị cản lại."}, {"en": "The spongy erectile tissues become engorged with blood.", "vi": "Các mô cương xốp trở nên căng đầy máu."}, {"en": "Stimulation is provided by the parasympathetic nervous system.", "vi": "Sự kích thích do hệ thần kinh đối giao cảm đảm nhiệm."}, {"en": "An orgasm occurs as rhythmic muscular contractions compress the urethra and expel the semen.", "vi": "Khoái cảm cực độ xảy ra khi các cơn co cơ nhịp nhàng ép niệu đạo và đẩy tinh dịch ra ngoài."}, {"en": "This expulsion is termed ejaculation.", "vi": "Sự đẩy ra này gọi là xuất tinh."}, {"en": "Fluids Added to Form Semen", "vi": "Các dịch được thêm vào để tạo thành tinh dịch"}, {"en": "The prostate gland produces a secretion that buffers the vaginal pH, which is normally 3.5 to 4.", "vi": "Tuyến tiền liệt tiết ra dịch có tác dụng đệm pH âm đạo, vốn thường ở mức 3,5 đến 4."}, {"en": "The seminal vesicles add fructose to nourish the sperm and prostaglandins to promote contractions in the female.", "vi": "Túi tinh bổ sung fructose để nuôi tinh trùng và prostaglandin để thúc đẩy các cơn co ở con cái."}, {"en": "The bulbourethral gland (Cowper’s gland) produces mucus which lubricates the penis.", "vi": "Tuyến hành niệu đạo (tuyến Cowper) tiết chất nhầy để bôi trơn dương vật."}, {"en": "Testes", "vi": "Tinh hoàn"}, {"en": "The testes are kept slightly cooler than body temperature because they are suspended outside the body within the scrotum.", "vi": "Tinh hoàn được giữ ở nhiệt độ thấp hơn thân nhiệt một chút vì chúng treo bên ngoài cơ thể trong bìu."}, {"en": "Each testis contains 250 to 300 lobules, and each of these contains one to three tightly coiled seminiferous tubules.", "vi": "Mỗi tinh hoàn có 250 đến 300 tiểu thùy, và mỗi tiểu thùy chứa từ một đến ba ống sinh tinh cuộn chặt."}, {"en": "Sperm are produced within the seminiferous tubules.", "vi": "Tinh trùng được tạo ra bên trong các ống sinh tinh."}, {"en": "The Leydig cells, located between the tubules, function to secrete testosterone.", "vi": "Các tế bào Leydig, nằm giữa các ống, có chức năng tiết testosterone."}, {"en": "Sertoli cells are located within the tubules.", "vi": "Tế bào Sertoli nằm bên trong các ống."}, {"en": "They support, nourish and regulate (stimulate) cells that form sperm.", "vi": "Chúng nâng đỡ, nuôi dưỡng và điều hòa (kích thích) các tế bào tạo tinh trùng."}, {"en": "Testosterone", "vi": "Testosterone"}, {"en": "Testosterone is secreted by Leydig cells in the testes. These cells are located outside the seminiferous tubules.", "vi": "Testosterone do các tế bào Leydig trong tinh hoàn tiết ra. Các tế bào này nằm bên ngoài các ống sinh tinh."}, {"en": "Testosterone is also necessary for the development and function of the male reproductive tract.", "vi": "Testosterone cũng cần thiết cho sự phát triển và chức năng của đường sinh dục đực."}, {"en": "The formation of sperm (called spermatogenesis) is stimulated by testosterone.", "vi": "Sự hình thành tinh trùng (gọi là sinh tinh) được testosterone kích thích."}, {"en": "It promotes the development and maintenance of sexual behavior.", "vi": "Nó thúc đẩy sự phát triển và duy trì hành vi tính dục."}, {"en": "It stimulates the development of secondary sexual characteristics such as beard growth, deepening of the voice, etc. and has growth-promoting effects.", "vi": "Nó kích thích sự phát triển các đặc điểm sinh dục phụ như mọc râu, giọng trầm đi, v.v. và có tác dụng thúc đẩy sinh trưởng."}, {"en": "Sperm", "vi": "Tinh trùng"}, {"en": "The head of a sperm contains the nucleus and acrosome. The acrosome contains enzymes that play a role in breaking down the barrier surrounding the egg.", "vi": "Đầu tinh trùng chứa nhân và thể đỉnh. Thể đỉnh chứa các enzyme có vai trò phá vỡ lớp r
