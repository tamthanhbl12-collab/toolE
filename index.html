body{font-family:Inter,system-ui;background:#0F0F0F;color:#E5E7EB}

.numbered-title{font-weight:800;color:#8CB580 !important;font-size:17px;line-height:1.4}
.numbered-card{border-left:4px solid #FACC15 !important;background:linear-gradient(90deg, rgba(250,204,21,0.06) 0%, #1E1E1E 18%) !important}
.tab-active{background:#8CB580;color:#000 !important;font-weight:600}
.word{transition:all 0.15s ease; border-radius:4px; padding:1px 2px;}
.word.active{background:#FACC15;color:#000 !important;font-weight:700;box-shadow:0 0 8px rgba(250,204,21,0.6);}
.word.read{color:#8CB580 !important;opacity:0.8;}
.eng.highlight-mode .word{opacity:0.6;}
.numbered-title .word.active{background:#8CB580;color:#000 !important;}
.vie.highlight-mode .word{opacity:0.75;}
.vie .word.active{background:#FACC15;color:#000 !important;font-style:normal;opacity:1;}
.vie .word.read{color:#FACC15 !important;opacity:0.85;}
.word.active{opacity:1 !important;}
.row-new{animation:rowNew 2s ease}
.qopt-ok{border-color:#8CB580 !important;background:rgba(140,181,128,.15) !important}
.qopt-bad{border-color:#F87171 !important;background:rgba(248,113,113,.12) !important}
.qfb{margin-top:10px;font-size:13px;font-weight:600}
.hintBtn{margin-top:10px;padding:6px 14px;border-radius:999px;background:#2A2A2A;font-size:12px}
.sys-card .eng{font-weight:700;color:#8CB580 !important}
.sys-card .vie{font-weight:600;font-style:normal;color:#C9D6C3}
#quizOpts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:760px;margin-top:16px}
@media (max-width:640px){#quizOpts{grid-template-columns:repeat(2,1fr)}}
.spkBtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:8px;border-radius:9999px;background:#2A2A2A;vertical-align:middle}
.spkBtn:hover{background:#333}
.sub-card{margin-left:28px}
@media (max-width:640px){.sub-card{margin-left:14px}}

#selPop .sp-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;background:#2A2A2A;font-size:13px;margin-top:6px}
#selPop .sp-btn:hover{background:#333}
#selPop .sp-btn.pri{background:#8CB580;color:#000;font-weight:700}
#selPop input{width:100%;background:#0F0F0F;border:1px solid #2A2A2A;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px;outline:none;color:#E5E7EB}
#selPop input:focus{border-color:#8CB580}
::highlight(pair-mean){background-color:#FACC15;color:#000}
mark.pair-mean{background:#FACC15;color:#000;border-radius:3px;padding:0 1px}
#selPop .sp-mean{font-size:12px;color:#E5E7EB;background:#0F0F0F;border:1px solid #2A2A2A;border-radius:10px;padding:6px 9px;margin-bottom:4px;line-height:1.5}
#selPop .sp-mean b{color:#8CB580}
#selPop .sp-note{font-size:11px;color:#9CA3AF;margin-top:6px}
@keyframes rowNew{0%{background:rgba(140,181,128,.45)}100%{background:transparent}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

<script>
const lessons = [{"id": 1, "title": "Tổng quan về khoa học vật nuôi", "sub": "Overview of Animal Sciences", "color": "#8CB580", "reading": [{"en": "Animal agriculture is a significant portion of agriculture production.", "vi": "Ngành chăn nuôi động vật chiếm một phần quan trọng trong sản lượng nông nghiệp."}, {"en": "Related research, education, and extension activities are continually changing to address new challenges and opportunities brought about by rapidly advancing technologies, evolving consumer demand, and the need to make positive contributions to environmental, human, and animal health.", "vi": "Các hoạt động nghiên cứu, giáo dục và khuyến nông liên quan liên tục thay đổi để giải quyết những thách thức và cơ hội mới do công nghệ tiến bộ nhanh chóng, nhu cầu của người tiêu dùng thay đổi và nhu cầu đóng góp tích cực cho sức khỏe môi trường, con người và động vật mang lại."}, {"en": "Efficient, science-based animal agriculture translates into affordable and high-quality food for the consumer.", "vi": "Ngành chăn nuôi hiệu quả dựa trên cơ sở khoa học mang lại nguồn thực phẩm chất lượng cao và giá cả phải chăng cho người tiêu dùng."}, {"en": "Researchers collaborate with industry and other interested parties to develop and disseminate knowledge and methods to improve agriculturally relevant animal systems.", "vi": "Các nhà nghiên cứu hợp tác với ngành công nghiệp và các bên liên quan khác để phát triển và phổ biến kiến thức cũng như phương pháp nhằm cải thiện các hệ thống vật nuôi liên quan đến nông nghiệp."}, {"en": "1. Animal Breeding, Genetics & Genomics: Animal protein is essential in meeting escalating nutritional needs around the world.", "vi": "1. Nhân giống, Di truyền & Bộ gen Động vật: Protein động vật là thiết yếu để đáp ứng nhu cầu dinh dưỡng ngày càng tăng trên toàn thế giới."}, {"en": "Animal Breeding, Genetics & Genomics research focuses on desirable genetic animal traits that have revolutionized poultry, livestock, and fish production.", "vi": "Nghiên cứu về Nhân giống, Di truyền & Bộ gen động vật tập trung vào các tính trạng di truyền mong muốn ở động vật, vốn đã cách mạng hóa ngành sản xuất gia cầm, gia súc và cá."}, {"en": "These genetic traits include animals that are leaner; have increased disease resistance; or excel in growth rate or the production of eggs, meat, milk, wool, or mohair.", "vi": "Các tính trạng di truyền này bao gồm động vật ít mỡ (nhiều nạc) hơn; có khả năng kháng bệnh tăng lên; hoặc vượt trội về tốc độ tăng trưởng hoặc sản lượng trứng, thịt, sữa, len hoặc vải nỉ (mohair)."}, {"en": "The natural efficiency of an animal to use nutrients in its feed could affect the nutrients in the manure and thus affect the environment.", "vi": "Hiệu quả tự nhiên của động vật trong việc sử dụng chất dinh dưỡng trong thức ăn có thể ảnh hưởng đến chất dinh dưỡng trong phân và do đó ảnh hưởng đến môi trường."}, {"en": "2. Animal Nutrition and Growth: Inefficient nutrient intake by animals is financially and environmentally costly in animal operations from livestock farms to fish farms.", "vi": "2. Dinh dưỡng và Tăng trưởng Động vật: Sự hấp thụ chất dinh dưỡng không hiệu quả ở động vật gây tốn kém về mặt tài chính và môi trường trong các hoạt động chăn nuôi từ trang trại gia súc đến trang trại nuôi cá."}, {"en": "It not only hurts animal growth, health, and well-being, but it may also affect the safety and quality of the food products.", "vi": "Nó không chỉ làm tổn hại đến sự tăng trưởng, sức khỏe và sự thoải mái của động vật mà còn có thể ảnh hưởng đến sự an toàn và chất lượng của các sản phẩm thực phẩm."}, {"en": "It may result in excess nutrients polluting the environment in the form of odors or ground water contamination.", "vi": "Nó có thể dẫn đến việc dư thừa chất dinh dưỡng gây ô nhiễm môi trường dưới dạng mùi hôi hoặc ô nhiễm nguồn nước ngầm."}, {"en": "The primary objective of the Animal Growth and Nutrition Program is to discover the nutritional, biological, and genetic factors underlying normal animal growth, nutrient digestion and efficiency, metabolism, lactation, and muscle and bone development.", "vi": "Mục tiêu chính của Chương trình Dinh dưỡng và Tăng trưởng Động vật là phát hiện ra các yếu tố dinh dưỡng, sinh học và di truyền làm cơ sở cho sự tăng trưởng bình thường của động vật, sự tiêu hóa và hiệu quả dinh dưỡng, sự trao đổi chất, sự tiết sữa, cũng như sự phát triển của cơ và xương."}, {"en": "3. Animal Products: Americans buy approximately $100 billion of animal products at the farm gate, and several times that amount at retail each year.", "vi": "3. Các sản phẩm từ Động vật: Người Mỹ mua khoảng 100 tỷ đô la các sản phẩm từ động vật tại trang trại và gấp nhiều lần số đó tại các cửa hàng bán lẻ mỗi năm."}, {"en": "These products include meat and meat products, poultry products (meat and eggs), fish, shellfish, dairy products (milk and cheese), and non-food products such as fiber (wool, mohair, cashmere, and leather).", "vi": "Các sản phẩm này bao gồm thịt và các sản phẩm từ thịt, sản phẩm gia cầm (thịt và trứng), cá, động vật có vỏ (sò, hến,...), sản phẩm từ sữa (sữa và phô mai), và các sản phẩm phi thực phẩm như xơ sợi (len, vải nỉ mohair, len cashmere và da)."}, {"en": "The quality and safety of animal products prior to harvest are influenced by genetics, nutrition, and management systems.", "vi": "Chất lượng và độ an toàn của các sản phẩm động vật trước khi thu hoạch chịu ảnh hưởng bởi di truyền, dinh dưỡng và hệ thống quản lý."}, {"en": "After harvest they are affected by handling, processing, storage, and marketing practices.", "vi": "Sau khi thu hoạch, chúng bị ảnh hưởng bởi các phương thức vận chuyển/xử lý, chế biến, bảo quản và tiếp thị."}, {"en": "4. Animal Reproduction: Reproductive efficiency is the major factor affecting profitability in many livestock production systems.", "vi": "4. Sinh sản ở Động vật: Hiệu quả sinh sản là yếu tố chính ảnh hưởng đến lợi nhuận trong nhiều hệ thống sản xuất chăn nuôi."}, {"en": "For example, the fertility of domestic ruminants (cattle and sheep), even under optimal conditions, is only about 50 percent.", "vi": "Ví dụ, khả năng sinh sản của động vật nhai lại (trâu bò và cừu), ngay cả trong điều kiện tối ưu, chỉ khoảng 50%."}, {"en": "Inefficient reproduction may be caused by numerous factors, including increased genetic selection for meat or milk production traits, early embryonic and fetal loss, failure to reach puberty at an optimum age, environmental stressors, production of low-potency sperm, and limited sex drive.", "vi": "Sinh sản kém hiệu quả có thể do nhiều yếu tố gây ra, bao gồm việc tăng cường chọn lọc di truyền cho các tính trạng sản xuất thịt hoặc sữa, sảy phôi và thai sớm, không đạt tuổi thành thục sinh sản ở độ tuổi tối ưu, các yếu tố gây căng thẳng từ môi trường, sản xuất tinh trùng chất lượng thấp và hạn chế ham muốn tình dục."}, {"en": "5. Animal Well-being: Evaluating farm animal well-being is a challenge to the animal food industry and scientific communities.", "vi": "5. Phúc lợi Động vật: Đánh giá phúc lợi của vật nuôi trang trại là một thách thức đối với ngành công nghiệp thực phẩm động vật và các cộng đồng khoa học."}, {"en": "Scientists study how to accurately measure an animal’s state of comfort and well-being in different environmental conditions.", "vi": "Các nhà khoa học nghiên cứu cách đo lường chính xác trạng thái thoải mái và khỏe mạnh của động vật trong các điều kiện môi trường khác nhau."}, {"en": "They also work to understand how animals react both behaviorally and biologically in stressful situations, such as in transport, or when animals must be restrained during medical treatment.", "vi": "Họ cũng nghiên cứu để hiểu cách động vật phản ứng cả về hành vi và sinh học trong các tình huống căng thẳng, chẳng hạn như khi vận chuyển hoặc khi động vật phải bị cố định trong quá trình đánh giá hoặc điều trị y tế."}, {"en": "These understandings are important to those who work with animals as pets, livestock, or wildlife to ensure the safety and well-being of both animals and humans as they interact.", "vi": "Những hiểu biết này rất quan trọng đối với những người làm việc với động vật với tư cách là thú cưng, gia súc hoặc động vật hoang dã để đảm bảo sự an toàn và phúc lợi của cả động vật và con người khi họ tương tác."}], "extra": [], "vocab": [["Agriculture (n)", "['æ   gri   kʌl   t∫ə]", "Nông nghiệp"], ["Significant (adj)", "[sig  'ni  fi  kənt]", "Quan trọng"], ["Portion (n)", "['pɔ:∫n]", "Phần"], ["Production (n)", "", "Sự sản xuất"], ["Address (v)", "[ə'dres]", "Giải quyết"], ["Challenges (n)", "['t∫ælindʒ]", "Thách thứC. thử thách"], ["Rapidly advancing technology", "['ræ pid li] [əd'vɑ:n sin] [tek'nɔlədʒi]", "Công nghệ tiến bộ nhanh chóng"], ["Evolve", "[i'vɔl - vin]", "Đang tiến triển"], ["Efficient", "[i'fi∫ənt]", "Hiệu quả"], ["Affordable", "[ə'fɔ:də bl]", "Phải chăng"], ["Consumer", "[kən'sju:mə]", "Người tiêu thụ/ tiêu dùng"], ["Disseminate (n)", "[di'se mi neit]", "Phổ biến, truyền bá"], ["Knowledge (n)", "['nɔ lidʒ]", "Sự hiểu biết, kiến thức"], ["Relevant", "['reləvənt]", "Liên quan"], ["Breeding", "['bri:diη]", "Sự sinh sản, Gây giống"], ["Genetics", "[dʒi'netiks]", "Di truyền"], ["Genomics", "[dʒi'noumik]", "Gen"], ["Escalating", "['es kə lei tin]", "Leo thang"], ["Nutritional", "[nju:'tri∫nl]", "(thuộc) Dinh dưỡng"], ["Desirable", "[di'zaiərəbl]", "Ao ướC. mong dợi"], ["Trait", "[treit]", "Nét, điểm"], ["Revolutionize", "[,revə'lu:∫ənaiz]", "Cách mạng hóa"], ["Poultry", "['poul tri]", "Gia cầm"], ["Livestock", "['laiv stɔk]", "Vật nuôi, thú nuôi"], ["Leaner", "[‘li:nə]", "ốm hơn"], ["Excel", "[ik'sel]", "Trội"], ["Wool", "[wul]", "Len"], ["Mohair", "['mou heə]", "Vải nỉ"], ["Manure", "[mə'njuə]", "Phân bón"], ["Growth", "[grouθ]", "Sư tăng trưởng, phát triển"], ["Intake (n)", "['inteik]", "Sự hấp thu"], ["Odor", "['oudə]", "Mùi/ dấu vết"], ["contamination", "[kən ,tæmi 'nei ∫n]", "sự làm bẩn, sự làm ô uế"], ["Digestion", "[di'dʒest∫n]", "Sự tiêu hóa"], ["metabolism", "[mə'tæbəlizm]", "sự trao đổi chất; sự chuyển hoá"], ["Lactation (n)", "[læk'tei∫n]", "Sự sinh sữA. thải sữa"], ["Puberty (n)", "['pju:bəti]", "Tuổi thành thục về tính"], ["Shellfish (n)", "['∫el fi∫]", "Sò, hến, động vật có vỏ"], ["Cashmere", "[kæ∫'miə]", "khăn san (bằng len) casơmia"], ["Leather (n)", "['leðə]", "Da/ Bằng da"], ["Fertility (n)", "[fə:'tiliti]", "Khả năng sinh sản, thụ tinh"], ["Ruminant (n)", "['ru:minənt]", "loài nhai lại"], ["Optimal (adj)", "", "Tối ưu"], ["Embryonic", "[,em bri'ɔnik]", "trong thời kỳ đầu của sự phát triển/ phôi thai"], ["Fetal loss", "['fi:tl] [lɔs]", "Mất thai nhi"], ["conceive", "[kən'si:v]", "Thụ thai"], ["Photoperiod (n)", "[,fou tou 'piə ri əd]", "Chu kỳ chiếu sáng"], ["Sperm", "[spə:m]", "tinh dịch"], ["Limited sex drive", "", "Hạn chế ham muốn tình dục"], ["Well-being (n)", "", "Hạnh phúc. khỏe mạnh"], ["Bedding", "['bediη]", "Chất độn chuồng"], ["Quarter", "['kwɔ: tə]", "Khu vực"], ["React", "[ri:'ækt]", "Tác động, phản ứng lại"], ["Re-strain (v)", "[ri:'strein]", "Cố định gia súc"], ["Medical evaluation or treatment", "['me di kl] [i,væ lju 'ei ∫n]\n['tri:t mənt]", "Đánh giá hoặc điều trị y khoa"], ["Interact (v)", "[,in tə 'rækt]", "Tương tác"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What should researchers and educationists do to improve agriculturally relevant animal systems? (Các nhà nghiên cứu và giáo dục nên làm gì để cải thiện các hệ thống vật nuôi liên quan đến nông nghiệp?)", "answer": "They should collaborate with industry and other interested parties to develop and disseminate knowledge and methods. – Họ cần hợp tác với ngành công nghiệp và các bên liên quan khác để phát triển và phổ biến kiến thức cũng như phương pháp."}, {"type": "question", "qType": "open", "question": "2. How many genetic traits do researchers focus on? (Các nhà nghiên cứu tập trung vào bao nhiêu tính trạng di truyền?)", "answer": "Three main groups of desirable traits: animals that are leaner; animals with increased disease resistance; and animals that excel in growth rate or in the production of eggs, meat, milk, wool, or mohair. – Ba nhóm tính trạng chính: ít mỡ (nhiều nạc) hơn; kháng bệnh tốt hơn; vượt trội về tốc độ tăng trưởng hoặc sản lượng trứng, thịt, sữa, len, mohair."}, {"type": "question", "qType": "open", "question": "3. What could be the consequences if inefficient nutrient intake by animals? (Hấp thụ dinh dưỡng kém hiệu quả ở động vật có thể gây ra hậu quả gì?)", "answer": "It is financially and environmentally costly; it hurts animal growth, health, and well-being; it may affect the safety and quality of food products; and excess nutrients may pollute the environment (odors, ground water contamination). – Tốn kém về tài chính và môi trường; hại đến tăng trưởng, sức khỏe, phúc lợi của vật nuôi; ảnh hưởng an toàn và chất lượng thực phẩm; dinh dưỡng dư thừa gây ô nhiễm (mùi hôi, ô nhiễm nước ngầm)."}, {"type": "question", "qType": "open", "question": "4. How many products can be harvested from animals? (Có thể thu được bao nhiêu loại sản phẩm từ động vật?)", "answer": "Meat and meat products, poultry products (meat and eggs), fish, shellfish, dairy products (milk and cheese), and non-food products such as fiber (wool, mohair, cashmere, and leather). – Thịt và sản phẩm từ thịt, sản phẩm gia cầm (thịt, trứng), cá, động vật có vỏ, sản phẩm sữa (sữa, phô mai) và sản phẩm phi thực phẩm như xơ sợi (len, mohair, cashmere, da)."}, {"type": "question", "qType": "open", "question": "5. What are the main factors affecting the quality of these animal products? (Những yếu tố chính nào ảnh hưởng đến chất lượng của các sản phẩm động vật này?)", "answer": "Before harvest: genetics, nutrition, and management systems. After harvest: handling, processing, storage, and marketing practices. – Trước thu hoạch: di truyền, dinh dưỡng, hệ thống quản lý. Sau thu hoạch: vận chuyển/xử lý, chế biến, bảo quản và tiếp thị."}, {"type": "question", "qType": "open", "question": "6. What could be the causative factors accounted for the inefficient reproduction? (Những nguyên nhân nào dẫn đến sinh sản kém hiệu quả?)", "answer": "Increased genetic selection for meat or milk production traits; early embryonic and fetal loss; failure to reach puberty at an optimum age; environmental stressors (temperature extremes, changes in photoperiod); production of low-potency sperm; and limited sex drive. – Tăng chọn lọc di truyền cho tính trạng thịt/sữa; sảy phôi và thai sớm; không đạt tuổi thành thục đúng lúc; yếu tố gây căng thẳng từ môi trường; tinh trùng chất lượng thấp; hạn chế ham muốn tình dục."}, {"type": "content", "title": "Practice 2: True or false statement", "content": "Chọn True (Đúng) hoặc False (Sai) – app sẽ báo ngay đúng hay sai."}, {"type": "question", "qType": "truefalse", "question": "1. Research, education and extension activities did not change to address new challenges and opportunities. (Nghiên cứu, giáo dục và khuyến nông đã không thay đổi để giải quyết thách thức và cơ hội mới.)", "answer": "false", "explain": "Sai: bài đọc nói các hoạt động này \"continually changing\"."}, {"type": "question", "qType": "truefalse", "question": "2. Researchers collaborate with industry and other interested parties to develop and disseminate knowledge and methods to improve agriculturally relevant animal systems. (Các nhà nghiên cứu hợp tác với ngành công nghiệp và các bên liên quan để phát triển và phổ biến kiến thức, phương pháp.)", "answer": "true", "explain": "Đúng: đúng nguyên văn bài đọc."}, {"type": "question", "qType": "truefalse", "question": "3. The quality and safety of animal products prior to harvest do not depend on genetics, nutrition, and management systems. (Chất lượng và an toàn sản phẩm trước thu hoạch không phụ thuộc vào di truyền, dinh dưỡng và quản lý.)", "answer": "false", "explain": "Sai: bài đọc nói chúng \"are influenced by\" các yếu tố này."}, {"type": "question", "qType": "truefalse", "question": "4. Inefficient nutrient intake by animals does not affect environment in animal operations from livestock farms to fish farms. (Hấp thụ dinh dưỡng kém hiệu quả không ảnh hưởng đến môi trường.)", "answer": "false", "explain": "Sai: bài đọc nói nó \"environmentally costly\" và gây ô nhiễm."}, {"type": "content", "title": "Practice 3: Word/phrase usage", "content": "Fill in the blank the most appropriate word or phrase – Chọn từ/cụm từ phù hợp nhất điền vào chỗ trống. Bấm vào đáp án để kiểm tra."}, {"type": "question", "qType": "choice", "question": "1. One of the most important tasks for the extensionist is to ……… knowledge to the farmers. (Một trong những nhiệm vụ quan trọng nhất của cán bộ khuyến nông là ……… kiến thức cho nông dân.)", "options": ["A. disseminate (phổ biến)", "B. talk", "C. tell", "D. get"], "answer": 0}, {"type": "question", "qType": "choice", "question": "2. Besides dogs and cats, some wild animals e.g. snakes, crocodile etc. are also considered as ……… (Ngoài chó mèo, một số động vật hoang dã như rắn, cá sấu… cũng được xem là ………)", "options": ["A. friendly", "B. pets (thú cưng)", "C. aggressive", "D. submissive"], "answer": 1}, {"type": "question", "qType": "choice", "question": "3. Animal products include meat, eggs, fish, shellfish, milk and cheese, wool, mohair, cashmere, and ……… (Sản phẩm động vật gồm thịt, trứng, cá, động vật có vỏ, sữa và phô mai, len, mohair, cashmere và ………)", "options": ["A. leather (da)", "B. livestock", "C. poultry", "D. genetic"], "answer": 0}, {"type": "question", "qType": "choice", "question": "4. The quality and safety of animal products ……… are influenced by genetics, nutrition, and management systems. (Chất lượng và an toàn sản phẩm động vật ……… chịu ảnh hưởng bởi di truyền, dinh dưỡng và hệ thống quản lý.)", "options": ["A. during the harvest", "B. after harvest", "C. prior harvest (trước thu hoạch)", "D. All are correct"], "answer": 2}, {"type": "question", "qType": "choice", "question": "5. After harvest, the quality and safety of animal products are affected by handling, processing techniques, transportation methods, ………, and marketing practices. (Sau thu hoạch, chất lượng và an toàn sản phẩm bị ảnh hưởng bởi xử lý, kỹ thuật chế biến, phương thức vận chuyển, ……… và tiếp thị.)", "options": ["A. storage (bảo quản)", "B. nutrients", "C. humidity", "D. temperature"], "answer": 0}], "rev": 2, "prev": 3}, {"id": 2, "title": "Sinh lý học vật nuôi", "sub": "Animal Physiology", "color": "#7BAEDF", "reading": [{"en": "1. Physiology: Physiology is about the functions of living organisms – how they eat, breathe, and move about, and what they do just to keep alive.", "vi": "1. Sinh lý học: Sinh lý học nghiên cứu về các chức năng của sinh vật sống – cách chúng ăn, thở, di chuyển và những gì chúng làm để duy trì sự sống."}, {"en": "To use more technical words, physiology is about food and feeding, digestion, respiration, transport of gases in the blood, circulation and function of the heart, excretion and kidney function, muscle and movements, and so on.", "vi": "Nói theo thuật ngữ chuyên môn hơn, sinh lý học nghiên cứu về thức ăn và sự ăn uống, sự tiêu hóa, sự hô hấp, sự vận chuyển khí trong máu, sự tuần hoàn và chức năng của tim, sự bài tiết và chức năng thận, cơ và sự vận động, v.v."}, {"en": "The dead animal has the structures that carry out these functions; in the living animal, the structures work.", "vi": "Con vật đã chết vẫn có các cấu trúc thực hiện những chức năng này; nhưng chỉ ở con vật còn sống, các cấu trúc đó mới hoạt động."}, {"en": "Physiology is also about how the living organism adjusts to the adversities of the environment – obtains enough water to live or avoids too much water, escapes freezing to death or dying from excessive heat, moves about to find suitable surroundings, food, and mates – and how it obtains information about the environment through its senses.", "vi": "Sinh lý học cũng nghiên cứu cách sinh vật sống thích nghi với những bất lợi của môi trường – lấy đủ nước để sống hoặc tránh bị thừa nước, tránh bị chết cóng hoặc chết vì quá nóng, di chuyển để tìm môi trường sống, thức ăn và bạn tình phù hợp – và cách nó thu nhận thông tin về môi trường thông qua các giác quan."}, {"en": "Finally, physiology is about the regulation of all these functions – how they are correlated and integrated into a smooth-functioning organism.", "vi": "Cuối cùng, sinh lý học nghiên cứu sự điều hòa tất cả các chức năng này – cách chúng liên kết và phối hợp với nhau thành một cơ thể hoạt động nhịp nhàng."}, {"en": "Physiology is not only a description of function; it also asks why and how.", "vi": "Sinh lý học không chỉ là sự mô tả chức năng; nó còn đặt câu hỏi tại sao và như thế nào."}, {"en": "To understand how an animal functions, it is necessary to be familiar both with its structure and with some elementary physics and chemistry.", "vi": "Để hiểu một con vật hoạt động như thế nào, cần phải nắm rõ cả cấu tạo của nó lẫn một số kiến thức vật lý và hóa học cơ bản."}, {"en": "For example, we cannot understand respiration unless we know about oxygen.", "vi": "Ví dụ, chúng ta không thể hiểu được sự hô hấp nếu không biết về oxy."}, {"en": "Since ancient times breathing movements have been known as a sign of life or death, but the true meaning of respiration could not be understood until chemists had discovered oxygen.", "vi": "Từ thời cổ đại, cử động thở đã được biết đến như một dấu hiệu của sự sống hay cái chết, nhưng ý nghĩa thực sự của sự hô hấp chỉ được hiểu khi các nhà hóa học phát hiện ra oxy."}, {"en": "The understanding of how living organisms function is helped enormously by using a comparative approach.", "vi": "Việc tìm hiểu cách các sinh vật sống hoạt động được hỗ trợ rất nhiều nhờ sử dụng phương pháp so sánh."}, {"en": "By comparing different animals and examining how each has solved its problem of living within the constraints of the available environment, we gain insight into general principles that otherwise might remain obscure.", "vi": "Bằng cách so sánh các loài động vật khác nhau và xem xét mỗi loài đã giải quyết vấn đề sinh tồn của mình như thế nào trong giới hạn của môi trường sẵn có, chúng ta hiểu sâu hơn về những nguyên lý chung mà nếu không làm vậy có thể vẫn còn mơ hồ."}, {"en": "No animal exists, or can exist, independently of an environment, and the animal that utilizes the resources of the environment must also be able to cope with the difficulties it presents.", "vi": "Không có loài động vật nào tồn tại, hoặc có thể tồn tại, độc lập với môi trường, và con vật khai thác các nguồn tài nguyên của môi trường thì cũng phải có khả năng đối phó với những khó khăn mà môi trường đặt ra."}, {"en": "Thus, a comparative and environmental approach provides deeper insight into physiology.", "vi": "Vì vậy, cách tiếp cận so sánh và môi trường giúp hiểu sâu hơn về sinh lý học."}, {"en": "Examining how an animal copes with its environment often tends to show what is good for the animal.", "vi": "Việc xem xét cách một con vật đối phó với môi trường thường có xu hướng cho thấy điều gì là có lợi cho con vật đó."}, {"en": "This may bring us uncomfortably close to explanations that suggest evidence of purpose, or teleology, and many biologists consider this scientifically improper.", "vi": "Điều này có thể đưa chúng ta đến gần một cách khó chịu với những cách giải thích ngụ ý có mục đích, hay còn gọi là thuyết mục đích (teleology), và nhiều nhà sinh học cho rằng điều này không phù hợp về mặt khoa học."}, {"en": "However, we all do tend to ask, Why? What good is it for the animal?", "vi": "Tuy nhiên, tất cả chúng ta đều có xu hướng hỏi: Tại sao? Điều đó có lợi gì cho con vật?"}, {"en": "Anyway, the animal has to survive, and there is nothing improper or unscientific in finding out how and why it succeeds.", "vi": "Dù sao đi nữa, con vật phải sinh tồn, và việc tìm hiểu nó thành công như thế nào và tại sao thì không có gì là sai trái hay phản khoa học."}, {"en": "If it did not arrive at solutions to the problem of survival, it would no longer be around to interest us, and that is what physiology is all about.", "vi": "Nếu nó không tìm ra giải pháp cho vấn đề sinh tồn, nó đã không còn tồn tại để chúng ta quan tâm, và đó chính là toàn bộ ý nghĩa của sinh lý học."}, {"en": "Source: Knut Schmidt-Nielsen. Animal Physiology – Adaptation and Environment. 5th Edition. Cambridge University Press.", "vi": "Nguồn: Knut Schmidt-Nielsen. Sinh lý học động vật – Sự thích nghi và Môi trường. Tái bản lần thứ 5. Nhà xuất bản Đại học Cambridge."}, {"en": "2. Overview of Organ Systems of the Animal Body", "vi": "2. Tổng quan các hệ cơ quan của cơ thể động vật"}, {"en": "Integumentary system", "vi": "Hệ bì"}, {"en": "Major component organs: skin, nails, and hair; cutaneous sense organs and glands.", "vi": "Các cơ quan chính: da, móng và lông; các cơ quan cảm giác ở da và các tuyến."}, {"en": "Function 1: Protects deeper organs from injury due to bumps, chemicals, bacteria, and dehydration.", "vi": "Chức năng 1: Bảo vệ các cơ quan bên trong khỏi tổn thương do va chạm, hóa chất, vi khuẩn và sự mất nước."}, {"en": "Function 2: Excretes salts and urea.", "vi": "Chức năng 2: Bài tiết muối và urê."}, {"en": "Function 3: Helps regulate body temperature.", "vi": "Chức năng 3: Giúp điều hòa thân nhiệt."}, {"en": "Skeletal system", "vi": "Hệ xương"}, {"en": "Major component organs: bones, cartilages, tendons, ligaments, and joints.", "vi": "Các cơ quan chính: xương, sụn, gân, dây chằng và khớp."}, {"en": "Function 1: Supports and protects internal organs.", "vi": "Chức năng 1: Nâng đỡ và bảo vệ các cơ quan nội tạng."}, {"en": "Function 2: Provides levers for muscular action.", "vi": "Chức năng 2: Tạo đòn bẩy cho hoạt động của cơ."}, {"en": "Function 3: Stores minerals (calcium and others).", "vi": "Chức năng 3: Dự trữ khoáng chất (canxi và các chất khác)."}, {"en": "Function 4: Cavities provide a site for blood cell formation.", "vi": "Chức năng 4: Các khoang xương là nơi hình thành tế bào máu."}, {"en": "Muscular system", "vi": "Hệ cơ"}, {"en": "Major component organs: muscles attached to the skeleton.", "vi": "Các cơ quan chính: các cơ bám vào bộ xương."}, {"en": "Function 1: Skeletal muscles contract, or shorten; in doing so, they move bones to allow motion (running, walking, etc.), grasping and manipulation of the environment, and facial expression.", "vi": "Chức năng 1: Cơ xương co lại, hay ngắn lại; khi đó, chúng làm xương chuyển động để tạo ra sự vận động (chạy, đi, v.v.), sự cầm nắm và thao tác với môi trường xung quanh, cũng như biểu cảm trên mặt."}, {"en": "Function 2: Generates heat.", "vi": "Chức năng 2: Sinh nhiệt."}, {"en": "Nervous system", "vi": "Hệ thần kinh"}, {"en": "Major component organs: brain, spinal cord, nerves, and special sense organs.", "vi": "Các cơ quan chính: não, tủy sống, dây thần kinh và các cơ quan cảm giác đặc biệt."}, {"en": "Function 1: Allows body to detect changes in its internal and external environment and to respond by activating appropriate muscles or glands.", "vi": "Chức năng 1: Giúp cơ thể phát hiện những thay đổi trong môi trường bên trong và bên ngoài, và phản ứng lại bằng cách kích hoạt các cơ hoặc tuyến thích hợp."}, {"en": "Function 2: Helps maintain short-term homeostasis via rapid electrical signals.", "vi": "Chức năng 2: Giúp duy trì cân bằng nội môi ngắn hạn thông qua các tín hiệu điện nhanh."}, {"en": "Endocrine system", "vi": "Hệ nội tiết"}, {"en": "Major component organs: pituitary, thyroid, parathyroid, adrenal, pineal glands, ovaries, testes, and pancreas.", "vi": "Các cơ quan chính: tuyến yên, tuyến giáp, tuyến cận giáp, tuyến thượng thận, tuyến tùng, buồng trứng, dịch hoàn và tuyến tụy."}, {"en": "Function 1: Promotes growth and development.", "vi": "Chức năng 1: Thúc đẩy sự sinh trưởng và phát triển."}, {"en": "Function 2: Produces chemical “messengers” (hormones) that travel in the blood to exert effects on various “target organs”.", "vi": "Chức năng 2: Sản xuất các “chất truyền tin” hóa học (hormone) di chuyển trong máu để tác động lên các “cơ quan đích” khác nhau."}, {"en": "Function 3: Regulates long-term homeostasis.", "vi": "Chức năng 3: Điều hòa cân bằng nội môi dài hạn."}, {"en": "Cardiovascular system", "vi": "Hệ tim mạch"}, {"en": "Major component organs: heart, blood vessels, and blood.", "vi": "Các cơ quan chính: tim, mạch máu và máu."}, {"en": "Function 1: Primarily a transport system that carries blood containing oxygen, carbon dioxide, nutrients, wastes, ions, hormones, and other substances to and from cells.", "vi": "Chức năng 1: Chủ yếu là một hệ thống vận chuyển, đưa máu chứa oxy, khí cacbonic, chất dinh dưỡng, chất thải, ion, hormone và các chất khác đến và đi khỏi các tế bào."}, {"en": "Function 2: Pumping action of the heart propels blood through vessels.", "vi": "Chức năng 2: Hoạt động bơm của tim đẩy máu đi qua các mạch máu."}, {"en": "Function 3: Protects body with blood clots, antibodies, and other protein molecules.", "vi": "Chức năng 3: Bảo vệ cơ thể nhờ cục máu đông, kháng thể và các phân tử protein khác."}, {"en": "Lymphatic / Immune system", "vi": "Hệ bạch huyết / miễn dịch"}, {"en": "Major component organs: lymphatic vessels, lymph nodes, spleen, thymus, and tonsils.", "vi": "Các cơ quan chính: mạch bạch huyết, hạch bạch huyết, lá lách, tuyến ức và amidan."}, {"en": "Function 1: Picks up fluid leaked from the blood vessels and returns it to the blood.", "vi": "Chức năng 1: Thu gom dịch thoát ra từ mạch máu và đưa trở lại máu."}, {"en": "Function 2: Cleanses blood of pathogens and other debris.", "vi": "Chức năng 2: Làm sạch máu khỏi mầm bệnh và các chất lạ khác."}, {"en": "Function 3: Houses cells (lymphocytes and others) that act in immune response.", "vi": "Chức năng 3: Là nơi chứa các tế bào (tế bào lympho và các loại khác) tham gia vào phản ứng miễn dịch."}, {"en": "Respiratory system", "vi": "Hệ hô hấp"}, {"en": "Major component organs: nose, pharynx, larynx, trachea, bronchi, and lungs.", "vi": "Các cơ quan chính: mũi, hầu, thanh quản, khí quản, phế quản và phổi."}, {"en": "Function 1: Keeps blood continuously supplied with oxygen while removing carbon dioxide.", "vi": "Chức năng 1: Liên tục cung cấp oxy cho máu đồng thời loại bỏ khí cacbonic."}, {"en": "Function 2: Contributes to the acid-base balance of the blood via its carbonic acid/bicarbonate buffer system.", "vi": "Chức năng 2: Góp phần cân bằng axit – bazơ của máu thông qua hệ đệm axit cacbonic/bicarbonat."}, {"en": "Digestive system", "vi": "Hệ tiêu hóa"}, {"en": "Major component organs: mouth, esophagus, stomach, small and large intestines, teeth, salivary glands, liver, gallbladder, and pancreas.", "vi": "Các cơ quan chính: miệng, thực quản, dạ dày, ruột non và ruột già, răng, tuyến nước bọt, gan, túi mật và tuyến tụy."}, {"en": "Function 1: Breaks down ingested foods to tiny particles that can be absorbed into the blood.", "vi": "Chức năng 1: Phân giải thức ăn đã ăn vào thành những phần tử nhỏ có thể hấp thu vào máu."}, {"en": "Function 2: Undigested residue leaves the body as feces.", "vi": "Chức năng 2: Phần cặn bã không tiêu hóa được thải ra khỏi cơ thể dưới dạng phân."}, {"en": "Urinary system", "vi": "Hệ tiết niệu"}, {"en": "Major component organs: kidneys, ureters, urinary bladder, and urethra.", "vi": "Các cơ quan chính: thận, niệu quản, bàng quang và niệu đạo."}, {"en": "Function 1: Rids the body of nitrogen-containing wastes (urea, uric acid, ammonia) from protein and nucleic acid breakdown.", "vi": "Chức năng 1: Loại bỏ khỏi cơ thể các chất thải chứa nitơ (urê, axit uric, amoniac) sinh ra từ quá trình phân giải protein và axit nucleic."}, {"en": "Function 2: Maintains water, electrolyte, and acid-base balance of blood.", "vi": "Chức năng 2: Duy trì cân bằng nước, điện giải và axit – bazơ của máu."}, {"en": "Reproductive system", "vi": "Hệ sinh sản"}, {"en": "Major component organs: Male: testes, scrotum, penis, and duct system; Female: ovaries, uterine tubes, uterus, and vagina.", "vi": "Các cơ quan chính: Con đực: dịch hoàn, bao dịch hoàn, dương vật và hệ thống ống dẫn; Con cái: buồng trứng, vòi trứng, tử cung và âm đạo."}, {"en": "Function 1: Produces germ cells (sperm or eggs) for perpetuation of the species.", "vi": "Chức năng 1: Sản sinh tế bào sinh dục (tinh trùng hoặc trứng) để duy trì nòi giống."}, {"en": "Function 2: Female uterus houses a developing fetus until birth.", "vi": "Chức năng 2: Tử cung của con cái là nơi nuôi dưỡng bào thai đang phát triển cho đến khi sinh."}], "extra": [], "vocab": [["Integument", "/ɪnˈteɡ.jə.mənt/", "Lớp áo, vỏ bọc"], ["Skeletal", "/ˈskel.ɪ.təl/", "(Thuộc về) bộ xương"], ["Muscular", "/ˈmʌs.kjə.lər/", "Cơ, bắp thịt"], ["Nervous", "/ˈnɜː.vəs/", "(Thuộc về) thần kinh"], ["Endocrine", "/ˈen.də.krɪn/", "Tuyến nội tiết, thuộc về nội tiết"], ["Cardiovascular", "/ˌkɑː.di.əʊˈvæs.kjə.lər/", "(Thuộc về) tim mạch"], ["Lymphatic", "/lɪmˈfæt.ɪk/", "(Thuộc về) bạch huyết"], ["Immune", "/ɪˈmjuːn/", "Miễn dịch"], ["Respiratory", "/rɪˈspɪr.ə.tər.i/", "(Thuộc về) hô hấp"], ["Digestive", "/daɪˈdʒes.tɪv/", "Tiêu hóa"], ["Urinary", "/ˈjʊə.rɪ.nər.i/", "(Thuộc về) nước tiểu"], ["Reproductive", "/ˌriː.prəˈdʌk.tɪv/", "Sinh sản, tái sản xuất"], ["Cutaneous sense organ and glands", "", "Cơ quan nhận cảm và tuyến trên da"], ["Cartilages", "/ˈkɑː.tɪ.lɪdʒɪz/", "Sụn"], ["Tendon", "/ˈten.dən/", "Gân"], ["Ligament", "/ˈlɪɡ.ə.mənt/", "Dây chằng, dây chằng phụ"], ["Joint", "/dʒɔɪnt/", "Khớp nối, mắt, mấu (để nối)"], ["Spinal cord", "/ˈspaɪ.nəl kɔːd/", "Tuỷ sống"], ["Nerves", "/nɜːvz/", "Dây thần kinh"], ["Special sense organs", "", "Tổ chức nhận cảm đặc biệt"], ["Pituitary", "/pɪˈtʃuː.ɪ.tər.i/", "Tuyến yên"], ["Thyroid", "/ˈθaɪ.rɔɪd/", "Tuyến giáp trạng"], ["Parathyroid", "/ˌpær.əˈθaɪ.rɔɪd/", "Tuyến cận giáp trạng"], ["Adrenal", "/əˈdriː.nəl/", "Tuyến thượng thận"], ["Pineal gland", "/ˈpɪn.i.əl ˌɡlænd/", "Tuyến tùng"], ["Ovary", "/ˈəʊ.vər.i/", "Buồng trứng"], ["Testes", "/ˈtes.tiːz/", "Dịch hoàn"], ["Pancreas", "/ˈpæŋ.kri.əs/", "Tuyến tuỵ"], ["Vessel", "/ˈves.əl/", "Mạch quản"], ["Lymph node", "/lɪmf nəʊd/", "Hạch lympho"], ["Spleen", "/spliːn/", "Lá lách"], ["Thymus", "/ˈθaɪ.məs/", "Tuyến ức"], ["Tonsil", "/ˈtɒn.səl/", "Amidan, tuyến hạnh nhân"], ["Pharynx", "/ˈfær.ɪŋks/", "Hầu, họng"], ["Larynx", "/ˈlær.ɪŋks/", "Thanh quản"], ["Trachea", "/trəˈkiː.ə/", "Khí quản, ống khí"], ["Bronchi", "/ˈbrɒŋ.kaɪ/", "Phế quản"], ["Esophagus", "/ɪˈsɒf.ə.ɡəs/", "Thực quản"], ["Small and large intestine", "", "Ruột non và ruột già"], ["Salivary gland", "/səˈlaɪ.vər.i ɡlænd/", "Tuyến nước bọt"], ["Liver", "/ˈlɪv.ər/", "Gan"], ["Gallbladder", "/ˈɡɔːlˌblæd.ər/", "Túi mật"], ["Kidney", "/ˈkɪd.ni/", "Thận"], ["Ureter", "/ˈjʊə.rɪ.tər/", "Niệu quản"], ["Urinary bladder", "/ˈjʊə.rɪ.nər.i ˈblæd.ər/", "Bàng quang"], ["Urethra", "/jʊəˈriː.θrə/", "Niệu đạo"], ["Scrotum", "/ˈskrəʊ.təm/", "Bao dịch hoàn"], ["Penis", "/ˈpiː.nɪs/", "Dương vật"], ["Duct system", "", "Hệ thống ống (sinh tinh)"], ["Sperm", "/spɜːm/", "Tinh trùng"], ["Uterine tubes", "", "Vòi trứng (vòi Fallop)"], ["Uterus", "/ˈjuː.tər.əs/", "Dạ con, tử cung"], ["Vagina", "/vəˈdʒaɪ.nə/", "Âm đạo"], ["Blood cell formation", "", "Hình thành tế bào máu"], ["Cavity", "/ˈkæv.ə.ti/", "Khoang, hốc"], ["Motion", "/ˈməʊ.ʃən/", "Vận động"], ["Grasping", "/ˈɡrɑː.spɪŋ/", "Phản xạ"], ["Manipulation", "/məˌnɪp.jəˈleɪ.ʃən/", "Thao tác"], ["Facial expression", "", "Biểu thị ngoài"], ["Generate", "/ˈdʒen.ə.reɪt/", "Sinh, sinh sản"], ["Homeostasis", "/ˌhəʊ.mi.əˈsteɪ.sɪs/", "Nội môi, tính cân bằng tự nhiên"], ["Exert", "/ɪɡˈzɜːt/", "Đưa vào sử dụng, áp dụng cái gì"], ["Clot", "/klɒt/", "Đông máu"], ["Antibodies", "/ˈæn.tiˌbɒd.iz/", "Kháng thể"], ["Fluid leaked", "", "Sự thoát dịch"], ["Pathogen", "/ˈpæθ.ə.dʒən/", "Mầm bệnh, nguồn bệnh"], ["Debris", "/ˈdeb.riː/", "Mảnh vỡ, mảnh vụn, chất lạ (vào cơ thể)"], ["Ingest", "/ɪnˈdʒest/", "Ăn vào bụng"], ["Delivery", "/dɪˈlɪv.ər.i/", "Sự phân phát"], ["Undigested", "/ˌʌn.daɪˈdʒes.tɪd/", "Không tiêu hoá, không hấp thụ"], ["Feces", "/ˈfiː.siːz/", "Phân"], ["Perpetuation", "/pəˌpetʃ.uˈeɪ.ʃən/", "Sự duy trì"], ["Fetus", "/ˈfiː.təs/", "Thai, bào thai"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. What is the main function of the skin? (Chức năng chính của da là gì?)", "answer": "The skin protects deeper organs from injury (bumps, chemicals, bacteria, dehydration), excretes salts and urea, and helps regulate body temperature. – Da bảo vệ các cơ quan bên trong khỏi tổn thương, bài tiết muối và urê, giúp điều hòa thân nhiệt."}, {"type": "question", "qType": "open", "question": "2. How do animals react to the invasion of foreign substances (e.g. pathogen)? (Động vật phản ứng thế nào khi chất lạ, ví dụ mầm bệnh, xâm nhập?)", "answer": "The lymphatic/immune system responds: lymph nodes and spleen cleanse the blood of pathogens and debris; lymphocytes produce antibodies and other cells destroy the invaders (immune response); inflammation and fever may occur. – Hệ bạch huyết/miễn dịch phản ứng: làm sạch máu khỏi mầm bệnh, tế bào lympho tạo kháng thể và tiêu diệt tác nhân lạ; có thể gây viêm, sốt."}, {"type": "question", "qType": "open", "question": "3. What is the function of the skeletal system? (Chức năng của hệ xương là gì?)", "answer": "It supports and protects internal organs, provides levers for muscular action, stores minerals (calcium and others), and its cavities are a site for blood cell formation. – Nâng đỡ, bảo vệ nội tạng; tạo đòn bẩy cho cơ; dự trữ khoáng; khoang xương là nơi tạo tế bào máu."}, {"type": "question", "qType": "open", "question": "4. What is the main difference between blood in the vein and blood in the artery? (Khác biệt chính giữa máu tĩnh mạch và máu động mạch?)", "answer": "Arteries carry oxygen-rich blood away from the heart to the tissues; veins carry blood low in oxygen and rich in carbon dioxide back to the heart (except the pulmonary artery and veins). – Động mạch đưa máu giàu oxy từ tim đến mô; tĩnh mạch đưa máu nghèo oxy, giàu CO₂ về tim (ngoại trừ động/tĩnh mạch phổi)."}, {"type": "question", "qType": "open", "question": "5. How do the ingested feeds travel in the digestive system? (Thức ăn di chuyển trong hệ tiêu hóa như thế nào?)", "answer": "Mouth → esophagus → stomach → small intestine → large intestine, pushed along by muscular contractions (peristalsis); nutrients are absorbed into the blood and undigested residue leaves the body as feces. – Miệng → thực quản → dạ dày → ruột non → ruột già nhờ nhu động; chất dinh dưỡng được hấp thu, cặn bã thải ra thành phân."}, {"type": "question", "qType": "open", "question": "6. Which part of the intestine the digestion and absorption processes are mostly taken place? (Tiêu hóa và hấp thu diễn ra chủ yếu ở đoạn ruột nào?)", "answer": "In the small intestine (mainly the duodenum and jejunum). – Ở ruột non (chủ yếu tá tràng và hỗng tràng)."}, {"type": "question", "qType": "open", "question": "7. How does protease break down the protein structure? (Protease phân giải cấu trúc protein như thế nào?)", "answer": "Protease hydrolyzes (breaks with water) the peptide bonds between amino acids, splitting proteins into smaller peptides and free amino acids that can be absorbed. – Protease thủy phân liên kết peptit giữa các axit amin, cắt protein thành peptit nhỏ và axit amin tự do để hấp thu."}, {"type": "question", "qType": "open", "question": "8. What is the name of hormone secreted by the adrenal? (Tuyến thượng thận tiết ra hormone gì?)", "answer": "Adrenal medulla: adrenaline (epinephrine) and noradrenaline; adrenal cortex: cortisol (glucocorticoids) and aldosterone. – Tủy thượng thận: adrenalin, noradrenalin; vỏ thượng thận: cortisol, aldosteron."}, {"type": "question", "qType": "open", "question": "9. What are the most important factors that make the cows come into heat? (Những yếu tố quan trọng nhất làm bò động dục?)", "answer": "Reproductive hormones (FSH, LH and estrogen from the developing follicle, after progesterone falls), together with reaching puberty, good nutrition and body condition, good health and suitable environment/season. – Hormone sinh sản (FSH, LH, estrogen khi progesteron giảm), cùng với đến tuổi thành thục, dinh dưỡng và thể trạng tốt, sức khỏe và môi trường phù hợp."}, {"type": "question", "qType": "open", "question": "10. How do we detect the cow if she comes on heat? (Làm sao phát hiện bò động dục?)", "answer": "Main sign: she stands still to be mounted by other cows or a bull. Other signs: mounting other cows, restlessness, bellowing, swollen red vulva, clear mucus discharge, reduced feed intake and milk yield; aids such as tail paint or pedometers. – Dấu hiệu chính: đứng yên cho con khác nhảy lên; ngoài ra nhảy lên con khác, bồn chồn, kêu rống, âm hộ sưng đỏ, chảy dịch nhầy trong, giảm ăn và giảm sữa."}], "rev": 3, "prev": 1}, {"id": 3, "title": "Dinh dưỡng động vật", "sub": "Animal Nutrition", "color": "#D4A84B", "reading": [{"en": "1. The role of animal nutrition: Animal nutrition plays important part in animal production.", "vi": "1. Vai trò dinh dưỡng."}, {"en": "2. Energy: DE, ME, NE definitions.", "vi": "2. Năng lượng."}, {"en": "3. Animal feeding practices: Feeding practices developed over 150 years.", "vi": "3. Thực hành cho ăn."}], "extra": [], "vocab": [["Implication", "[,impli'kei∫n]", "Sự liên quan, (Số nhiều) Sự quan hệ mật thiết"], ["Composition", "[,kɔmpə'zi∫n]", "Thành phần"], ["Achieve", "[ə't∫i:v]", ""], ["Amino acid", "['æsid]", "Axit amin"], ["Mineral", "['minərəl]", "Khoáng chất"], ["Provide", "[prə'vaid]", "Cung cấp"], ["Necessary", "['nesisəri]", "Cấn thiết"], ["Requirement", "[ri'kwaiəmənt]", "Nhu cầu, sự đòi hỏi"], ["Formulation", "[,fɔ:mju'lei∫n]", "Sự làm thành công thức. xây dựng công thức"], ["Proportion", "[prə'pɔ:∫n]", "Tỉ lệ"], ["mainte function switchQType(item, v){
 const old=item.qType||'truefalse'; if(old===v) return;
 if(!item.answers) item.answers={};
 if(item.answer!==undefined && item.answer!=='') item.answers[old]=item.answer;
 item.qType=v;
 if(v==='choice' && !item.options) item.options=['A. Đáp án 1','B. Đáp án 2','C. Đáp án 3','D. Đáp án 4'];
 const def={choice:0, truefalse:'true', fill:'', open:''}[v];
 let a=item.answers[v];
 if(a===undefined && (v==='open'||v==='fill')) a=item.answers.open!==undefined? item.answers.open : item.answers.fill;
 item.answer= a!==undefined? a : def;
}

function cleanForSpeech(text){
 if(!text) return '';
 // Remove content inside parentheses () and brackets [] including the brackets
 // e.g. "Production (n)" -> "Production", "Significant (adj)" -> "Significant"
 let cleaned = text.replace(/\s*\([^)]*\)/g, '').replace(/\s*\[[^\]]*\]/g, '').trim();
 // Also remove extra spaces
 cleaned = cleaned.replace(/\s{2,}/g, ' ').trim();
 // If after cleaning empty, fallback to original without parentheses symbols
 if(!cleaned) cleaned = text.replace(/[()\[\]]/g, '').trim();
 return cleaned;
}

  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(Array.isArray(parsed) && parsed.length>0){
        // Ghi đè lessons
        for(let i=0;i<Math.min(parsed.length, lessons.length);i++){
          if(parsed[i].reading) lessons[i].reading=parsed[i].reading;
          if(parsed[i].vocab) lessons[i].vocab=parsed[i].vocab;
          if(parsed[i].practice) lessons[i].practice=parsed[i].practice;
          if(parsed[i].extra) lessons[i].extra=parsed[i].extra;
          if(parsed[i].hard) lessons[i].hard=parsed[i].hard;
        }
        saveLessons(); renderAll();
        const t=document.createElement('div'); t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#8CB580] text-black px-4 py-2 rounded-full text-sm font-medium shadow-lg z-50'; t.textContent='✅ Đã nhập lại dữ liệu từ JSON'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
      }
    }catch(err){ alert('File JSON lỗi: '+err.message); }
  };
  reader.readAsText(file);
};

  formMode=true;
  const term=cur.isVi?((cur.items&&cur.items[0]&&cur.items[0].en)||''):cleanTerm(cur.txt);
  const mean=cur.isVi?cleanTerm(cur.txt):((cur.items&&cur.items.length===1&&cur.items[0].means[0])||'');
  const ex=term? findExisting(term):null;
  pop.innerHTML=`<div class="sp-word">➕ Thêm từ mới vào Bài ${lessons[currentLesson].id}</div>
   <input data-f="0" placeholder="Thuật ngữ tiếng Anh">
   <input data-f="1" placeholder="Phiên âm (không bắt buộc)">
   <input data-f="2" placeholder="Nghĩa tiếng Việt">
   <div class="sp-note sp-ex"></div>
   <div style="display:flex;gap:6px"><button class="sp-btn" data-a="cancel" style="justify-content:center">Hủy</button><button class="sp-btn pri" data-a="save" style="justify-content:center">💾 Lưu</button></div>`;
  const ins=pop.querySelectorAll('input'); ins[0].value=term; ins[2].value=mean;
  if(ex){ pop.querySelector('.sp-ex').textContent='⚠️ Đã có trong Bài '+ex.ll.id+(ex.key==='extra'?' (Từ bổ sung)':'')+': '+(ex.r[2]||'(chưa có nghĩa)'); }
  ins.forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } if(e.key==='Escape') hide(); }));
  place(); (!term? ins[0] : (mean? ins[1] : ins[2])).focus({preventScroll:true});
 }
 function save(){
  const v=[...pop.querySelectorAll('input')].map(i=>i.value.trim());
  if(!v[0]){ pop.querySelector('input').focus(); return; }
  const l=lessons[currentLesson]; if(!Array.isArray(l.vocab)) l.vocab=[];
  l.vocab.unshift([v[0],v[1],v[2]]);
  if(Array.isArray(l.hard)) l.hard=l.hard.map(h=>h+1);
  saveLessons(); renderLessonList(); hide();
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  toast('✅ Đã thêm "'+v[0]+'" vào Từ vựng Bài '+l.id);
 }
 pop.addEventListener('mousedown',e=>{ if(e.target.tagName!=='INPUT') e.preventDefault(); });
 pop.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||!cur) return; const a=b.dataset.a;
  if(a==='add') showForm();
  else if(a==='speak'){ isPlayingAll=false; resetPlayBtn(); speakText(cleanForSpeech(cleanTerm(cur.txt))||cur.txt, cur.isVi?'vi':'en'); }
  else if(a==='save') save();
  else if(a==='cancel') hide();
 });
 function check(){ if(formMode) return; const s=readSel(); if(s){ cur=s; showMenu(); } else if(pop.style.display==='block') hide(); }
 const later=d=>{ clearTimeout(timer); timer=setTimeout(check,d); };
 document.addEventListener('mouseup',e=>{ if(!pop.contains(e.target)) later(10); });
 document.addEventListener('touchend',e=>{ if(!pop.contains(e.target)) later(350); });
 document.addEventListener('selectionchange',()=>{ if(!formMode) later(450); });
 document.addEventListener('mousedown',e=>{ if(!pop.contains(e.target) && formMode) hide(); });
 document.addEventListener('touchstart',e=>{ if(!pop.contains(e.target) && formMode) hide(); },{passive:true});
 document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
 window.addEventListener('scroll',()=>{ if(!formMode && pop.style.display==='block' && isMobileLayout()) hide(); },{passive:true});
 document.getElementById('mainContent').addEventListener('scroll',()=>{ if(!formMode && pop.style.display==='block') hide(); },{passive:true});
})();

(function(){
 const b=document.getElementById('viToggle');
 const paint=()=>{ b.textContent='🇻🇳 Đọc cả TV: '+(readVi?'Bật':'Tắt'); b.className='px-3 py-1 rounded-full text-xs '+(readVi?'bg-[#FACC15] text-black font-bold':'bg-[#2A2A2A]'); };
 paint();
 b.onclick=()=>{ readVi=!readVi; try{localStorage.setItem('avcn_readvi',readVi?'1':'0');}catch(e){} paint();
  if(readVi && voices.length && !voices.some(v=>/^vi/i.test(v.lang))) toast('⚠️ Máy chưa có giọng đọc tiếng Việt – hãy dùng Microsoft Edge hoặc cài giọng Việt','#FACC15'); };
})();
// ===== Điện thoại / iPad: menu bài học dạng ngăn kéo, menu ⋯, chiều cao thanh dính =====
(function(){
 const body=document.body, act=document.getElementById('actionBar');
 const closeDrawer=()=>body.classList.remove('drawer-open');
 document.getElementById('menuBtn').onclick=()=>{ act.classList.remove('open'); body.classList.toggle('drawer-open'); };
 document.getElementById('drawerBg').onclick=closeDrawer;
 document.getElementById('lessonList').addEventListener('click',()=>{ if(isMobileLayout()) setTimeout(closeDrawer,50); });
 document.getElementById('searchAll').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.target.blur(); closeDrawer(); } });
 document.getElementById('moreBtn').onclick=e=>{ e.stopPropagation(); act.classList.toggle('open'); };
 act.addEventListener('click',()=>{ if(innerWidth<1280) setTimeout(()=>act.classList.remove('open'),150); });
 document.addEventListener('click',e=>{ if(act.classList.contains('open') && !act.contains(e.target) && e.target.id!=='moreBtn') act.classList.remove('open'); });
 const lbl=document.getElementById('curLesson');
 const updLbl=()=>{ const l=lessons[currentLesson]; lbl.innerHTML=''; lbl.textContent='Bài '+l.id+': '+l.title; const sm=document.createElement('small'); sm.textContent=l.sub; lbl.appendChild(sm); };
 const _rll=renderLessonList; renderLessonList=function(){ _rll.apply(this,arguments); updLbl(); };
 const setVars=()=>{ const tb=document.getElementById('topBar'), ab=document.getElementById('audioBar');
  document.documentElement.style.setProperty('--tbh', tb.offsetHeight+'px');
  document.documentElement.style.setProperty('--abh', (ab && ab.offsetParent? ab.offsetHeight:0)+'px'); };
 if(window.ResizeObserver){ const ro=new ResizeObserver(setVars); ro.observe(document.getElementById('topBar')); ro.observe(document.getElementById('audioBar')); }
 window.addEventListener('resize',()=>{ setVars(); if(!isMobileLayout()){ closeDrawer(); } if(innerWidth>=1280) act.classList.remove('open'); });
 setVars();
})();

renderAll();
</script>
