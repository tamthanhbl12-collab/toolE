ào bao quanh trứng."}, {"en": "The middle piece contains mitochondria needed to generate ATP necessary to operate the flagella.", "vi": "Đoạn giữa chứa ty thể cần để tạo ATP giúp roi hoạt động."}, {"en": "The tail contains microtubules arranged in the 9+2 arrangement typical of eukaryotic cells.", "vi": "Đuôi chứa các vi ống sắp xếp theo kiểu 9+2 đặc trưng của tế bào nhân thực."}, {"en": "4. Female Reproductive System", "vi": "4. Hệ sinh dục cái"}, {"en": "Female Reproductive Structures", "vi": "Cấu trúc sinh dục cái"}, {"en": "Gametes are produced by ovaries. The ovaries are suspended in the abdominal cavity by ligaments and mesenteries.", "vi": "Giao tử được buồng trứng tạo ra. Buồng trứng được treo trong khoang bụng nhờ các dây chằng và mạc treo."}, {"en": "Oviducts serve as passageways from ovaries to uterus. They are not connected to the ovaries.", "vi": "Vòi trứng là đường dẫn từ buồng trứng đến tử cung. Chúng không nối trực tiếp với buồng trứng."}, {"en": "The uterus lies in a nearly horizontal position on top of the bladder.", "vi": "Tử cung nằm gần như ngang, phía trên bàng quang."}, {"en": "The myometrium is a muscle layer; the endometrium is the lining.", "vi": "Lớp cơ tử cung là lớp cơ; nội mạc tử cung là lớp lót bên trong."}, {"en": "The outer layer of endometrium is shed during menstruation.", "vi": "Lớp ngoài của nội mạc tử cung bong ra trong kỳ kinh nguyệt."}, {"en": "The cervix is muscular sphincter between uterus and vagina.", "vi": "Cổ tử cung là cơ thắt nằm giữa tử cung và âm đạo."}, {"en": "The vagina is a muscular structure that functions to receive the penis and also as the birth canal.", "vi": "Âm đạo là cấu trúc cơ có chức năng tiếp nhận dương vật và cũng là đường sinh."}, {"en": "It opens between urethra and anus.", "vi": "Nó mở ra giữa niệu đạo và hậu môn."}, {"en": "Bacteria in the vagina convert glycogen (a carbohydrate) to lactic acid, making it slightly acidic.", "vi": "Vi khuẩn trong âm đạo chuyển glycogen (một loại carbohydrate) thành axit lactic, làm âm đạo hơi có tính axit."}, {"en": "The clitoris is homologous with the glans penis in males; it contains erectile tissue and a glans.", "vi": "Âm vật tương đồng với đầu dương vật ở con đực; nó chứa mô cương và một đầu."}, {"en": "Labia are folds of skin near the opening of the vagina.", "vi": "Môi âm hộ là các nếp da gần lỗ âm đạo."}, {"en": "Labia majora are fleshy and covered with pubic hair. They are homologous with the scrotum in the male.", "vi": "Môi lớn dày thịt và có lông mu che phủ. Chúng tương đồng với bìu ở con đực."}, {"en": "Labia minora are homologous with the shaft of the penis in male.", "vi": "Môi bé tương đồng với thân dương vật ở con đực."}, {"en": "The external genitalia of females are the vulva.", "vi": "Cơ quan sinh dục ngoài của con cái là âm hộ."}, {"en": "Primary oocytes begin to form in females before they are born (during the 3rd month of embryonic development).", "vi": "Noãn bào sơ cấp bắt đầu hình thành ở con cái trước khi sinh (vào tháng thứ 3 của giai đoạn phôi)."}, {"en": "Development stops before the first meiotic division is completed.", "vi": "Sự phát triển dừng lại trước khi hoàn tất lần phân bào giảm nhiễm thứ nhất."}, {"en": "Females are born with all the primary oocytes that they will ever possess.", "vi": "Con cái sinh ra đã có toàn bộ số noãn bào sơ cấp mà chúng sẽ có trong suốt đời."}, {"en": "The first meiotic division is completed at about the time of ovulation; secondary oocytes are therefore released at ovulation, not eggs.", "vi": "Lần phân bào giảm nhiễm thứ nhất hoàn tất vào khoảng thời điểm rụng trứng; vì vậy khi rụng trứng, thứ được giải phóng là noãn bào thứ cấp, không phải trứng."}, {"en": "The second meiotic division occurs after fertilization.", "vi": "Lần phân bào giảm nhiễm thứ hai xảy ra sau khi thụ tinh."}, {"en": "An infant may have as many as 2 million primary oocytes.", "vi": "Một trẻ sơ sinh có thể có tới 2 triệu noãn bào sơ cấp."}, {"en": "Approximately 300,000-400,000 primary oocytes remain at time of puberty; 400 mature over the reproductive years.", "vi": "Khoảng 300.000–400.000 noãn bào sơ cấp còn lại vào thời điểm dậy thì; 400 noãn bào trưởng thành trong suốt những năm sinh sản."}, {"en": "Ovarian Follicle", "vi": "Nang trứng"}, {"en": "The oocyte and cells surrounding it is the follicle.", "vi": "Noãn bào cùng các tế bào bao quanh nó tạo thành nang trứng."}, {"en": "The follicle moves to the surface and erupts, releasing the oocyte.", "vi": "Nang trứng di chuyển ra bề mặt và vỡ ra, giải phóng noãn bào."}, {"en": "After ovulation, the follicle develops into a corpus luteum, which lasts only about 10 days if the secondary oocyte is not fertilized.", "vi": "Sau khi rụng trứng, nang trứng phát triển thành thể vàng, tồn tại chỉ khoảng 10 ngày nếu noãn bào thứ cấp không được thụ tinh."}, {"en": "The secondary oocyte is swept into the oviduct by beating cilia and movement of the oviduct.", "vi": "Noãn bào thứ cấp được lông rung và chuyển động của vòi trứng cuốn vào vòi trứng."}, {"en": "Cilia and peristalsis move the oocyte through the oviduct.", "vi": "Lông rung và nhu động đưa noãn bào đi dọc vòi trứng."}, {"en": "Fertilization occurs in oviduct.", "vi": "Sự thụ tinh xảy ra trong vòi trứng."}, {"en": "The secondary oocyte must be fertilized within 36 hours.", "vi": "Noãn bào thứ cấp phải được thụ tinh trong vòng 36 giờ."}, {"en": "Sperm survive in the female reproductive tract for approximately 48 hours.", "vi": "Tinh trùng sống được trong đường sinh dục cái khoảng 48 giờ."}, {"en": "It takes 3 days to reach uterus.", "vi": "Phải mất 3 ngày để đến được tử cung."}], "extra": [], "vocab": [["Asexual reproduction (adj)", "", "Sinh sản vô tính"], ["Oocyte (n)", "", "Noãn bào"], ["Follicle (n)", "", "nang"], ["Fertilize (v)", "", "Thụ tinh"], ["Puberty (n)", "", "Tuổi thành thục"], ["Scrotum (n)", "", "Bao dịch hoàn"], ["Uterus (n)", "", "Tử cung"], ["Ovulation (n)", "", "Sự rụng trứng"], ["Oviduct (n)", "", "Vòi trứng"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. How do vertebrate animals reproduce? (Động vật có xương sống sinh sản như thế nào?)", "answer": "Vertebrates reproduce sexually: the sexes are usually separate and sperm fuse with eggs; fertilization is external in aquatic species and internal in terrestrial ones (some species can change sex). – Chúng sinh sản hữu tính: thường phân tính, tinh trùng kết hợp với trứng; thụ tinh ngoài ở loài sống dưới nước, thụ tinh trong ở loài sống trên cạn (một số loài có thể đổi giới tính)."}, {"type": "question", "qType": "open", "question": "2. What are the main advantages of sexual reproduction? (Ưu điểm chính của sinh sản hữu tính là gì?)", "answer": "It promotes variation, because offspring inherit genes from two parents and crossing-over and independent assortment mix genes; variation is advantageous to species in fluctuating environments. – Nó thúc đẩy sự biến dị vì con thừa hưởng gen của hai bố mẹ, cùng với trao đổi chéo và phân li độc lập; biến dị có lợi cho loài trong môi trường biến động."}, {"type": "question", "qType": "open", "question": "3. What phenomenon occur if sperm cell meet an egg in the three-quarter of the Fallopian tube? (Hiện tượng gì xảy ra nếu tinh trùng gặp trứng ở 3/4 vòi trứng?)", "answer": "Fertilization occurs: the sperm penetrates the secondary oocyte (which completes its second meiotic division) to form a zygote; the embryo then takes about 3 days to reach the uterus. – Xảy ra sự thụ tinh: tinh trùng xâm nhập noãn bào thứ cấp (noãn hoàn tất giảm nhiễm lần hai) tạo hợp tử; phôi mất khoảng 3 ngày để đến tử cung."}, {"type": "question", "qType": "open", "question": "4. What are the roles of endocrines in sexual reproduction activities? (Vai trò của các tuyến nội tiết trong hoạt động sinh sản là gì?)", "answer": "Testosterone (from Leydig cells) stimulates spermatogenesis, sexual behavior and secondary sexual characteristics; melatonin from the pineal gland links reproductive behavior to day length; in females hormones control follicle growth, ovulation and the estrus cycle (phần hormone cái là kiến thức mở rộng). – Testosterone kích thích sinh tinh, hành vi tính dục và đặc điểm sinh dục phụ; melatonin của tuyến tùng gắn hành vi sinh sản với độ dài ngày; ở con cái, hormone điều khiển sự phát triển nang trứng, rụng trứng và chu kỳ động dục."}, {"type": "question", "qType": "open", "question": "5. What is estrus cycle? (Chu kỳ động dục là gì?)", "answer": "The recurring reproductive cycle of female mammals in which follicles develop, the female comes into heat (estrus) and ovulates, followed by a corpus luteum phase, repeated until pregnancy occurs (kiến thức mở rộng). – Chu kỳ sinh sản lặp lại ở con cái động vật có vú: nang trứng phát triển, con cái động dục (estrus) và rụng trứng, sau đó là giai đoạn thể vàng, lặp lại cho đến khi có thai."}, {"type": "question", "qType": "open", "question": "6. How many egg does a cow normally ovulate in one estrus cycle? (Một con bò thường rụng bao nhiêu trứng trong một chu kỳ động dục?)", "answer": "Normally one egg (occasionally two) (kiến thức mở rộng). – Thường là một trứng (đôi khi hai)."}, {"type": "question", "qType": "open", "question": "7. Where were sperm cells made? Where were they stored and then activated? (Tinh trùng được tạo ở đâu? Được dự trữ và sau đó hoạt hóa ở đâu?)", "answer": "Sperm are produced in the seminiferous tubules of the testes, mature and are stored in the epididymides and vas deferens, and become active when mixed with seminal fluids at ejaculation. – Tinh trùng được tạo trong ống sinh tinh của tinh hoàn, trưởng thành và dự trữ trong mào tinh và ống dẫn tinh, rồi hoạt hóa khi hòa với dịch tinh lúc xuất tinh."}, {"type": "content", "title": "Practice 2: True or false statements", "content": "Quyết định đúng (True) hay sai (False), rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "truefalse", "question": "1. In mammals, the fertilization process occurs out side the body. (Ở động vật có vú, quá trình thụ tinh xảy ra bên ngoài cơ thể.)", "answer": "false", "explain": "Sai: động vật có vú thụ tinh trong (internal fertilization), tinh trùng gặp trứng trong vòi trứng."}, {"type": "question", "qType": "truefalse", "question": "2. In aquatic animal, (except aquatic mammals e.g. whale) fertilization occur out side the body. (Ở động vật thủy sinh (trừ thú biển như cá voi), thụ tinh xảy ra bên ngoài cơ thể.)", "answer": "true", "explain": "Đúng với phần lớn: loài thụ tinh ngoài là loài sống dưới nước (một số ngoại lệ như cá mập thụ tinh trong)."}, {"type": "question", "qType": "truefalse", "question": "3. With the advanced technologies, it is possible to fertilize the eggs in vitro. (Nhờ công nghệ tiên tiến, có thể thụ tinh trứng trong ống nghiệm.)", "answer": "true", "explain": "Đúng: thụ tinh trong ống nghiệm (IVF) là công nghệ sinh sản hiện đại."}, {"type": "question", "qType": "truefalse", "question": "4. The castrated animals could produce sperm cells. (Động vật bị thiến vẫn có thể tạo tinh trùng.)", "answer": "false", "explain": "Sai: tinh trùng được tạo ra ở tinh hoàn; thiến là lấy tinh hoàn đi nên không còn sinh tinh."}, {"type": "question", "qType": "truefalse", "question": "5. Artificial Insemination technique (AI) is common used in pig production. (Kỹ thuật thụ tinh nhân tạo (AI) được dùng phổ biến trong chăn nuôi heo.)", "answer": "true", "explain": "Đúng: thụ tinh nhân tạo rất phổ biến trong chăn nuôi heo."}, {"type": "content", "title": "IV. Assignment", "content": "Từ toàn bộ thông tin trên, hãy viết một đoạn ngắn (khoảng 50 từ) tóm tắt về sinh sản động vật cơ bản. Học thuộc toàn bộ từ vựng."}], "rev": 1, "prev": 1}, {"id": 5, "title": "Y học thú y", "sub": "Veterinary Medicine", "color": "#6BBAB5", "reading": [{"en": "Veterinary medicine is a scientific branch focusing on pathogens, pathogenesis, changes in the cells, organs, and in the whole animal body when pathogens invaded.", "vi": "Thú y học là một ngành khoa học tập trung nghiên cứu mầm bệnh, cơ chế sinh bệnh, và những biến đổi ở tế bào, cơ quan và toàn bộ cơ thể động vật khi mầm bệnh xâm nhập."}, {"en": "Its researches and experiments are mostly on the diagnostic scheme, effective treatments and prevention in order to protect the animals from diseases thus increase the economic efficiency of animal production.", "vi": "Các nghiên cứu và thí nghiệm của ngành chủ yếu về quy trình chẩn đoán, phương pháp điều trị hiệu quả và phòng bệnh nhằm bảo vệ vật nuôi khỏi bệnh tật, qua đó tăng hiệu quả kinh tế của chăn nuôi."}, {"en": "It also greatly contributed to the development of the animal production sector and community health protection.", "vi": "Ngành này cũng đóng góp rất lớn cho sự phát triển của lĩnh vực chăn nuôi và việc bảo vệ sức khỏe cộng đồng."}, {"en": "Veterinary science is vital to the study and protection of animal production practices, herd health and monitoring the spread of disease.", "vi": "Khoa học thú y có vai trò sống còn trong việc nghiên cứu và bảo vệ các thực hành chăn nuôi, sức khỏe đàn vật nuôi và giám sát sự lây lan của dịch bệnh."}, {"en": "It requires the acquisition and application of scientific knowledge in multiple disciplines and uses technical skills directed at disease prevention in both domestic and wild animals.", "vi": "Nó đòi hỏi việc tiếp thu và vận dụng kiến thức khoa học ở nhiều lĩnh vực và sử dụng các kỹ năng kỹ thuật hướng tới phòng bệnh cho cả động vật nuôi và động vật hoang dã."}, {"en": "Veterinary science helps safeguard human health through the careful monitoring of livestock, companion animal and wildlife health.", "vi": "Khoa học thú y góp phần bảo vệ sức khỏe con người thông qua việc giám sát cẩn thận sức khỏe của vật nuôi, thú cưng và động vật hoang dã."}, {"en": "Emerging zoonotic diseases around the globe require capabilities in epidemiology and infectious disease surveillance (by means of quantitative parasitology) and control that are particularly well-suited to veterinary science's “herd health” approach.", "vi": "Các bệnh lây từ động vật sang người đang nổi lên trên toàn cầu đòi hỏi năng lực về dịch tễ học, giám sát và kiểm soát bệnh truyền nhiễm (bằng ký sinh trùng học định lượng), rất phù hợp với cách tiếp cận “sức khỏe đàn” của khoa học thú y."}, {"en": "Veterinary medicine is informally as old as the human/animal bond but in recent years has expanded exponentially because of the availability of advanced diagnostic and therapeutic techniques for most species.", "vi": "Thú y học có thể nói là lâu đời như mối gắn bó giữa con người và động vật, nhưng những năm gần đây đã phát triển vượt bậc nhờ có các kỹ thuật chẩn đoán và điều trị tiên tiến cho hầu hết các loài."}, {"en": "Animals nowadays often receive advanced medical, dental, and surgical care including insulin injections, root canals, hip replacements, cataract extractions, and pacemakers.", "vi": "Ngày nay động vật thường được chăm sóc y tế, nha khoa và phẫu thuật tiên tiến, gồm tiêm insulin, điều trị tủy răng, thay khớp háng, phẫu thuật đục thủy tinh thể và đặt máy tạo nhịp tim."}, {"en": "Veterinary specialization has become more common in recent years.", "vi": "Sự chuyên khoa hóa trong thú y ngày càng phổ biến trong những năm gần đây."}, {"en": "Currently 20 veterinary specialties are recognized by the American Veterinary Medical Association (AVMA), including anesthesiology, behavior, dermatology, emergency and critical care, internal medicine, cardiology, oncology, neurology, radiology and surgery.", "vi": "Hiện có 20 chuyên khoa thú y được Hiệp hội Thú y Hoa Kỳ (AVMA) công nhận, gồm gây mê, hành vi, da liễu, cấp cứu và hồi sức, nội khoa, tim mạch, ung thư học, thần kinh, chẩn đoán hình ảnh và phẫu thuật."}, {"en": "In order to become a specialist, a veterinarian must complete additional training after graduation from veterinary school in the form of an internship and residency and then pass a rigorous examination.", "vi": "Để trở thành bác sĩ chuyên khoa, bác sĩ thú y phải hoàn thành thêm chương trình đào tạo sau khi tốt nghiệp trường thú y, dưới hình thức thực tập và nội trú, rồi vượt qua một kỳ thi nghiêm ngặt."}, {"en": "Veterinarians assist in ensuring the quality, quantity, and security of food supplies by working to maintain the health of livestock and inspecting the meat itself.", "vi": "Bác sĩ thú y góp phần bảo đảm chất lượng, số lượng và an ninh nguồn cung thực phẩm bằng cách duy trì sức khỏe vật nuôi và kiểm tra chính thịt."}, {"en": "Veterinary scientists occupy important positions in biological, chemical, agricultural and pharmaceutical research.", "vi": "Các nhà khoa học thú y giữ những vị trí quan trọng trong nghiên cứu sinh học, hóa học, nông nghiệp và dược phẩm."}], "extra": [], "vocab": [["Veterinary", "/ˈvet.ər.ɪ.nər.i/", "(thuộc) thú y"], ["Medicine", "/ˈmed.ɪ.sən/", "Y học, Y khoa, thuốc"], ["Diagnostic", "/ˌdaɪ.əɡˈnɒs.tɪk/", "Chẩn đoán (adj); triệu chứng (n)"], ["Therapeutic", "/ˌθer.əˈpjuː.tɪk/", "Chữa bệnh"], ["Domestic", "/dəˈmes.tɪk/", "Thuộc gia đình"], ["Exotic", "/ɪɡˈzɒt.ɪk/", "Ở nước ngoài đưa vào"], ["Wildlife", "/ˈwaɪld.laɪf/", "Thú vật hoang dã"], ["Vital", "/ˈvaɪ.təl/", "Sống còn, quan trọng"], ["Protection", "/prəˈtek.ʃən/", "Sự bảo vệ"], ["Disease", "/dɪˈziːz/", "Bệnh tật"], ["Epidemiology", "/ˌep.ɪ.diː.miˈɒl.ə.dʒi/", "Dịch tễ học"], ["Cataract", "/ˈkæt.ər.ækt/", "Bệnh đục thủy tinh thể"], ["Anesthetic", "/ˌæn.əsˈθet.ɪk/", "Gây mê"], ["Dermatology", "/ˌdɜː.məˈtɒl.ə.dʒi/", "Bệnh ngoài da"], ["Cardiology", "/ˌkɑː.diˈɒl.ə.dʒi/", "Khoa tim mạch"], ["Oncology", "/ɒŋˈkɒl.ə.dʒi/", "Ung thư học"], ["Neurology", "/njʊəˈrɒl.ə.dʒi/", "Khoa thần kinh học"], ["Radiology", "/ˌreɪ.diˈɒl.ə.dʒi/", "Phóng xạ (X quang)"], ["Surgery", "/ˈsɜː.dʒər.i/", "Phẫu thuật"], ["Rigorous", "/ˈrɪɡ.ər.əs/", "Nghiêm khắc"]], "practice": [{"type": "content", "title": "Practice 1: Answer the following questions", "content": "Trả lời các câu hỏi sau dựa vào bài đọc, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "open", "question": "1. Why is it important to study on medicine and diseases in animal production? (Vì sao việc nghiên cứu thuốc và bệnh tật trong chăn nuôi lại quan trọng?)", "answer": "Because it protects animals from diseases and so increases the economic efficiency of animal production; it also contributes to the development of the sector and to community health protection. – Vì nó bảo vệ vật nuôi khỏi bệnh, nhờ đó tăng hiệu quả kinh tế chăn nuôi, đồng thời góp phần phát triển ngành và bảo vệ sức khỏe cộng đồng."}, {"type": "question", "qType": "open", "question": "2. What does veterinary science do to help on improving human and animal health? (Khoa học thú y làm gì để cải thiện sức khỏe con người và động vật?)", "answer": "It monitors the health of livestock, companion animals and wildlife, works on disease prevention, and applies epidemiology and infectious disease surveillance and control to emerging zoonotic diseases. – Nó giám sát sức khỏe vật nuôi, thú cưng và động vật hoang dã, phòng bệnh, và vận dụng dịch tễ học, giám sát và kiểm soát bệnh truyền nhiễm đối với các bệnh lây từ động vật sang người."}, {"type": "question", "qType": "open", "question": "3. What made veterinary science develop rapidly in recent years? (Điều gì khiến khoa học thú y phát triển nhanh trong những năm gần đây?)", "answer": "The availability of advanced diagnostic and therapeutic techniques for most species. – Sự sẵn có của các kỹ thuật chẩn đoán và điều trị tiên tiến cho hầu hết các loài."}, {"type": "question", "qType": "open", "question": "4. How many veterinary specialties are there? And what are they? (Có bao nhiêu chuyên khoa thú y? Đó là những chuyên khoa nào?)", "answer": "There are 20 specialties recognized by the AVMA, including anesthesiology, behavior, dermatology, emergency and critical care, internal medicine, cardiology, oncology, neurology, radiology and surgery. – Có 20 chuyên khoa được AVMA công nhận, gồm gây mê, hành vi, da liễu, cấp cứu và hồi sức, nội khoa, tim mạch, ung thư học, thần kinh, chẩn đoán hình ảnh và phẫu thuật."}, {"type": "question", "qType": "open", "question": "5. What do Veterinarians do to ensure the quality, quantity, and security of food supplies? (Bác sĩ thú y làm gì để bảo đảm chất lượng, số lượng và an ninh nguồn cung thực phẩm?)", "answer": "They work to maintain the health of livestock and inspect the meat itself. – Họ duy trì sức khỏe vật nuôi và kiểm tra chính thịt."}, {"type": "content", "title": "Practice 2: True or False statement", "content": "Quyết định đúng (True) hay sai (False), rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "truefalse", "question": "1. Veterinary medicine is the application of medical, diagnostic and therapeutic principles to men. (Thú y học là việc áp dụng các nguyên tắc y học, chẩn đoán và điều trị cho con người.)", "answer": "false", "explain": "Sai: thú y học áp dụng cho động vật, không phải cho con người."}, {"type": "question", "qType": "truefalse", "question": "2. Veterinary science studies and protects animals, herd health and monitoring the spread of disease. (Khoa học thú y nghiên cứu và bảo vệ động vật, sức khỏe đàn và giám sát sự lây lan dịch bệnh.)", "answer": "true", "explain": "Đúng: bài đọc nói khoa học thú y “vital to the study and protection of animal production practices, herd health and monitoring the spread of disease”."}, {"type": "question", "qType": "truefalse", "question": "3. Veterinary science only focuses on protection of wild animals. (Khoa học thú y chỉ tập trung bảo vệ động vật hoang dã.)", "answer": "false", "explain": "Sai: phòng bệnh cho cả động vật nuôi (domestic) và động vật hoang dã (wild)."}, {"type": "question", "qType": "truefalse", "question": "4. Veterinarian must complete additional training after graduation from veterinary school in the form of an internship and residency and then pass a rigorous examination. (Bác sĩ thú y phải hoàn thành đào tạo bổ sung sau khi tốt nghiệp (thực tập, nội trú) rồi vượt qua kỳ thi nghiêm ngặt.)", "answer": "true", "explain": "Đúng: đây là điều kiện để trở thành bác sĩ chuyên khoa (specialist) theo bài đọc."}, {"type": "question", "qType": "truefalse", "question": "5. Animals in general have never received advanced medical, dental, and surgical care. (Nhìn chung động vật chưa từng được chăm sóc y tế, nha khoa, phẫu thuật tiên tiến.)", "answer": "false", "explain": "Sai: ngày nay động vật thường được chăm sóc tiên tiến như tiêm insulin, điều trị tủy răng, thay khớp háng, phẫu thuật đục thủy tinh thể, đặt máy tạo nhịp tim."}, {"type": "content", "title": "Practice 3: Fill in the blank the most appropriate word(s)", "content": "Chọn đáp án thích hợp nhất để điền vào chỗ trống, rồi bấm 👁 Xem gợi ý để đối chiếu."}, {"type": "question", "qType": "choice", "question": "1. A veterinarian should be in multiple disciplines in order to work with diseases ……… in both domestic and wild animals. (Bác sĩ thú y nên có kiến thức nhiều lĩnh vực để làm việc với bệnh ……… ở cả động vật nuôi và hoang dã.)", "options": ["A. Prevention and treatment", "B. Spreading and shedding", "C. Collection and isolation", "D. All are correct."], "answer": 0}, {"type": "question", "qType": "choice", "question": "2. Veterinary science monitors of livestock, companion animal and wildlife ……, thus, it will helps safeguard human ……… (Khoa học thú y giám sát vật nuôi, thú cưng và động vật hoang dã, nhờ đó bảo vệ ……… con người.)", "options": ["A. Colours", "B. Size", "C. Health", "D. Behavior"], "answer": 2}, {"type": "question", "qType": "choice", "question": "3. One of the common veterinary specialties is focusing on the skin diseases so called ……… (Một chuyên khoa thú y phổ biến tập trung vào các bệnh ngoài da gọi là ………)", "options": ["A. Neurology", "B. Cardiology", "C. Ontology", "D. Dermatology"], "answer": 3}, {"type": "question", "qTy function cleanForSpeech(text){
 if(!text) return '';
 // Remove content inside parentheses () and brackets [] including the brackets
 // e.g. "Production (n)" -> "Production", "Significant (adj)" -> "Significant"
 let cleaned = text.replace(/\s*\([^)]*\)/g, '').replace(/\s*\[[^\]]*\]/g, '').trim();
 // Also remove extra spaces
 cleaned = cleaned.replace(/\s{2,}/g, ' ').trim();
 // If after cleaning empty, fallback to original without parentheses symbols
 if(!cleaned) cleaned = text.replace(/[()\[\]]/g, '').trim();
 return cleaned;
}

// Bọc từng từ của 1 phần tử thành <span class="word">, ghi lại vị trí ký tự trong chuỗi đọc
function wrapWords(el, text, spans){
 const raw=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
 if(!raw) return text;
 karaokeEls.push({el, html:el.innerHTML});
 el.textContent='';
 raw.split(' ').forEach((w,i)=>{
  if(i>0){ el.appendChild(document.createTextNode(' ')); text+=' '; }
  const sp=document.createElement('span'); sp.className='word'; sp.textContent=w; el.appendChild(sp);
  spans.push({span:sp, start:text.length}); text+=w;
 });
 el.classList.add('highlight-mode');
 return text;
}

 enEls.forEach((el,i)=>{

  enText=wrapWords(el,enText,enSpans);

// Chia đoạn dài thành câu ngắn (tránh lỗi Chrome tự ngắt khi đọc đoạn dài)
function chunkText(text){
 const pieces=[]; let last=0; const re=/[.!?;:,](\s+)/g; let m;
 while((m=re.exec(text))){ const end=m.index+1+m[1].length; pieces.push([last,end,text[m.index]]); last=end; }
 if(last<text.length) pieces.push([last,text.length,'']);
 const chunks=[]; let st=null;
 pieces.forEach(([a,b,p])=>{ if(st===null) st=a; const len=b-st; if((/[.!?;:]/.test(p) && len>=60) || len>=180 || p===''){ chunks.push([st,b]); st=null; } });
 if(st!==null) chunks.push([st,text.length]);
 return chunks.filter(([a,b])=>text.slice(a,b).trim());
}
function markPos(pt, ci){

 if(ci>=pt.text.length) k=sp.length;
 if(k===pt.k) return; pt.k=k;
 sp.forEach((s,i)=>{ s.span.classList.toggle('read',i<k); s.span.classList.toggle('active',i===k); });
 const cur=sp[k]; if(!cur) return;
 const box=document.getElementById('mainContent'); const r=cur.span.getBoundingClientRect(); const br0=box.getBoundingClientRect(); const mob=isMobileLayout(); const topOff=mob? (document.getElementById('topBar').offsetHeight+document.getElementById('audioBar').offsetHeight-90) : 0; const br={top:Math.max(br0.top,0)+topOff, bottom:Math.min(br0.bottom, innerHeight)};
 if(r.top<br.top+90 || r.bottom>br.bottom-40) cur.span.scrollIntoView({behavior:'smooth',block:'center'});
}

function speakParts(parts, onEnd){
 const sid=++speechSession;
 const queue=[]; parts.forEach(pt=>chunkText(pt.text).forEach(([a,b])=>queue.push({pt,a,b})));
 let qi=0;
 function finish(){
  stopKTimer();
  parts.forEach(pt=>pt.spans.forEach(x=>{ x.span.classList.remove('active'); x.span.classList.add('read'); }));
  setTimeout(()=>{ if(sid===speechSession) clearHighlight(); },700);
  if(onEnd) onEnd(); else resetPlayBtn();
 }
 function next(){
  if(sid!==speechSession) return;
  if(qi>=queue.length){ finish(); return; }
  const q=queue[qi++];
  const u=new SpeechSynthesisUtterance(q.pt.text.slice(q.a,q.b));
  setVoice(u,q.pt.lang); u.rate=rate;
  let gotBoundary=false;
  u.onstart=()=>{
   if(sid!==speechSession) return;
   const pi=parts.indexOf(q.pt); parts.forEach((pt,j)=>{ if(j<pi) markPos(pt,Infinity); });
   markPos(q.pt,q.a); stopKTimer();
   // Dự phòng: giọng nào không báo vị trí từ (VD giọng Google online) thì tự ước lượng theo thời gian
   const cps=(q.pt.lang==='vi'?13:14.5)*rate; let start=performance.now(), lastT=start;
   kTimer=setInterval(()=>{
    const now=performance.now(); if(synth.paused) start+=now-lastT; lastT=now;
    if(gotBoundary || synth.paused) return;
    markPos(q.pt, Math.min(q.a+Math.floor((now-start)/1000*cps), q.b-1));
   },90);
  };
  u.onboundary=e=>{ if(sid!==speechSession) return; if(e.name && e.name!=='word') return; gotBoundary=true; markPos(q.pt, q.a+e.charIndex); };
  u.onend=()=>{ if(sid!==speechSession) return; stopKTimer(); next(); };
  u.onerror=e=>{ if(sid!==speechSession) return; stopKTimer(); if(e.error==='interrupted'||e.error==='canceled') return; next(); };
  keepUtt=[u]; synth.speak(u);
 }
 next();
}

importInput.onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(Array.isArray(parsed) && parsed.length>0){
        // Ghi đè lessons
        for(let i=0;i<Math.min(parsed.length, lessons.length);i++){
          if(parsed[i].reading) lessons[i].reading=parsed[i].reading;
          if(parsed[i].vocab) lessons[i].vocab=parsed[i].vocab;
          if(parsed[i].practice) lessons[i].practice=parsed[i].practice;
          if(parsed[i].extra) lessons[i].extra=parsed[i].extra;
          if(parsed[i].hard) lessons[i].hard=parsed[i].hard;
        }
        saveLessons(); renderAll();
        const t=document.createElement('div'); t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#8CB580] text-black px-4 py-2 rounded-full text-sm font-medium shadow-lg z-50'; t.textContent='✅ Đã nhập lại dữ liệu từ JSON'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
      }
    }catch(err){ alert('File JSON lỗi: '+err.message); }
  };
  reader.readAsText(file);
};

// ===== Tìm nghĩa tiếng Việt tương ứng trong câu dịch =====
const PairHL=(function(){
 const L=/\p{L}/u;
 const norm=t=>cleanForSpeech(String(t||'')).toLowerCase().replace(/[’']/g,"'").replace(/^[^\p{L}\d]+|[^\p{L}\d%]+$/gu,'').trim();
 function forms(w){ const f=new Set([w]); [[/ies$/,'y'],[/es$/,''],[/s$/,''],[/ied$/,'y'],[/ed$/,''],[/ed$/,'e'],[/d$/,''],[/ing$/,''],[/ing$/,'e'],[/ly$/,''],[/'s$/,'']].forEach(([r,x])=>{ if(r.test(w)) f.add(w.replace(r,x)); }); return [...f]; }
 function vocabMap(){ const m=new Map(); lessons.forEach(ll=>['vocab','extra'].forEach(k=>(ll[k]||[]).forEach(r=>{ const key=norm(r[0]); if(key && r[2]) { if(!m.has(key)) m.set(key,[]); m.get(key).push(r[2]); } }))); return m; }
 function splitMeaning(mn){ const out=[]; String(mn).split(/[,;\/]|\.\s|\bhoặc\b/).forEach(p=>{ p=p.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); if(!p) return; out.push(p); const q=p.replace(/^(sự|tính|việc|các|những|của)\s+/i,''); if(q!==p && q) out.push(q); }); return out; }
 // trả về [{en, means:[chuỗi hiển thị], cands:[chuỗi tìm trong câu TV]}]
 function lookup(txt){
  const vm=vocabMap(); const res=[];
  const get=k=>{ for(const f of forms(k)){ const v=vm.get(f), g=GLOSS[f]; if(v||g) return {means:v||[], gl:g||[]}; } return null; };
  const phrase=norm(txt); const words=phrase.split(/\s+/).filter(Boolean);
  const whole=get(phrase);
  if(whole) res.push({en:txt.trim(), means:whole.means.length?whole.means:whole.gl, cands:[...whole.gl, ...whole.means.flatMap(splitMeaning)]});
  if(!whole){
   for(let i=0;i<words.length;i++){
    let hit=null;
    if(i+1<words.length){ const two=get(words[i]+' '+words[i+1]); if(two){ hit={en:words[i]+' '+words[i+1], r:two}; } }
    if(!hit){ const one=get(words[i]); if(one) hit={en:words[i], r:one}; }
    if(!hit) continue;
    if(hit.en.includes(' ')) i++;
    if(whole && norm(hit.en)===phrase) continue;
    res.push({en:hit.en, means:hit.r.means.length?hit.r.means:hit.r.gl, cands:[...hit.r.gl, ...hit.r.means.flatMap(splitMeaning)]});
   }
  }
  return res;
 }
 function findRanges(text, cands){
  const low=text.toLowerCase(); const taken=[];
  const uniq=[...new Set(cands.map(c=>c.toLowerCase().trim()).filter(c=>c.length>=1))].sort((a,b)=>b.length-a.length);
  uniq.forEach(c=>{ let from=0, i;
   while((i=low.indexOf(c,from))>=0){ const e=i+c.length; from=i+1;
    const okB=(i===0 || !L.test(low[i-1])) && (e>=low.length || !L.test(low[e]) || !L.test(c[c.length-1]));
    if(!okB) continue;
    if(taken.some(([a,b])=>i<b && e>a)) continue;
    taken.push([i,e]); break; } });
  return taken;
 }
 // mỗi từ TA chỉ sáng 1 cụm TV (ưu tiên cụm dài nhất tìm thấy)
 function findGroups(text, groups){
  const all=[]; groups.slice().sort((a,b)=>Math.max(0,...b.map(c=>c.length))-Math.max(0,...a.map(c=>c.length))).forEach(g=>{
   const sorted=[...new Set(g.map(c=>c.toLowerCase().trim()).filter(Boolean))].sort((a,b)=>b.length-a.length);
   for(const c of sorted){ const r=findRanges(text,[c]).filter(([i,e])=>!all.some(([a,b])=>i<b && e>a)); if(r.length){ all.push(r[0]); break; } }
  });
  return all;
 }
 let marks=[];
 function clear(){ try{ if(window.CSS && CSS.highlights) CSS.highlights.delete('pair-mean'); }catch(e){} marks.forEach(m=>{ if(m.isConnected){ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); } }); marks=[]; }
 function toRanges(el, spans){
  const nodes=[]; const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n, pos=0;
  while((n=w.nextNode())){ nodes.push([n,pos,pos+n.data.length]); pos+=n.data.length; }
  const at=off=>{ for(const [nd,a,b] of nodes) if(off>=a && off<=b) return [nd,off-a]; return null; };
  return spans.map(([a,b])=>{ const s=at(a), e=at(b); if(!s||!e) return null; const r=document.createRange(); r.setStart(s[0],s[1]); r.setEnd(e[0],e[1]); return r; }).filter(Boolean);
 }
 function paint(el, spans){
  if(!el || !spans.length) return 0;
  const ranges=toRanges(el, spans);
  if(window.CSS && CSS.highlights && window.Highlight){ CSS.highlights.set('pair-mean', new Highlight(...ranges)); }
  else ranges.reverse().forEach(r=>{ const m=document.createElement('mark'); m.className='pair-mean'; try{ r.surroundContents(m); marks.push(m); }catch(e){} });
  return ranges.length;
 }
 // EN → sáng chữ TV
 function fromEnglish(card, txt){
  clear(); const items=lookup(txt); const vie=card.querySelector('.vie');
  let n=0; if(vie){ n=paint(vie, findGroups(vie.textContent, items.map(x=>x.cands))); }
  return {items, found:n};
 }
 // TV → sáng chữ TA
 function fromVietnamese(card, txt){
  clear(); const q=txt.toLowerCase().trim(); if(!q) return {items:[],found:0};
  const vm=vocabMap(); const keys=new Set();
  Object.entries(GLOSS).forEach(([k,arr])=>{ if(arr.some(c=>c.toLowerCase()===q || (q.length>3 && c.toLowerCase().includes(q)) || (c.length>3 && q.includes(c.toLowerCase())))) keys.add(k); });
  vm.forEach((arr,k)=>{ if(arr.some(m=>splitMeaning(m).some(c=>{ c=c.toLowerCase(); return c===q || (c.length>3 && q.includes(c)); }))) keys.add(k); });
  const els=[...card.querySelectorAll('.numbered-title, .eng')]; let found=0; const items=[];
  els.forEach(el=>{ const text=el.textContent; const spans=[];
   [...keys].sort((a,b)=>b.length-a.length).forEach(k=>{ const re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/(y|e)$/,'$1?')+'(s|es|ed|d|ing|ies|ied|ly)?\\b','i'); const m=re.exec(text); if(m && !spans.some(([a,b])=>m.index<b && m.index+m[0].length>a)){ spans.push([m.index,m.index+m[0].length]); items.push({en:m[0], means:[txt]}); } });
   if(spans.length){ if(found===0) found+=paint(el,spans); else { /* chỉ hỗ trợ 1 phần tử khi dùng Highlight API */ const prev=CSS.highlights&&CSS.highlights.get('pair-mean'); const r=toRanges(el,spans); if(prev){ r.forEach(x=>prev.add(x)); found+=r.length; } } }
  });
  return {items, found};
 }
 return {fromEnglish, fromVietnamese, clear};
})();

// ===== Bôi đen chữ trong bài đọc → Thêm vào từ vựng / Đọc từ này =====
(function(){
 const pop=document.createElement('div'); pop.id='selPop'; document.body.appendChild(pop);
 let cur=null, formMode=false, timer=null;
 const hide=()=>{ pop.style.display='none'; formMode=false; cur=null; PairHL.clear(); };
 function readSel(){
  const sel=window.getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const txt=sel.toString().replace(/\s+/g,' ').trim(); if(!txt || txt.length>200) return null;
  const n=sel.anchorNode; const el=n && (n.nodeType===1? n : n.parentElement);
  if(!el || !el.closest('#contentArea [data-ridx]') || isEdit || currentTab!=='reading') return null;
  const rect=sel.getRangeAt(0).getBoundingClientRect();
  return {txt, isVi:!!el.closest('.vie'), rect, card:el.closest('#contentArea [data-ridx]')};
 }
 function place(){
  const r=cur.rect, w=pop.offsetWidth, h=pop.offsetHeight;
  // đặt khung dưới cả câu dịch để không che chữ TV đang sáng
  const vie=cur.card&&cur.card.querySelector('.vie'); const vb=vie? vie.getBoundingClientRect() : r;
  const below=Math.max(r.bottom, cur.isVi? r.bottom : vb.bottom)+10;
  let top=below; if(top+h>innerHeight-8){ top=Math.min(r.top, cur.isVi? r.top : r.top)-h-10; if(top<8) top=Math.max(8, innerHeight-h-8); }
  const left=Math.min(Math.max(8, r.left+r.width/2-w/2), innerWidth-w-8);
  pop.style.top=top+'px'; pop.style.left=left+'px';
 }
 const cleanTerm=t=>t.replace(/^[\s"'“”‘’(\[]+|[\s"'“”‘’.,;:!?)\]]+$/g,'');
 function findExisting(term){
  const k=cleanForSpeech(term).toLowerCase(); if(!k) return null;
  for(const ll of lessons) for(const key of ['vocab','extra']) for(const r of (ll[key]||[])) if(cleanForSpeech(r[0]).toLowerCase()===k) return {ll, r, key};
  return null;
 }
 function showMenu(){
  formMode=false;
  const pr=cur.isVi? PairHL.fromVietnamese(cur.card, cur.txt) : PairHL.fromEnglish(cur.card, cur.txt);
  cur.items=pr.items;
  pop.innerHTML=`<div class="sp-word"></div><div class="sp-mean"></div>
   <button class="sp-btn pri" data-a="add">➕ Thêm vào danh sách từ vựng</button>
   <button class="sp-btn" data-a="speak">🔊 Đọc ${cur.isVi?'đoạn':'từ'} này</button>`;
  pop.querySelector('.sp-word').textContent='“'+cur.txt+'”';
  const mb=pop.querySelector('.sp-mean');
  if(!cur.isVi && pr.items.length){
   mb.innerHTML=pr.items.slice(0,4).map(x=>'<b>'+escHtml(x.en)+'</b>: '+escHtml([...new Set(x.means)].slice(0,2).join(' / '))).join('<br>')+(pr.found?'':'<div class="sp-note" style="margin-top:2px">Không thấy đúng chữ này trong câu dịch bên dưới</div>');
  }else if(cur.isVi && pr.items.length){
   mb.innerHTML='Tiếng Anh: '+[...new Set(pr.items.map(x=>'<b>'+escHtml(x.en)+'</b>'))].join(', ');
  }else{
   mb.innerHTML='<span class="sp-note">Chưa có nghĩa trong từ điển – bấm ➕ để thêm, lần sau sẽ tự sáng chữ tương ứng</span>';
  }
  pop.style.display='block'; place();
 }
 function showForm(){
  formMode=true;
  const term=cur.isVi?((cur.items&&cur.items[0]&&cur.items[0].en)||''):cleanTerm(cur.txt);
  const mean=cur.isVi?cleanTerm(cur.txt):((cur.items&&cur.items.length===1&&cur.items[0].means[0])||'');
  const ex=term? findExisting(term):null;
  pop.innerHTML=`<div class="sp-word">➕ Thêm từ mới vào Bài ${lessons[currentLesson].id}</div>
   <input data-f="0" placeholder="Thuật ngữ tiếng Anh">
   <input data-f="1" placeholder="Phiên âm (không bắt buộc)">
   <input data-f="2" placeholder="Nghĩa tiếng Việt">
   <div class="sp-note sp-ex"></div>
   <div style="display:flex;gap:6px"><button class="sp-btn" data-a="cancel" style="justify-content:center">Hủy</button><button class="sp-btn pri" data-a="save" style="justify-content:center">💾 Lưu</button></div>`;
  const ins=pop.querySelectorAll('input'); ins[0].value=term; ins[2].value=mean;
  if(ex){ pop.querySelector('.sp-ex').textContent='⚠️ Đã có trong Bài '+ex.ll.id+(ex.key==='extra'?' (Từ bổ sung)':'')+': '+(ex.r[2]||'(chưa có nghĩa)'); }
  ins.forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } if(e.key==='Escape') hide(); }));
  place(); (!term? ins[0] : (mean? ins[1] : ins[2])).focus({preventScroll:true});
 }
 function save(){
  const v=[...pop.querySelectorAll('input')].map(i=>i.value.trim());
  if(!v[0]){ pop.querySelector('input').focus(); return; }
  const l=lessons[currentLesson]; if(!Array.isArray(l.vocab)) l.vocab=[];
  l.vocab.unshift([v[0],v[1],v[2]]);
  if(Array.isArray(l.hard)) l.hard=l.hard.map(h=>h+1);
  saveLessons(); renderLessonList(); hide();
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  toast('✅ Đã thêm "'+v[0]+'" vào Từ vựng Bài '+l.id);
 }
 pop.addEventListener('mousedown',e=>{ if(e.target.tagName!=='INPUT') e.preventDefault(); });
 pop.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||!cur) return; const a=b.dataset.a;
  if(a==='add') showForm();
  else if(a==='speak'){ isPlayingAll=false; resetPlayBtn(); speakText(cleanForSpeech(cleanTerm(cur.txt))||cur.txt, cur.isVi?'vi':'en'); }
  else if(a==='save') save();
  else if(a==='cancel') hide();
 });
 function check(){ if(formMode) return; const s=readSel(); if(s){ cur=s; showMenu(); } else if(pop.style.display==='block') hide(); }
 const later=d=>{ clearTimeout(timer); timer=setTimeout(check,d); };
 document.addEventListener('mouseup',e=>{ if(!pop.contains(e.target)) later(10); });
 document.addEventListener('touchend',e=>{ if(!pop.contains(e.target)) later(350); });
 document.addEventListener('selectionchange',()=>{ if(!formMode) later(450); });
 document.addEventListener('mousedown',e=>{ if(!pop.contains(e.target) && formMode) hide(); });
 document.addEventListener('touchstart',e=>{ if(!pop.contains(e.target) && formMode) hide(); },{passive:true});
 document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
 window.addEventListener('scroll',()=>{ if(!formMode && pop.style.display==='block' && isMobileLayout()) hide(); },{passive:true});
 document.getElementById('mainContent').addEventListener('scroll',()=>{ if(!formMode && pop.style.display==='block') hide(); },{passive:true});
})();

(function(){
 const b=document.getElementById('viToggle');
 const paint=()=>{ b.textContent='🇻🇳 Đọc cả TV: '+(readVi?'Bật':'Tắt'); b.className='px-3 py-1 rounded-full text-xs '+(readVi?'bg-[#FACC15] text-black font-bold':'bg-[#2A2A2A]'); };
 paint();
 b.onclick=()=>{ readVi=!readVi; try{localStorage.setItem('avcn_readvi',readVi?'1':'0');}catch(e){} paint();
  if(readVi && voices.length && !voices.some(v=>/^vi/i.test(v.lang))) toast('⚠️ Máy chưa có giọng đọc tiếng Việt – hãy dùng Microsoft Edge hoặc cài giọng Việt','#FACC15'); };
})();
// ===== Điện thoại / iPad: menu bài học dạng ngăn kéo, menu ⋯, chiều cao thanh dính =====
(function(){
 const body=document.body, act=document.getElementById('actionBar');
 const closeDrawer=()=>body.classList.remove('drawer-open');
 document.getElementById('menuBtn').onclick=()=>{ act.classList.remove('open'); body.classList.toggle('drawer-open'); };
 document.getElementById('drawerBg').onclick=closeDrawer;
 document.getElementById('lessonList').addEventListener('click',()=>{ if(isMobileLayout()) setTimeout(closeDrawer,50); });
 document.getElementById('searchAll').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.target.blur(); closeDrawer(); } });
 document.getElementById('moreBtn').onclick=e=>{ e.stopPropagation(); act.classList.toggle('open'); };
 act.addEventListener('click',()=>{ if(innerWidth<1280) setTimeout(()=>act.classList.remove('open'),150); });
 document.addEventListener('click',e=>{ if(act.classList.contains('open') && !act.contains(e.target) && e.target.id!=='moreBtn') act.classList.remove('open'); });
 const lbl=document.getElementById('curLesson');
 const updLbl=()=>{ const l=lessons[currentLesson]; lbl.innerHTML=''; lbl.textContent='Bài '+l.id+': '+l.title; const sm=document.createElement('small'); sm.textContent=l.sub; lbl.appendChild(sm); };
 const _rll=renderLessonList; renderLessonList=function(){ _rll.apply(this,arguments); updLbl(); };
 const setVars=()=>{ const tb=document.getElementById('topBar'), ab=document.getElementById('audioBar');
  document.documentElement.style.setProperty('--tbh', tb.offsetHeight+'px');
  document.documentElement.style.setProperty('--abh', (ab && ab.offsetParent? ab.offsetHeight:0)+'px'); };
 if(window.ResizeObserver){ const ro=new ResizeObserver(setVars); ro.observe(document.getElementById('topBar')); ro.observe(document.getElementById('audioBar')); }
 window.addEventListener('resize',()=>{ setVars(); if(!isMobileLayout()){ closeDrawer(); } if(innerWidth>=1280) act.classList.remove('open'); });
 setVars();
})();
