<script>
const lessons = [{"id": 1, "title": "Tổng quan về khoa học vật nuôi", "sub": "Overview of Animal Sciences", "color": "#8CB580", "reading": [{"en": "Animal agriculture is a significant portion of agriculture production.", "vi": "Ngành chăn nuôi động vật chiếm một phần quan trọng trong sản lượng nông nghiệp."}, {"en": "Related research, education, and extension activities are continually changing to address new challenges and opportunities brought about by rapidly advancing technologies, evolving consumer demand, and the need to make positive contributions to environmental, human, and animal health.", "vi": "Các hoạt động nghiên cứu, giáo dục và khuyến nông liên quan liên tục thay đổi để giải quyết những thách thức và cơ hội mới do công nghệ tiến bộ nhanh chóng, nhu cầu của người tiêu dùng thay đổi và nhu cầu đóng góp tích cực cho sức khỏe môi trường, con người và động vật mang lại."}, {"en": "Efficient, science-based animal agriculture translates into affordable and high-quality food for the consumer.", "vi": "Ngành chăn nuôi hiệu quả dựa trên cơ sở khoa học mang lại nguồn thực phẩm chất lượng cao và giá cả phải chăng cho người tiêu dùng."}, {"en": "Researchers collaborate with industry and other interested parties to develop and disseminate knowledge and methods to improve agriculturally relevant animal systems.", "vi": "Các nhà nghiên cứu hợp tác với ngành công nghiệp và các bên liên quan khác để phát triển và phổ biến kiến thức cũng như phương pháp nhằm cải thiện các hệ thống vật nuôi liên quan đến nông nghiệp."}, {"en": "1. Animal Breeding, Genetics & Genomics: Animal protein is essential in meeting escalating nutritional needs around the world.", "vi": "1. Nhân giống, Di truyền & Bộ gen Động vật: Protein động vật là thiết yếu để đáp ứng nhu cầu dinh dưỡng ngày càng tăng trên toàn thế giới."}, {"en": "Animal Breeding, Genetics & Genomics research focuses on desirable genetic animal traits that have revolutionized poultry, livestock, and fish production.", "vi": "Nghiên cứu về Nhân giống, Di truyền & Bộ gen động vật tập trung vào các tính trạng di truyền mong muốn ở động vật, vốn đã cách mạng hóa ngành sản xuất gia cầm, gia súc và cá."}, {"en": "These genetic traits include animals that are leaner; have increased disease resistance; or excel in growth rate or the production of eggs, meat, milk, wool, or mohair.", "vi": "Các tính trạng di truyền này bao gồm động vật ít mỡ (nhiều nạc) hơn; có khả năng kháng bệnh tăng lên; hoặc vượt trội về tốc độ tăng trưởng hoặc sản lượng trứng, thịt, sữa, len hoặc vải nỉ (mohair)."}, {"en": "The natural efficiency of an animal to use nutrients in its feed could affect the nutrients in the manure and thus affect the environment.", "vi": "Hiệu quả tự nhiên của động vật trong việc sử dụng chất dinh dưỡng trong thức ăn có thể ảnh hưởng đến chất dinh dưỡng trong phân và do đó ảnh hưởng đến môi trường."}, {"en": "2. Animal Nutrition and Growth: Inefficient nutrient intake by animals is financially and environmentally costly in animal operations from livestock farms to fish farms.", "vi": "2. Dinh dưỡng và Tăng trưởng Động vật: Sự hấp thụ chất dinh dưỡng không hiệu quả ở động vật gây tốn kém về mặt tài chính và môi trường trong các hoạt động chăn nuôi từ trang trại gia súc đến trang trại nuôi cá."}, {"en": "It not only hurts animal growth, health, and well-being, but it may also affect the safety and quality of the food products.", "vi": "Nó không chỉ làm tổn hại đến sự tăng trưởng, sức khỏe và sự thoải mái của động vật mà còn có thể ảnh hưởng đến sự an toàn và chất lượng của các sản phẩm thực phẩm."}, {"en": "It may result in excess nutrients polluting the environment in the form of odors or ground water contamination.", "vi": "Nó có thể dẫn đến việc dư thừa chất dinh dưỡng gây ô nhiễm môi trường dưới dạng mùi hôi hoặc ô nhiễm nguồn nước ngầm."}, {"en": "The primary objective of the Animal Growth and Nutrition Program is to discover the nutritional, biological, and genetic factors underlying normal animal growth, nutrient digestion and efficiency, metabolism, lactation, and muscle and bone development.", "vi": "Mục tiêu chính của Chương trình Dinh dưỡng và Tăng trưởng Động vật là phát hiện ra các yếu tố dinh dưỡng, sinh học và di truyền làm cơ sở cho sự tăng trưởng bình thường của động vật, sự tiêu hóa và hiệu quả dinh dưỡng, sự trao đổi chất, sự tiết sữa, cũng như sự phát triển của cơ và xương."}, {"en": "3. Animal Products: Americans buy approximately $100 billion of animal products at the farm gate, and several times that amount at retail each year.", "vi": "3. Các sản phẩm từ Động vật: Người Mỹ mua khoảng 100 tỷ đô la các sản phẩm từ động vật tại trang trại và gấp nhiều lần số đó tại các cửa hàng bán lẻ mỗi năm."}, {"en": "These products include meat and meat products, poultry products (meat and eggs), fish, shellfish, dairy products (milk and cheese), and non-food products such as fiber (wool, mohair, cashmere, and leather).", "vi": "Các sản phẩm này bao gồm thịt và các sản phẩm từ thịt, sản phẩm gia cầm (thịt và trứng), cá, động vật có vỏ (sò, hến,...), sản phẩm từ sữa (sữa và phô mai), và các sản phẩm phi thực phẩm như xơ sợi (len, vải nỉ mohair, len cashmere và da)."}, {"en": "The quality and safety of animal products prior to harvest are influenced by genetics, nutrition, and management systems.", "vi": "Chất lượng và độ an toàn của các sản phẩm động vật trước khi thu hoạch chịu ảnh hưởng bởi di truyền, dinh dưỡng và hệ thống quản lý."}, {"en": "After harvest they are affected by handling, processing, storage, and marketing practices.", "vi": "Sau khi thu hoạch, chúng bị ảnh hưởng bởi các phương thức vận chuyển/xử lý, chế biến, bảo quản và tiếp thị."}, {"en": "4. Animal Reproduction: Reproductive efficiency is the major factor affecting profitability in many livestock production systems.", "vi": "4. Sinh sản ở Động vật: Hiệu quả sinh sản là yếu tố chính ảnh hưởng đến lợi nhuận trong nhiều hệ thống sản xuất chăn nuôi."}, {"en": "For example, the fertility of domestic ruminants (cattle and sheep), even under optimal conditions, is only about 50 percent.", "vi": "Ví dụ, khả năng sinh sản của động vật nhai lại (trâu bò và cừu), ngay cả trong điều kiện tối ưu, chỉ khoảng 50%."}, {"en": "Inefficient reproduction may be caused by numerous factors, including increased genetic selection for meat or milk production traits, early embryonic and fetal loss, failure to reach puberty at an optimum age, environmental stressors, production of low-potency sperm, and limited sex drive.", "vi": "Sinh sản kém hiệu quả có thể do nhiều yếu tố gây ra, bao gồm việc tăng cường chọn lọc di truyền cho các tính trạng sản xuất thịt hoặc sữa, sảy phôi và thai sớm, không đạt tuổi thành thục sinh sản ở độ tuổi tối ưu, các yếu tố gây căng thẳng từ môi trường, sản xuất tinh trùng chất lượng thấp và hạn chế ham muốn tình dục."}, {"en": "5. Animal Well-being: Evaluating farm animal well-being is a challenge to the animal food industry and scientific communities.", "vi": "5. Phúc lợi Động vật: Đánh giá phúc lợi của vật nuôi trang trại là một thách thức đối với ngành công nghiệp thực phẩm động vật và các cộng đồng khoa học."}, {"en": "Scientists study how to accurately measure an animal’s state of comfort and well-being in different environmental conditions.", "vi": "Các nhà khoa học nghiên cứu cách đo lường chính xác trạng thái thoải mái và khỏe mạnh của động vật trong các điều kiện môi trường khác nhau."}, {"en": "They also work to understand how animals react both behaviorally and biologically in stressful situations, such as in transport, or when animals must be restrained during medical treatment.", "vi": "Họ cũng nghiên cứu để hiểu cách động vật phản ứng cả về hành vi và sinh học trong các tình huống căng thẳng, chẳng hạn như khi vận chuyển hoặc khi động vật phải bị cố định trong quá trình đánh giá hoặc điều trị y tế."}, {"en": "These understandings are important to those who work with animals as pets, livestock, or wildlife to ensure the safety and well-being of both animals and humans as they interact.", "vi": "Những hiểu biết này rất quan trọng đối với những người làm việc với động vật với tư cách là thú cưng, gia súc hoặc động vật hoang dã để đảm bảo sự an toàn và phúc lợi của cả động vật và con người khi họ tương tác."}], "extra": [], "vocab": [["Agriculture (n)", "['æ   gri   kʌl   t∫ə]", "Nông nghiệp"], ["Significant (adj)", "[sig  'ni  fi  kənt]", "Quan trọng"], ["Portion (n)", "['pɔ:∫n]", "Phần"], ["Production (n)", "", "Sự sản xuất"], ["Address (v)", "[ə'dres]", "Giải quyết"], ["Challenges (n)", "['t∫ælindʒ]", "Thách thứC. thử thách"], ["Rapidly advancing technology", "['ræ pid li] [əd'vɑ:n sin] [tek'nɔlədʒi]", "Công nghệ tiến bộ nhanh chóng"], ["Evolve", "[i'vɔl - vin]", "Đang tiến triển"], ["Efficient", "[i'fi∫ənt]", "Hiệu quả"], ["Affordable", "[ə'fɔ:də bl]", "Phải chăng"], ["Consumer", "[kən'sju:mə]", "Người tiêu thụ/ tiêu dùng"], ["Disseminate (n)", "[di'se mi neit]", "Phổ biến, truyền bá"], ["Knowledge (n)", "['nɔ lidʒ]", "Sự hiểu biết, kiến thức"], ["Relevant", "['reləvənt]", "Liên quan"], ["Breeding", "['bri:diη]", "Sự sinh sản, Gây giống"], ["Genetics", "[dʒi'netiks]", "Di truyền"], ["Genomics", "[dʒi'noumik]", "Gen"], ["Escalating", "['es kə lei tin]", "Leo thang"], ["Nutritional", "[nju:'tri∫nl]", "(thuộc) Dinh dưỡng"], ["Desirable", "[di'zaiərəbl]", "Ao ướC. mong dợi"], ["Trait", "[treit]", "Nét, điểm"], ["Revolutionize", "[,revə'lu:∫ənaiz]", "Cách mạng hóa"], ["Poultry", "['poul tri]", "Gia cầm"], ["Livestock", "['laiv stɔk]", "Vật nuôi, thú nuôi"], ["Leaner", "[‘li:nə]", "ốm hơn"], ["Excel", "[ik'sel]", "Trội"], ["Wool", "[wul]", "Len"], ["Mohair", "['mou heə]", "Vải nỉ"], ["Manure", "[mə'njuə]", "Phân bón"], ["Growth", "[grouθ]", "Sư tăng trưởng, phát triển"], ["Intake (n)", "['inteik]", "Sự hấp thu"], ["Odor", "['oudə]", "Mùi/ dấu vết"], ["contamination", "[kən ,tæmi 'nei ∫n]", "sự làm bẩn, sự làm ô uế"], ["Digestion", "[di'dʒest∫n]", "Sự tiêu hóa"], ["metabolism", "[mə'tæbəliz     results.push({tab, lesson:ll.title, lessonId:ll.id, term:v[0], phon:v[1]||'', mean:v[2]||'', color:ll.color});
   }
  });
 });
 const area=document.getElementById('contentArea');
 if(results.length===0){
  area.innerHTML=`<div class="card rounded-2xl p-8 text-center"><div class="text-2xl mb-2">🔍</div><div class="font-bold">Không tìm thấy từ nào với "${e.target.value}"</div><div class="text-xs text-gray-500 mt-2">Thử tìm theo tiếng Anh, phiên âm hoặc nghĩa Việt</div></div>`;
  return;
 }
 area.innerHTML=`<div class="card rounded-2xl p-5">
  <div class="flex justify-between items-center mb-4">
   <div class="font-bold">Kết quả "${e.target.value}" - ${results.length} từ</div>
   <div class="text-xs text-gray-500">Có phiên âm + audio 🔊</div>
  </div>
  <div class="space-y-2" id="searchResults"></div>
 </div>`;
 const container=area.querySelector('#searchResults');
 results.forEach((r, idx)=>{
  const row=document.createElement('div');
  row.className='py-3 px-3 rounded-xl bg-[#0F0F0F] border border-[#1E1E1E] flex items-center justify-between gap-3 hover:border-[#2A2A2A] transition';
  row.style.borderLeft='4px solid '+r.color;
  row.innerHTML=`
   <div class="flex-1 min-w-0">
    <div class="flex items-center gap-2 flex-wrap">
     <span class="font-bold text-[14px] text-[#E5E7EB]">${r.term}</span>
     <span class="text-[11px] px-2 py-[1px] rounded-full bg-[#1E1E1E] border border-[#2A2A2A] text-[#8CB580]">${r.lesson}</span>
    </div>
    <div class="flex items-center gap-3 mt-1">
     <span class="text-xs text-gray-400 font-mono italic">${r.phon ? r.phon : '<span class=text-gray-600>không có phiên âm</span>'}</span>
     <span class="text-[11px] text-gray-500">•</span>
     <span class="text-xs text-[#9CA3AF]">${r.mean}</span>
    </div>
   </div>
   <div class="flex items-center gap-2">
    <button class="searchSpeak w-8 h-8 rounded-full bg-[#2A2A2A] hover:bg-[#333] flex items-center justify-center text-xs" data-idx="${idx}">🔊</button>
    <button class="goLesson w-8 h-8 rounded-full bg-[#1E1E1E] border border-[#2A2A2A] hover:bg-[#2A2A2A] flex items-center justify-center text-[11px]" data-idx="${idx}" title="Đi đến bài">📖</button>
   </div>
  `;
  container.appendChild(row);
 });
 container.querySelectorAll('.searchSpeak').forEach(btn=>{
  btn.onclick=()=>{
   const r=results[parseInt(btn.dataset.idx)];
   speakSingle(cleanForSpeech(r.term));
   btn.textContent='🔈';
   setTimeout(()=>{btn.textContent='🔊';},800);
  };
 });
 container.querySelectorAll('.goLesson').forEach(btn=>{
  btn.onclick=()=>{
   const r=results[parseInt(btn.dataset.idx)];
   currentLesson = lessons.findIndex(ll=>ll.id===r.lessonId);
   if(currentLesson<0) currentLesson=0;
   currentTab=r.tab||'vocab';
   document.getElementById('searchAll').value='';
   renderAll();
  };
 });
};
document.getElementById('playAll').onclick=()=>{if(isPlayingAll){if(synth.speaking&&!synth.paused){synth.pause(); document.getElementById('playAll').textContent='▶️ Tiếp tục';}else if(synth.paused){synth.resume(); document.getElementById('playAll').textContent='⏸️ Đang đọc...';}else{playAllFrom(currentReadingIndex);} return;} playAllFrom(0);};
document.getElementById('pauseBtn').onclick=()=>{if(!synth.speaking&&!synth.paused) return; if(synth.paused){synth.resume(); document.getElementById('pauseBtn').textContent='⏸';}else{synth.pause(); document.getElementById('pauseBtn').textContent='▶️';}};
document.getElementById('stopBtn').onclick=()=>{stopAll();};
document.querySelectorAll('.speedBtn').forEach(b=>{b.onclick=()=>{rate=parseFloat(b.dataset.speed); document.querySelectorAll('.speedBtn').forEach(x=>{x.className='speedBtn px-3 py-1 rounded-full bg-[#2A2A2A] text-xs';}); b.className='speedBtn px-3 py-1 rounded-full bg-[#8CB580] text-black text-xs';};});
document.getElementById('exportBtn').onclick=()=>{const data=JSON.stringify(lessons,null,2); const blob=new Blob([data],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='avcn_full_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); const t=document.createElement('div'); t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#8CB580] text-black px-4 py-2 rounded-full text-sm font-medium shadow-lg z-50'; t.textContent='✅ Đã xuất JSON - giữ file này để không mất dữ liệu'; document.body.appendChild(t); setTimeout(()=>t.remove(),2500);};

// Nút lưu vĩnh viễn ra file HTML mới
const saveHtmlBtn=document.createElement('button');
saveHtmlBtn.id='saveHtmlBtn';
saveHtmlBtn.className='px-3 py-1.5 bg-[#FACC15] text-black rounded-full text-sm font-bold hover:bg-[#EAB308]';
saveHtmlBtn.textContent='💾 Lưu ra HTML';
saveHtmlBtn.title='Tạo file HTML mới chứa toàn bộ dữ liệu hiện tại - mở lại sẽ giữ nguyên';
document.querySelector('.ml-auto.flex.gap-2').appendChild(saveHtmlBtn);
saveHtmlBtn.onclick=()=>{
  try{
    saveLessons();
    const src=__PRISTINE_HTML; const marker='const lessons = ';
    const st=src.indexOf(marker); const en=src.indexOf('\n',st);
    if(st<0||en<0) throw new Error('không tìm thấy dữ liệu bài học');
    const data=JSON.stringify(lessons).replace(/<\//g,'<\\/');
    const newHtml=src.slice(0,st)+marker+data+';'+src.slice(en);
    const url=URL.createObjectURL(new Blob([newHtml],{type:'text/html'}));
    const a=document.createElement('a'); a.href=url; a.download='English_Veterinary_Medicine_Full_'+new Date().toISOString().slice(0,10)+'.html'; a.click();
    toast('✅ Đã lưu HTML mới – mở file này sẽ giữ đủ dữ liệu','#FACC15');
  }catch(e){
    alert('Lỗi lưu HTML: '+e.message+' - Hãy dùng Xuất JSON để lưu');
  }
};

// Nút nhập lại JSON
const importBtn=document.createElement('button');
importBtn.className='px-3 py-1.5 bg-[#1E1E1E] border border-[#2A2A2A] rounded-full text-sm';
importBtn.textContent='📥 Nhập JSON';
document.querySelector('.ml-auto.flex.gap-2').appendChild(importBtn);
const importInput=document.createElement('input'); importInput.type='file'; importInput.accept='.json'; importInput.style.display='none'; document.body.appendChild(importInput);
importBtn.onclick=()=>importInput.click();
importInput.onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(Array.isArray(parsed) && parsed.length>0){
        // Ghi đè lessons
        for(let i=0;i<Math.min(parsed.length, lessons.length);i++){
          if(parsed[i].reading) lessons[i].reading=parsed[i].reading;
          if(parsed[i].vocab) lessons[i].vocab=parsed[i].vocab;
          if(parsed[i].practice) lessons[i].practice=parsed[i].practice;
          if(parsed[i].extra) lessons[i].extra=parsed[i].extra;
          if(parsed[i].hard) lessons[i].hard=parsed[i].hard;
        }
        saveLessons(); renderAll();
        const t=document.createElement('div'); t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#8CB580] text-black px-4 py-2 rounded-full text-sm font-medium shadow-lg z-50'; t.textContent='✅ Đã nhập lại dữ liệu từ JSON'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
      }
    }catch(err){ alert('File JSON lỗi: '+err.message); }
  };
  reader.readAsText(file);
};

(function(){
 const b=document.getElementById('viToggle');
 const paint=()=>{ b.textContent='🇻🇳 Đọc cả TV: '+(readVi?'Bật':'Tắt'); b.className='px-3 py-1 rounded-full text-xs '+(readVi?'bg-[#FACC15] text-black font-bold':'bg-[#2A2A2A]'); };
 paint();
 b.onclick=()=>{ readVi=!readVi; try{localStorage.setItem('avcn_readvi',readVi?'1':'0');}catch(e){} paint();
  if(readVi && voices.length && !voices.some(v=>/^vi/i.test(v.lang))) toast('⚠️ Máy chưa có giọng đọc tiếng Việt – hãy dùng Microsoft Edge hoặc cài giọng Việt','#FACC15'); };
})();
renderAll();
</script>
